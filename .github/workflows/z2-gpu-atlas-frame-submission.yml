name: z2-gpu-atlas-frame-submission

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - work/z2f-bounded-gpu-atlas-frame-submission

permissions:
  contents: write

jobs:
  patch-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-gpu-atlas-frame-submission
          fetch-depth: 0
      - name: Replace unique-page oracle
        env:
          VERIFY_CASE_GZIP_BASE64: 
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          path = Path('tests/gpu_atlas_frame_submission_equivalence_tests.cpp')
          text = path.read_text(encoding='utf-8')
          if '#include <algorithm>\n' not in text:
              text = text.replace('#include <array>\n', '#include <algorithm>\n#include <array>\n', 1)
          start = text.index('void verify_case(')
          end = text.index('\n}\n\n} // namespace', start) + 2
          replacement = gzip.decompress(
              base64.b64decode(os.environ['VERIFY_CASE_GZIP_BASE64']))
          replacement = replacement.decode('utf-8')
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/gpu_atlas_frame_submission_equivalence_tests.cpp
          git commit -m "Correct GPU frame unique-page equivalence oracle"
          git push origin HEAD:work/z2f-bounded-gpu-atlas-frame-submission
