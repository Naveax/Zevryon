name: Z3 offscreen materialization authority

on:
  pull_request:
    paths:
      - 'src/css_style_dag_v1.*'
      - 'src/css_style_materialization_v1.*'
      - 'src/css_style_materialization_window_v1.*'
      - 'tests/css_style_materialization_v1_tests.cpp'
      - 'tests/css_style_materialization_window_v1_tests.cpp'
      - 'tests/css_offscreen_materialization_authority_v1_tests.cpp'
      - 'tests/test_z3_offscreen_materialization_authority_scope.py'
      - 'certification/z3_offscreen_materialization_authority_scope.json'
      - 'cmake/css_style_dag_v1.cmake'
      - 'cmake/css_style_materialization_v1.cmake'
      - 'cmake/css_style_materialization_window_v1.cmake'
      - 'cmake/coretext_discovery.cmake'
      - '.github/workflows/z3-offscreen-materialization-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z3-offscreen-materialization-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install focused build dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DZEVRYON_ENABLE_FONTCONFIG_DISCOVERY=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build production offscreen authority
        run: >-
          cmake --build build --parallel 2
          --target zevryon-css-style-materialization-v1-tests zevryon-css-style-materialization-window-v1-tests zevryon-css-offscreen-materialization-authority-v1-tests
      - name: Execute production offscreen authority
        run: |
          build/zevryon-css-style-materialization-v1-tests
          build/zevryon-css-style-materialization-window-v1-tests
          build/zevryon-css-offscreen-materialization-authority-v1-tests
      - name: Validate authority scope
        run: python3 tests/test_z3_offscreen_materialization_authority_scope.py
      - name: Validate authority JSON
        run: python3 -m json.tool certification/z3_offscreen_materialization_authority_scope.json > /dev/null

  windows-authority:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DZEVRYON_ENABLE_DIRECTWRITE_DISCOVERY=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build production offscreen authority
        shell: pwsh
        run: cmake --build build --config Release --parallel 2 --target zevryon-css-style-materialization-v1-tests zevryon-css-style-materialization-window-v1-tests zevryon-css-offscreen-materialization-authority-v1-tests
      - name: Execute production offscreen authority
        shell: pwsh
        run: |
          build/Release/zevryon-css-style-materialization-v1-tests.exe
          build/Release/zevryon-css-style-materialization-window-v1-tests.exe
          build/Release/zevryon-css-offscreen-materialization-authority-v1-tests.exe
      - name: Validate authority scope
        shell: pwsh
        run: python tests/test_z3_offscreen_materialization_authority_scope.py
      - name: Validate authority JSON
        shell: pwsh
        run: python -m json.tool certification/z3_offscreen_materialization_authority_scope.json > $null
