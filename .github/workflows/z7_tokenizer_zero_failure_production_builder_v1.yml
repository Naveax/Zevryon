name: Z7 tokenizer zero-failure production builder v1

on:
  push:
    branches:
      - candidate/z7-tokenizer-zero-failure-production-v1

permissions:
  contents: write

jobs:
  build-production:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply proven production slices
        run: |
          set -euo pipefail
          python3 scripts/apply_z7_zero_parse_after_data_unicode_production_v1.py
          python3 scripts/apply_z7_zero_token_mismatch_after_data_unicode_production_v1.py
          git diff --check
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused tokenizer targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-html-tokenizer-data-tags-v1-tests
          zevryon-html-tokenizer-markup-declarations-v1-tests
          zevryon-html-tokenizer-token-stream-v1-tests
          zevryon-html-tokenizer-script-data-v1-tests
          zevryon-html-tokenizer-token-stream-v1-probe
      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build/zevryon-html-tokenizer-data-tags-v1-tests
          ./build/zevryon-html-tokenizer-markup-declarations-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests
          ./build/zevryon-html-tokenizer-script-data-v1-tests
      - name: Verify corpus harnesses
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --self-test
      - name: Require exact zero-failure no-regression authority
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py \
            --policy no-regression \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('census.json').read_text(encoding='utf-8'))
          assert r['files'] == 14, r
          assert r['tests'] == 6810, r
          assert r['executions'] == 7036, r
          assert r['passed'] == 6983, r
          assert r['failed'] == 0, r
          assert r['unsupported'] == 53, r
          assert r['reason_counts'].get('failed:parse-error-stream-mismatch', 0) == 0, r
          assert r['reason_counts'].get('failed:token-stream-mismatch', 0) == 0, r
          assert r['reason_counts'].get('unsupported:input-preprocessing-nul', 0) == 19, r
          assert r['baseline_policy'] == 'no-regression', r
          assert r['baseline_regression_free'] is True, r
          assert r['exact_execution_accounting'] is True, r
          assert r['full_corpus_pass_claim'] is False, r
          assert r['html_tokenizer_conformance_claim'] is False, r
          assert r['z7_status_change'] is False, r
          print('ZERO_FAILURE_PRODUCTION_TOTALS', r['passed'], r['failed'], r['unsupported'])
          PY
      - name: Publish clean production commit
        run: |
          set -euo pipefail
          rm -f scripts/apply_z7_zero_parse_after_data_unicode_production_v1.py
          rm -f scripts/apply_z7_zero_token_mismatch_after_data_unicode_production_v1.py
          rm -f .github/workflows/z7_tokenizer_zero_failure_production_builder_v1.yml
          git add src/html_tokenizer_data_tags_v1.cpp \
                  src/html_tokenizer_markup_declarations_v1.cpp \
                  src/html_tokenizer_token_stream_v1.cpp \
                  src/html_tokenizer_script_data_v1.cpp \
                  scripts/apply_z7_zero_parse_after_data_unicode_production_v1.py \
                  scripts/apply_z7_zero_token_mismatch_after_data_unicode_production_v1.py \
                  .github/workflows/z7_tokenizer_zero_failure_production_builder_v1.yml
          git diff --cached --check
          git config user.name "Naveax"
          git config user.email "Omersevik095@gmail.com"
          git commit -m "Z7: eliminate remaining tokenizer corpus failures"
          git push origin HEAD:candidate/z7-tokenizer-zero-failure-production-v1
