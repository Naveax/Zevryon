name: Z2R Rust core certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust/**"
      - "src/rust_resource_ledger.*"
      - "src/shadow_resource_ledger.*"
      - "src/zevryon_rust_ffi.h"
      - "src/resource_ledger.*"
      - "tests/rust_resource_ledger_equivalence_tests.cpp"
      - "tests/rust_resource_ledger_benchmark.cpp"
      - "tests/shadow_resource_ledger_tests.cpp"
      - "tests/rust_ffi_c_abi_tests.c"
      - ".github/workflows/z2r0-rust-core-foundation.yml"

permissions:
  contents: read

concurrency:
  group: z2r-rust-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: ${{ matrix.os }} Rust/C/C++ shadow certification
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Report toolchains
        run: |
          rustc --version --verbose
          cargo --version
          cmake --version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Configure standalone bridge
        run: cmake -S rust/bridge -B build-rust -DCMAKE_BUILD_TYPE=Release

      - name: Build Rust C C++ shadow and benchmark targets
        run: >-
          cmake --build build-rust --config Release --parallel 2 --target
          zevryon-rust-resource-ledger-tests
          zevryon-rust-shadow-ledger-tests
          zevryon-rust-resource-ledger-benchmark
          zevryon-rust-c-abi-tests

      - name: Run exact equivalence shadow and performance certification
        run: >-
          ctest --test-dir build-rust -C Release --output-on-failure
          -R "rust-(resource-ledger-equivalence|shadow-resource-ledger|resource-ledger-performance|c-abi-runtime)"

      - name: Upload ledger performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z2r1-ledger-performance-${{ matrix.os }}-${{ github.sha }}
          path: build-rust/z2r1-ledger-performance.json
          if-no-files-found: warn
