name: Z2R-0 Rust core foundation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/z2r0-rust-core-foundation
    paths:
      - "rust/**"
      - "src/rust_resource_ledger.*"
      - "src/zevryon_rust_ffi.h"
      - "src/resource_ledger.*"
      - "tests/rust_resource_ledger_equivalence_tests.cpp"
      - "tests/rust_ffi_c_abi_tests.c"
      - ".github/workflows/z2r0-rust-core-foundation.yml"
  pull_request:
    paths:
      - "rust/**"
      - "src/rust_resource_ledger.*"
      - "src/zevryon_rust_ffi.h"
      - "src/resource_ledger.*"
      - "tests/rust_resource_ledger_equivalence_tests.cpp"
      - "tests/rust_ffi_c_abi_tests.c"
      - ".github/workflows/z2r0-rust-core-foundation.yml"

permissions:
  contents: read

concurrency:
  group: z2r0-rust-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: ${{ matrix.os }} Rust/C/C++ equivalence
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Report toolchains
        run: |
          rustc --version --verbose
          cargo --version
          cmake --version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Configure standalone bridge
        run: cmake -S rust/bridge -B build-rust -DCMAKE_BUILD_TYPE=Release

      - name: Build Rust C and C++ certification targets
        run: cmake --build build-rust --config Release --target zevryon-rust-resource-ledger-tests zevryon-rust-c-abi-tests --parallel 2

      - name: Run Rust C and C++ certification tests
        run: ctest --test-dir build-rust -C Release --output-on-failure -R "rust-(resource-ledger-equivalence|c-abi-runtime)"
