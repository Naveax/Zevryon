name: Z2R Rust core certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/rust_core.cmake"
      - "rust/**"
      - "src/ledger_memory_resource.*"
      - "src/rust_resource_ledger.*"
      - "src/shadow_resource_ledger.*"
      - "src/zevryon_rust_ffi.h"
      - "src/resource_ledger.*"
      - "tests/resource_ledger_tests.cpp"
      - "tests/rust_resource_ledger_equivalence_tests.cpp"
      - "tests/rust_resource_ledger_benchmark.cpp"
      - "tests/shadow_resource_ledger_tests.cpp"
      - "tests/rust_ffi_c_abi_tests.c"
      - "tests/check_z2r1_ledger_baseline.py"
      - ".github/workflows/z2r0-rust-core-foundation.yml"

permissions:
  contents: read

concurrency:
  group: z2r-rust-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: ${{ matrix.os }} Rust/C/C++ production shadow certification
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Report toolchains
        run: |
          rustc --version --verbose
          cargo --version
          cmake --version
          python --version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Configure standalone bridge
        run: cmake -S rust/bridge -B build-rust -DCMAKE_BUILD_TYPE=Release

      - name: Build Rust C C++ shadow and benchmark targets
        run: >-
          cmake --build build-rust --config Release --parallel 2 --target
          zevryon-rust-resource-ledger-tests
          zevryon-rust-shadow-ledger-tests
          zevryon-rust-resource-ledger-benchmark
          zevryon-rust-c-abi-tests

      - name: Run exact equivalence shadow and performance certification
        run: >-
          ctest --test-dir build-rust -C Release --output-on-failure
          -R "rust-(resource-ledger-equivalence|shadow-resource-ledger|resource-ledger-performance|c-abi-runtime)"

      - name: Enforce measured performance ratios
        run: python tests/check_z2r1_ledger_baseline.py build-rust/z2r1-ledger-performance.json

      - name: Configure root production Rust shadow
        run: >-
          cmake -S . -B build-production-shadow
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=ON
          -DZEVRYON_RUST_LEDGER_SHADOW=ON
          -DZEVRYON_RUST_LEDGER_SHADOW_STRICT=ON
          -DZEVRYON_RUST_LEDGER_SHADOW_INTERVAL=64

      - name: Build production shadow core and representative tests
        run: >-
          cmake --build build-production-shadow --config Release --parallel 2 --target
          zevryon-resource-ledger-tests
          zevryon-massivedoc-tests
          zevryon-compact-document-tests
          zevryon-layout-window-tests
          zevryon-unicode-stream-tests

      - name: Run production shadow representative tests
        run: >-
          ctest --test-dir build-production-shadow -C Release --output-on-failure
          -R "(resource-ledger|massivedoc-store|compact-document|layout-window|unicode-stream)-tests"

      - name: Upload ledger performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z2r1-ledger-performance-${{ matrix.os }}-${{ github.sha }}
          path: build-rust/z2r1-ledger-performance.json
          if-no-files-found: warn
