name: z2-line-box-layout

on:
  pull_request:
    paths:
      - '.github/workflows/z2-line-box-layout.yml'
      - 'cmake/line_box_layout.cmake'
      - 'cmake/line_fragment_layout.cmake'
      - 'src/font_line_metrics.*'
      - 'src/line_box_layout.*'
      - 'src/line_fragment_layout.*'
      - 'src/multi_run_harfbuzz_shaper.*'
      - 'src/harfbuzz_shaper.*'
      - 'src/font_resource_sfnt.*'
      - 'src/verified_font_resource.*'
      - 'tests/font_line_metrics_tests.cpp'
      - 'tests/line_box_layout_tests.cpp'
      - 'tests/line_box_layout_equivalence_tests.cpp'
      - 'docs/Z2E2_BOUNDED_LINE_BOX_METRICS.md'
  workflow_dispatch:

concurrency:
  group: z2-line-box-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-font-line-metrics-tests \
            zevryon-line-box-layout-tests \
            zevryon-line-box-layout-equivalence-tests \
            zevryon-line-box-layout-benchmark \
            zevryon-line-fragment-layout-tests \
            2>&1 | tee line-box-build.log
      - name: Repeat line-box certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^line-box-layout-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee line-box-repeat.log
      - name: Certify SFNT metric extraction
        run: |
          set -o pipefail
          ctest --test-dir build -R '^font-line-metrics-tests$' \
            --output-on-failure 2>&1 | tee font-line-metrics.log
      - name: Exhaustively certify metric scaling
        run: |
          set -o pipefail
          ctest --test-dir build -R '^line-box-layout-equivalence-tests$' \
            --output-on-failure 2>&1 | tee line-box-equivalence.log
      - name: Run three independent distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-line-box-layout-benchmark \
              > "line-box-benchmark-${run}.json"
          done
      - name: Enforce exact output, memory and latency gates
        run: |
          python3 - <<'PY'
          import json

          rows = []
          for run in range(1, 4):
              with open(f'line-box-benchmark-{run}.json', encoding='utf-8') as handle:
                  row = json.load(handle)
              assert row['schema'] == 'zevryon.line-box-layout-benchmark.v1'
              assert row['input_lines'] == 1_024
              assert row['input_fragments'] == 4_096
              assert row['input_segments'] == 4_096
              assert row['input_metric_records'] == 4
              assert row['output_lines'] == 1_024
              assert row['output_fragment_metrics'] == 4_096
              assert row['empty_lines'] == 0
              assert row['expanded_lines'] == 1_024
              assert row['mixed_metric_lines'] == 1_024
              assert row['os2_fragment_metrics'] == 3_072
              assert row['hhea_fragment_metrics'] == 1_024
              assert row['negative_gap_fragment_metrics'] == 1_024
              assert row['line_record_bytes'] == 48
              assert row['fragment_metric_bytes'] == 32
              assert row['retained_bytes'] == 180_224
              assert row['peak_bytes'] == 180_224
              assert row['hard_limit_bytes'] == 180_224
              assert row['total_block_extent'] == 1_331_200
              assert row['maximum_line_block_size'] == 1_300
              assert row['maximum_line_ascent'] == 950
              assert row['maximum_line_descent'] == 350
              assert row['maximum_fragment_block_size'] == 1_300
              assert row['checksum'] == 8_906_344_429_214_245_763
              assert row['within_hard_limits'] is True
              assert row['accounting_clean'] is True
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 8.0, row
              assert row['p99_ms'] <= 12.0, row
              assert row['maximum_ms'] <= 20.0, row
              rows.append(row)
          assert len({row['checksum'] for row in rows}) == 1
          print({
              'p50_ms': [row['p50_ms'] for row in rows],
              'p95_ms': [row['p95_ms'] for row in rows],
              'p99_ms': [row['p99_ms'] for row in rows],
              'maximum_ms': [row['maximum_ms'] for row in rows],
              'checksum': rows[0]['checksum'],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-line-box-layout-${{ github.sha }}
          path: |
            line-box-build.log
            line-box-repeat.log
            font-line-metrics.log
            line-box-equivalence.log
            line-box-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests under sanitizers
        run: >-
          cmake --build build-sanitized --parallel 2 --target
          zevryon-font-line-metrics-tests
          zevryon-line-box-layout-tests
          zevryon-line-box-layout-equivalence-tests
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^(font-line-metrics-tests|line-box-layout-(tests|equivalence-tests))$' --output-on-failure

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build benchmark and focused tests
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-font-line-metrics-tests \
            zevryon-line-box-layout-tests \
            zevryon-line-box-layout-equivalence-tests \
            zevryon-line-box-layout-benchmark \
            2>&1 | tee apple-line-box-build.log
          ctest --test-dir build -R '^(font-line-metrics-tests|line-box-layout-(tests|equivalence-tests))$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-line-box-layout-appleclang-${{ github.sha }}
          path: apple-line-box-build.log
          if-no-files-found: warn
