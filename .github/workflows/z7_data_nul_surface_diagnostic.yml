name: Z7 Data-family NUL surface diagnostic

on:
  push:
    branches:
      - diagnostic/z7-data-nul-surface-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: diagnostic/z7-data-nul-surface-v1

      - name: Enumerate all NUL-preclassified executions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          module_path = root / "scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py"
          spec = importlib.util.spec_from_file_location("z7_census", module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          manifest = json.loads(module.DEFAULT_MANIFEST.read_text(encoding="utf-8"))
          samples = []
          state_counts = Counter()
          file_counts = Counter()

          for entry in manifest["files"]:
              upstream_path = entry["upstream_path"]
              payload = json.loads((root / entry["vendored_path"]).read_text(encoding="utf-8"))
              for test_index, raw_test in enumerate(payload[entry["test_array_key"]]):
                  test = module.unescape_double_value(raw_test) if raw_test.get("doubleEscaped", False) is True else raw_test
                  input_text = test["input"]
                  last_start_tag = test.get("lastStartTag", "")
                  states = test.get("initialStates", ["Data state"])
                  label_base = f"{upstream_path} test[{test_index}] {raw_test['description']}"
                  tokens = module.expected_tokens(test, label_base)
                  for state_name in states:
                      reason = module.classify_pre_execution(
                          upstream_path,
                          state_name,
                          input_text,
                          last_start_tag,
                          tokens,
                      )
                      if reason != "input-preprocessing-nul":
                          continue
                      sample = {
                          "label": f"{label_base} [{state_name}]",
                          "state": state_name,
                          "file": upstream_path,
                          "input_repr": repr(input_text),
                          "nul_offsets": [index for index, ch in enumerate(input_text) if ch == "\x00"],
                      }
                      samples.append(sample)
                      state_counts[state_name] += 1
                      file_counts[upstream_path] += 1

          payload = {
              "count": len(samples),
              "state_counts": dict(sorted(state_counts.items())),
              "file_counts": dict(sorted(file_counts.items())),
              "samples": samples,
          }
          Path("nul-surface.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, ensure_ascii=False, sort_keys=True))
          assert len(samples) == 61, payload
          PY

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: z7-data-nul-surface
          path: nul-surface.json
          if-no-files-found: error

      - name: Block publication from diagnostic branch
        run: |
          echo "Diagnostic-only branch; no production publication." >&2
          exit 1
