name: z2-native-platform-adapters

on:
  pull_request:
    paths:
      - '.github/workflows/z2-native-platform-adapters.yml'
      - 'cmake/native_platform_adapters.cmake'
      - 'cmake/native_damage_presentation.cmake'
      - 'src/native_platform_adapters.*'
      - 'src/native_damage_presentation.*'
      - 'src/gpu_atlas_frame_submission.*'
      - 'tests/native_platform_adapters_tests.cpp'
      - 'tests/native_platform_adapters_equivalence_tests.cpp'
      - 'docs/Z2F7_NATIVE_PLATFORM_ADAPTERS.md'
  workflow_dispatch:

concurrency:
  group: z2-native-platform-adapters-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-native-platform-adapters-tests \
            zevryon-native-platform-adapters-equivalence-tests \
            zevryon-native-platform-adapters-benchmark \
            zevryon-native-damage-presentation-tests \
            2>&1 | tee native-platform-build.log
      - name: Repeat functional certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^native-platform-adapters-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee native-platform-repeat.log
      - name: Run 9216-case platform oracle
        run: |
          set -o pipefail
          ctest --test-dir build -R '^native-platform-adapters-equivalence-tests$' \
            --output-on-failure 2>&1 | tee native-platform-equivalence.log
      - name: Run three benchmark distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-native-platform-adapters-benchmark 512 \
              > "native-platform-benchmark-${run}.json"
          done
      - name: Enforce exact topology, memory and latency gates
        run: |
          python3 - <<'PY'
          import json

          rows = []
          for run in range(1, 4):
              with open(f'native-platform-benchmark-{run}.json', encoding='utf-8') as handle:
                  row = json.load(handle)
              assert row['schema'] == 'zevryon.native-platform-adapters-benchmark.v1'
              assert row['input_document_lines'] == 16_384
              assert row['input_projected_lines'] == 80
              assert row['input_frame_commands'] == 68
              assert row['input_native_commands'] == 71
              assert row['input_draw_instances'] == 310
              assert row['backend_count'] == 3
              assert row['commands_per_backend'] == 80
              assert row['barriers_per_backend'] == 2
              assert row['descriptors_per_backend'] == 3
              assert row['total_backend_commands'] == 240
              assert row['logical_retained_bytes_per_backend'] == 2_720
              assert row['logical_retained_bytes_total'] == 8_160
              assert row['adapter_scratch_hard_limit_bytes'] == 262_144
              assert row['capability_record_bytes'] == 32
              assert row['adapter_config_bytes'] == 48
              assert row['command_record_bytes'] == 32
              assert row['barrier_record_bytes'] == 32
              assert row['descriptor_record_bytes'] == 32
              assert row['swapchain_image_bytes'] == 64
              assert row['vulkan_checksum'] == 7_110_344_348_272_935_988
              assert row['metal_checksum'] == 15_383_223_239_631_327_817
              assert row['d3d12_checksum'] == 13_749_743_700_907_245_250
              assert row['checksum'] == 943_884_624_265_623_740
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 3.0, row
              assert row['p99_ms'] <= 6.0, row
              assert row['maximum_ms'] <= 20.0, row
              rows.append(row)
          stable = (
              'commands_per_backend', 'barriers_per_backend',
              'descriptors_per_backend', 'logical_retained_bytes_total',
              'vulkan_checksum', 'metal_checksum', 'd3d12_checksum', 'checksum')
          for key in stable:
              assert len({row[key] for row in rows}) == 1, key
          print({
              'p50_ms': [row['p50_ms'] for row in rows],
              'p95_ms': [row['p95_ms'] for row in rows],
              'p99_ms': [row['p99_ms'] for row in rows],
              'maximum_ms': [row['maximum_ms'] for row in rows],
              'checksum': rows[0]['checksum'],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-native-platform-adapters-${{ github.sha }}
          path: |
            native-platform-build.log
            native-platform-repeat.log
            native-platform-equivalence.log
            native-platform-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests under sanitizers
        run: |
          set -o pipefail
          cmake --build build-sanitized --parallel 2 --target \
            zevryon-native-platform-adapters-tests \
            zevryon-native-platform-adapters-equivalence-tests \
            2>&1 | tee native-platform-sanitizer-build.log
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^native-platform-adapters-(tests|equivalence-tests)$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-native-platform-adapters-sanitizer-${{ github.sha }}
          path: native-platform-sanitizer-build.log
          if-no-files-found: warn

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build and run focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-native-platform-adapters-tests \
            zevryon-native-platform-adapters-equivalence-tests \
            zevryon-native-platform-adapters-benchmark \
            2>&1 | tee apple-native-platform-build.log
          ctest --test-dir build -R '^native-platform-adapters-(tests|equivalence-tests)$' --output-on-failure
          ./build/zevryon-native-platform-adapters-benchmark 256 > apple-native-platform-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-native-platform-adapters-appleclang-${{ github.sha }}
          path: |
            apple-native-platform-build.log
            apple-native-platform-benchmark.json
          if-no-files-found: warn
