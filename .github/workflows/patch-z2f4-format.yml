name: patch-z2f4-format

on:
  push:
    branches:
      - work/z2f-bounded-gpu-residency-compositor

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger Z2F-4 format patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-gpu-residency-compositor
      - name: Apply raster-format identity patch
        shell: bash
        run: |
          tr -d '\r\n' < .z2f4/format.patch.b64 | base64 -d > /tmp/z2f4-format.patch
          git apply --check /tmp/z2f4-format.patch
          git apply /tmp/z2f4-format.patch
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gpu_compositor_submission.cpp
          git commit -m 'Make GPU texture identity raster-format aware'
          git push origin HEAD:work/z2f-bounded-gpu-residency-compositor
