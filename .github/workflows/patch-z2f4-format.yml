name: patch-z2f4-format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'work/z2f-bounded-gpu-residency-compositor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-gpu-residency-compositor
      - name: Make texture identity raster-format aware
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/gpu_compositor_submission.cpp')
          text = path.read_text(encoding='utf-8')

          old_helpers = '''bool texture_matches(
              const GpuTextureResidencyRecord& record,
              std::uint64_t device_generation,
              std::uint64_t atlas_generation_id,
              std::uint64_t page_generation,
              std::uint32_t page_index) noexcept {
              return record.handle.device_generation == device_generation &&
                  record.atlas_generation_id == atlas_generation_id &&
                  record.page_generation == page_generation &&
                  record.handle.page_index == page_index &&
                  (record.handle.flags & kGpuTextureHandleValid) != 0U;
          }

          GpuTextureResidencyRecord* find_texture(
              std::pmr::vector<GpuTextureResidencyRecord>* textures,
              std::uint64_t device_generation,
              std::uint64_t atlas_generation_id,
              std::uint64_t page_generation,
              std::uint32_t page_index) noexcept {
              const auto it = std::find_if(
                  textures->begin(),
                  textures->end(),
                  [=](const GpuTextureResidencyRecord& record) {
                      return texture_matches(
                          record,
                          device_generation,
                          atlas_generation_id,
                          page_generation,
                          page_index);
                  });
              return it == textures->end() ? nullptr : &*it;
          }

          bool texture_required_by_frame(
              const GpuTextureResidencyRecord& texture,
              const GpuCompositorFrameRequest& request) noexcept {
              const bool required_by_upload = std::any_of(
                  request.upload_execution->batches.begin(),
                  request.upload_execution->batches.end(),
                  [&](const GlyphAtlasBackendUploadBatch& batch) {
                      return texture.atlas_generation_id == batch.atlas_generation_id &&
                          texture.page_generation == batch.page_generation &&
                          texture.handle.page_index == batch.page_index;
                  });
              if (required_by_upload) {
                  return true;
              }
              return std::any_of(
                  request.atlas_submission->draw_batches.begin(),
                  request.atlas_submission->draw_batches.end(),
                  [&](const GlyphAtlasDrawBatch& batch) {
                      return texture.atlas_generation_id ==
                              request.atlas_submission->atlas_generation_id &&
                          texture.page_generation == batch.page_generation &&
                          texture.handle.page_index == batch.page_index;
                  });
          }
          '''

          new_helpers = '''bool texture_matches(
              const GpuTextureResidencyRecord& record,
              std::uint64_t device_generation,
              std::uint64_t atlas_generation_id,
              std::uint64_t page_generation,
              std::uint32_t page_index,
              GlyphRasterFormat format) noexcept {
              return record.handle.device_generation == device_generation &&
                  record.atlas_generation_id == atlas_generation_id &&
                  record.page_generation == page_generation &&
                  record.handle.page_index == page_index &&
                  record.handle.format == format &&
                  (record.handle.flags & kGpuTextureHandleValid) != 0U;
          }

          GpuTextureResidencyRecord* find_texture(
              std::pmr::vector<GpuTextureResidencyRecord>* textures,
              std::uint64_t device_generation,
              std::uint64_t atlas_generation_id,
              std::uint64_t page_generation,
              std::uint32_t page_index,
              GlyphRasterFormat format) noexcept {
              const auto it = std::find_if(
                  textures->begin(),
                  textures->end(),
                  [=](const GpuTextureResidencyRecord& record) {
                      return texture_matches(
                          record,
                          device_generation,
                          atlas_generation_id,
                          page_generation,
                          page_index,
                          format);
                  });
              return it == textures->end() ? nullptr : &*it;
          }

          bool page_format_for_submission(
              const GlyphAtlasSubmission& submission,
              std::uint64_t page_generation,
              std::uint32_t page_index,
              GlyphRasterFormat* output) noexcept {
              bool found = false;
              GlyphRasterFormat format = GlyphRasterFormat::Alpha8;
              for (const GlyphAtlasUploadRecord& upload : submission.uploads) {
                  if (upload.page_generation != page_generation ||
                      upload.page_index != page_index) {
                      continue;
                  }
                  if (!found) {
                      format = upload.format;
                      found = true;
                  } else if (format != upload.format) {
                      return false;
                  }
              }
              if (found && output != nullptr) {
                  *output = format;
              }
              return found;
          }

          bool texture_required_by_frame(
              const GpuTextureResidencyRecord& texture,
              const GpuCompositorFrameRequest& request) noexcept {
              const bool required_by_upload = std::any_of(
                  request.upload_execution->batches.begin(),
                  request.upload_execution->batches.end(),
                  [&](const GlyphAtlasBackendUploadBatch& batch) {
                      return texture.atlas_generation_id == batch.atlas_generation_id &&
                          texture.page_generation == batch.page_generation &&
                          texture.handle.page_index == batch.page_index &&
                          texture.handle.format == batch.format;
                  });
              if (required_by_upload) {
                  return true;
              }
              return std::any_of(
                  request.atlas_submission->draw_batches.begin(),
                  request.atlas_submission->draw_batches.end(),
                  [&](const GlyphAtlasDrawBatch& batch) {
                      GlyphRasterFormat format = GlyphRasterFormat::Alpha8;
                      return page_format_for_submission(
                                 *request.atlas_submission,
                                 batch.page_generation,
                                 batch.page_index,
                                 &format) &&
                          texture.atlas_generation_id ==
                              request.atlas_submission->atlas_generation_id &&
                          texture.page_generation == batch.page_generation &&
                          texture.handle.page_index == batch.page_index &&
                          texture.handle.format == format;
                  });
          }
          '''

          old_upload_lookup = '''            GpuTextureResidencyRecord* texture = find_texture(
                          &staged_textures,
                          cache->config_.device_generation,
                          batch.atlas_generation_id,
                          batch.page_generation,
                          batch.page_index);'''
          new_upload_lookup = '''            GpuTextureResidencyRecord* texture = find_texture(
                          &staged_textures,
                          cache->config_.device_generation,
                          batch.atlas_generation_id,
                          batch.page_generation,
                          batch.page_index,
                          batch.format);'''

          old_draw_lookup = '''            GpuTextureResidencyRecord* texture = find_texture(
                          &staged_textures,
                          cache->config_.device_generation,
                          request.atlas_submission->atlas_generation_id,
                          draw.page_generation,
                          draw.page_index);'''
          new_draw_lookup = '''            GlyphRasterFormat draw_format = GlyphRasterFormat::Alpha8;
              if (!page_format_for_submission(
                      *request.atlas_submission,
                      draw.page_generation,
                      draw.page_index,
                      &draw_format)) {
                  for (const GpuTextureHandle& handle : newly_allocated) {
                      backend->release_texture(handle);
                  }
                  return fail(
                      GpuCompositorFrameErrorKind::CommandTopologyViolation,
                      0U, 0U, draw_index, draw.page_index,
                      "draw batch page has no unique raster format",
                      nullptr,
                      error);
              }
              GpuTextureResidencyRecord* texture = find_texture(
                  &staged_textures,
                  cache->config_.device_generation,
                  request.atlas_submission->atlas_generation_id,
                  draw.page_generation,
                  draw.page_index,
                  draw_format);'''

          if old_helpers not in text:
              if 'bool page_format_for_submission(' in text:
                  raise SystemExit(0)
              raise SystemExit('helper block not found')
          assert text.count(old_helpers) == 1
          assert text.count(old_upload_lookup) == 1
          assert text.count(old_draw_lookup) == 1
          text = text.replace(old_helpers, new_helpers)
          text = text.replace(old_upload_lookup, new_upload_lookup)
          text = text.replace(old_draw_lookup, new_draw_lookup)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gpu_compositor_submission.cpp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Make GPU texture identity raster-format aware'
          git push origin HEAD:work/z2f-bounded-gpu-residency-compositor
