name: Z7 comment NUL production builder v1

on:
  push:
    branches:
      - candidate/z7-tokenizer-comment-nul-production-v1

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/z7-tokenizer-comment-nul-production-v1

      - name: Apply exact tested comment NUL candidate
        run: |
          set -euo pipefail
          git fetch --no-tags origin 099297769ba9da74423b8ca7c36ca0ec3906a556
          git show 099297769ba9da74423b8ca7c36ca0ec3906a556:scripts/apply_z7_tokenizer_comment_nul_after_data_nul_v1.py > /tmp/apply.py
          python3 /tmp/apply.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py')
          s=p.read_text(encoding='utf-8').replace(
              '# Data admits ordinary character-data NUL and, in this diagnostic,\n    # normal HTML-comment NUL. Other markup/tag/DOCTYPE NUL remains fail closed.',
              '# Data admits ordinary character-data NUL and normal HTML-comment\n    # NUL. Other markup/tag/DOCTYPE NUL remains fail closed.')
          p.write_text(s,encoding='utf-8')
          p=Path('docs/Z7_HTML_TOKENIZER_MARKUP_DECLARATIONS_V1.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              '- standard and bounded comment / bogus-comment handling already admitted by the component;\n',
              '- standard and bounded comment / bogus-comment handling already admitted by the component;\n- normal HTML-comment U+0000 replacement with `unexpected-null-character` and U+FFFD token payload;\n')
          s=s.replace(
              '- raw NUL replacement/input-stream preprocessing;\n',
              '- NUL handling outside normal HTML comments, including bogus comments and DOCTYPE input preprocessing;\n')
          s=s.replace(
              'this bounded recovery-state admission is accepted only at the measured **6819 pass / 122 fail / 95 unsupported / 7036 total** distribution.',
              'this bounded recovery-state admission measured **6819 pass / 122 fail / 95 unsupported / 7036 total**; after ordinary Data-state NUL, normal HTML-comment NUL is accepted only at **6827 pass / 122 fail / 87 unsupported / 7036 total**.')
          s=s.replace(
              '- retained unproven before-identifier transition, comment, bogus-comment, and NUL fail-closed boundaries.\n',
              '- normal HTML-comment NUL replacement and exact error location;\n- retained unproven before-identifier transition, bogus-comment, DOCTYPE-NUL, and unrelated NUL fail-closed boundaries.\n')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused tokenizer targets
        run: cmake --build build --parallel 2 --target zevryon-html-tokenizer-markup-declarations-v1-tests zevryon-html-tokenizer-token-stream-v1-tests zevryon-html-tokenizer-token-stream-v1-probe
      - name: Run focused tests
        run: |
          ./build/zevryon-html-tokenizer-markup-declarations-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests
      - name: Verify exact corpus movement
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --policy no-regression --probe build/zevryon-html-tokenizer-token-stream-v1-probe > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('census.json').read_text())
          assert (r['executions'],r['passed'],r['failed'],r['unsupported'])==(7036,6827,122,87),r
          assert r['reason_counts'].get('unsupported:input-preprocessing-nul',0)==53,r
          assert r['reason_counts'].get('failed:parse-error-stream-mismatch',0)==113,r
          assert r['reason_counts'].get('failed:token-stream-mismatch',0)==9,r
          assert r['baseline_policy']=='no-regression' and r['baseline_regression_free'] is True,r
          assert r['full_corpus_pass_claim'] is False and r['html_tokenizer_conformance_claim'] is False and r['z7_status_change'] is False,r
          PY
      - name: Commit production diff and self-clean builder
        run: |
          set -euo pipefail
          rm -f census.json .github/workflows/z7_tokenizer_comment_nul_production_builder_v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/html_tokenizer_markup_declarations_v1.cpp tests/html_tokenizer_markup_declarations_v1_tests.cpp scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py docs/Z7_HTML_TOKENIZER_MARKUP_DECLARATIONS_V1.md .github/workflows/z7_tokenizer_comment_nul_production_builder_v1.yml
          git diff --cached --check
          git commit -m "Z7: admit normal comment NUL semantics"
          git push origin HEAD:candidate/z7-tokenizer-comment-nul-production-v1
