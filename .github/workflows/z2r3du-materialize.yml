name: Z2R-3D-U materializer

on:
  push:
    branches:
      - agent/z2r3d-unicode-promotion-readiness
    paths:
      - ".github/workflows/z2r3du-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/z2r3d-unicode-promotion-readiness
          fetch-depth: 0
      - name: Materialize permanent Z2R-3D-U files
        env:
          MATERIALIZER_B64: ...TRUNCATED_FOR_DISPLAY