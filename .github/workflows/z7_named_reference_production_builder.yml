name: Z7 named-reference production builder

on:
  push:
    branches:
      - candidate/z7-tokenizer-named-character-reference-v1

permissions:
  contents: write

jobs:
  build-slice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/z7-tokenizer-named-character-reference-v1
          fetch-depth: 1
      - name: Apply named-reference production slice
        run: python3 scripts/apply_z7_named_reference_slice.py
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused character-reference tests
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-html-tokenizer-numeric-character-reference-v1-tests
          zevryon-html-tokenizer-named-character-reference-v1-tests
      - name: Run focused character-reference and provenance tests
        run: >-
          ctest --test-dir build --output-on-failure
          -R "(html-tokenizer-(numeric|named)-character-reference-v1-tests|z7-html-named-reference-table-(provenance|verifier-tests))"
      - name: Commit tested slice and remove builder
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/z7_named_reference_production_builder.yml scripts/apply_z7_named_reference_slice.py
          git add cmake/html_tokenizer_character_reference_v1.cmake \
            src/html_tokenizer_character_reference_v1.cpp \
            src/html_tokenizer_character_reference_v1.hpp \
            src/html_tokenizer_data_tags_v1.hpp \
            src/html_tokenizer_token_stream_v1.hpp \
            tests/html_tokenizer_numeric_character_reference_v1_tests.cpp \
            tests/html_tokenizer_named_character_reference_v1_tests.cpp \
            docs/Z7_HTML_TOKENIZER_DATA_TAGS_V1.md \
            docs/Z7_HTML_TOKENIZER_NUMERIC_CHARACTER_REFERENCE_V1.md \
            docs/Z7_HTML_TOKENIZER_NAMED_CHARACTER_REFERENCE_V1.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Z7: admit bounded named character references'
          git push origin HEAD:candidate/z7-tokenizer-named-character-reference-v1
