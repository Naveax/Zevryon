name: Z7 nullable DOCTYPE name diagnostic

on:
  push:
    branches:
      - candidate/z7-tokenizer-nullable-doctype-name-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: candidate/z7-tokenizer-nullable-doctype-name-v1

      - name: Apply bounded nullable DOCTYPE-name candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_z7_tokenizer_nullable_doctype_name_v1.py")
          text = path.read_text(encoding="utf-8")

          old = """text = replace_once(
              text,
              '''        std::string system_identifier,
                  bool has_system_identifier,
                  bool force_quirks) {
          ''',
              '''        std::string system_identifier,
                  bool has_system_identifier,
                  bool force_quirks,
                  bool has_doctype_name = true) {
          ''',
              \"emit_doctype signature\",
          )
          """
          new = """text = replace_once(
              text,
              '''    bool emit_doctype(
                  std::string name,
                  std::string public_identifier,
                  bool has_public_identifier,
                  std::string system_identifier,
                  bool has_system_identifier,
                  bool force_quirks) {
          ''',
              '''    bool emit_doctype(
                  std::string name,
                  std::string public_identifier,
                  bool has_public_identifier,
                  std::string system_identifier,
                  bool has_system_identifier,
                  bool force_quirks,
                  bool has_doctype_name = true) {
          ''',
              \"emit_doctype signature\",
          )
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"diagnostic emit helper bootstrap expected one anchor, found {count}")
          text = text.replace(old, new, 1)

          old = """text = replace_once(
              text,
              '''    bool expected_force_quirks,
              const std::vector<ExpectedError>& expected_errors = {}) {
          ''',
              '''    bool expected_force_quirks,
              const std::vector<ExpectedError>& expected_errors = {},
              bool expected_has_doctype_name = true) {
          ''',
              \"focused helper name-presence argument\",
          )
          """
          new = """text = replace_once(
              text,
              '''bool run_doctype_full_case(
              std::string_view label,
              std::string_view input,
              std::string_view expected_name,
              bool expected_has_public_identifier,
              std::string_view expected_public_identifier,
              bool expected_has_system_identifier,
              std::string_view expected_system_identifier,
              bool expected_force_quirks,
              const std::vector<ExpectedError>& expected_errors = {}) {
          ''',
              '''bool run_doctype_full_case(
              std::string_view label,
              std::string_view input,
              std::string_view expected_name,
              bool expected_has_public_identifier,
              std::string_view expected_public_identifier,
              bool expected_has_system_identifier,
              std::string_view expected_system_identifier,
              bool expected_force_quirks,
              const std::vector<ExpectedError>& expected_errors = {},
              bool expected_has_doctype_name = true) {
          ''',
              \"focused helper name-presence argument\",
          )
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"diagnostic focused helper bootstrap expected one anchor, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/apply_z7_tokenizer_nullable_doctype_name_v1.py
          git diff --check

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON

      - name: Build focused tokenizer targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-html-tokenizer-markup-declarations-v1-tests
          zevryon-html-tokenizer-token-stream-v1-tests
          zevryon-html-tokenizer-token-stream-v1-probe

      - name: Run focused component and token-stream tests
        run: |
          set -euo pipefail
          ./build/zevryon-html-tokenizer-markup-declarations-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests

      - name: Verify probe consumers and corpus harnesses
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_test1_admitted_runner_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_test1_admitted_runner_v1.py --probe build/zevryon-html-tokenizer-token-stream-v1-probe > test1.json
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --self-test

      - name: Measure complete corpus without publishing authority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("census.json").read_text(encoding="utf-8"))
          assert report["files"] == 14, report
          assert report["tests"] == 6810, report
          assert report["executions"] == 7036, report
          assert report["passed"] + report["failed"] + report["unsupported"] == 7036, report
          assert report["full_corpus_pass_claim"] is False, report
          assert report["html_tokenizer_conformance_claim"] is False, report
          assert report["z7_status_change"] is False, report
          print("DIAGNOSTIC_TOTALS", report["passed"], report["failed"], report["unsupported"])
          print("DIAGNOSTIC_NULLABLE_DOCTYPE", report["reason_counts"].get("unsupported:probe-wire-null-doctype-name", 0))
          print("DIAGNOSTIC_MISSING_DOCTYPE", report["reason_counts"].get("unsupported:production-fail-closed:HTML markup declaration missing DOCTYPE name recovery is outside admitted v1 subset", 0))
          print("DIAGNOSTIC_MALFORMED_DOCTYPE", report["reason_counts"].get("unsupported:production-fail-closed:HTML markup declaration malformed DOCTYPE-name transition is outside admitted v1 recovery", 0))
          for fixture in ("tokenizer/test2.test", "tokenizer/test3.test", "tokenizer/test4.test"):
              print("DIAGNOSTIC_FIXTURE", fixture, json.dumps(report["file_reports"].get(fixture), sort_keys=True))
          print(json.dumps(report, indent=2, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: z7-nullable-doctype-name-diagnostic
          path: |
            census.json
            test1.json
          if-no-files-found: error

      - name: Block publication from diagnostic run
        shell: bash
        run: |
          echo "Diagnostic-only run completed; production publication is intentionally blocked." >&2
          exit 1
