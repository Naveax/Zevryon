name: z2-caret-boundary-map

on:
  pull_request:
    paths:
      - '.github/workflows/z2-caret-boundary-map.yml'
      - 'cmake/harfbuzz_shaping.cmake'
      - 'src/caret_boundary_map.*'
      - 'src/caret_boundary_map_benchmark_main.cpp'
      - 'src/glyph_cluster_map.*'
      - 'src/multi_run_harfbuzz_shaper.*'
      - 'src/resource_ledger.*'
      - 'tests/caret_boundary_map_tests.cpp'
      - 'docs/Z2C3B_BOUNDED_CARET_BOUNDARY_MAP.md'
  workflow_dispatch:

concurrency:
  group: z2-caret-boundary-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build caret map and dependencies
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-caret-boundary-map-tests \
            zevryon-caret-boundary-map-benchmark \
            zevryon-glyph-cluster-map-tests \
            2>&1 | tee caret-boundary-map-build.log
      - name: Repeat focused certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^caret-boundary-map-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee caret-boundary-map-repeat.log
      - name: Run three independent distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-caret-boundary-map-benchmark \
              > "caret-boundary-map-benchmark-${run}.json"
          done
      - name: Enforce exact output, memory and latency gates
        run: |
          python3 - <<'PY'
          import json
          rows = []
          for run in range(1, 4):
              with open(f"caret-boundary-map-benchmark-{run}.json", encoding="utf-8") as handle:
                  row = json.load(handle)
              assert row["schema"] == "zevryon.caret-boundary-map-benchmark.v1"
              assert row["input_clusters"] == 65_536
              assert row["input_segments"] == 2_048
              assert row["input_glyphs"] == 40_960
              assert row["glyph_groups"] == 32_768
              assert row["output_boundaries"] == 65_537
              assert row["record_bytes"] == 1
              assert row["current_bytes"] == 65_537
              assert row["peak_bytes"] == 65_537
              assert row["safe_boundaries"] == 24_578
              assert row["unsafe_boundaries"] == 40_959
              assert row["merged_interior_boundaries"] == 32_768
              assert row["unsafe_to_break_boundaries"] == 8_191
              assert row["accounting_clean"] is True
              assert row["within_hard_limits"] is True
              assert 0.0 < row["p50_ms"] <= row["p95_ms"] <= row["p99_ms"] <= row["maximum_ms"]
              assert row["p95_ms"] <= 4.0, row
              assert row["p99_ms"] <= 6.0, row
              assert row["maximum_ms"] <= 10.0, row
              rows.append(row)
          assert len({row["checksum"] for row in rows}) == 1
          print({
              "p50_ms": [row["p50_ms"] for row in rows],
              "p95_ms": [row["p95_ms"] for row in rows],
              "p99_ms": [row["p99_ms"] for row in rows],
              "maximum_ms": [row["maximum_ms"] for row in rows],
              "checksum": rows[0]["checksum"],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-caret-boundary-map-${{ github.sha }}
          path: |
            caret-boundary-map-build.log
            caret-boundary-map-repeat.log
            caret-boundary-map-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON -DZEVRYON_ENABLE_SANITIZERS=ON
      - name: Build focused tests under sanitizers
        run: cmake --build build-sanitized --parallel 2 --target zevryon-caret-boundary-map-tests
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^caret-boundary-map-tests$' --output-on-failure

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build and run focused tests
        run: |
          cmake --build build --parallel 2 --target zevryon-caret-boundary-map-tests
          ctest --test-dir build -R '^caret-boundary-map-tests$' --output-on-failure
