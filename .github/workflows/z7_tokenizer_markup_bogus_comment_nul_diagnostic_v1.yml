name: Z7 markup bogus-comment NUL diagnostic v1

on:
  push:
    branches:
      - candidate/z7-tokenizer-markup-bogus-comment-nul-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply markup bogus-comment NUL candidate
        run: |
          set -euo pipefail
          python3 scripts/apply_z7_tokenizer_markup_bogus_comment_nul_v1.py
          git diff --check

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON

      - name: Build focused tokenizer targets
        run: cmake --build build --parallel 2 --target zevryon-html-tokenizer-markup-declarations-v1-tests zevryon-html-tokenizer-token-stream-v1-tests zevryon-html-tokenizer-token-stream-v1-probe

      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build/zevryon-html-tokenizer-markup-declarations-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests

      - name: Verify corpus harnesses
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --self-test

      - name: Measure complete corpus
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --probe build/zevryon-html-tokenizer-token-stream-v1-probe > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('census.json').read_text(encoding='utf-8'))
          assert report['executions'] == 7036, report
          assert report['passed'] == 6825, report
          assert report['failed'] == 122, report
          assert report['unsupported'] == 89, report
          assert report['reason_counts'].get('unsupported:input-preprocessing-nul', 0) == 55, report
          assert report['reason_counts'].get('failed:parse-error-stream-mismatch', 0) == 113, report
          assert report['reason_counts'].get('failed:token-stream-mismatch', 0) == 9, report
          print('DIAGNOSTIC_TOTALS', report['passed'], report['failed'], report['unsupported'])
          print('DIAGNOSTIC_NUL', report['reason_counts'].get('unsupported:input-preprocessing-nul', 0))
          PY

      - name: Block diagnostic publication
        run: |
          echo 'Diagnostic evidence collected; branch must not be merged.' >&2
          exit 1
