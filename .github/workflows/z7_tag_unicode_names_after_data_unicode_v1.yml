name: Z7 tag Unicode names after Data Unicode diagnostic v1

on:
  push:
    branches:
      - diagnostic/z7-tag-unicode-names-after-data-unicode-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply Unicode tag candidate
        run: |
          set -euo pipefail
          python3 scripts/apply_z7_tag_unicode_names_after_data_unicode_v1.py
          git diff --check
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused tokenizer targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-html-tokenizer-data-tags-v1-tests
          zevryon-html-tokenizer-data-tag-recovery-v1-tests
          zevryon-html-tokenizer-token-stream-v1-tests
          zevryon-html-tokenizer-token-stream-v1-probe
      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build/zevryon-html-tokenizer-data-tags-v1-tests
          ./build/zevryon-html-tokenizer-data-tag-recovery-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests
      - name: Verify corpus harnesses
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --self-test
      - name: Measure exact corpus movement
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py \
            --policy no-regression \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > census.json
          python3 - <<'PY'
          import json
          r=json.load(open('census.json'))
          assert r['files']==14,r
          assert r['tests']==6810,r
          assert r['executions']==7036,r
          assert r['baseline_regression_free'] is True,r
          assert r['passed']==6959,r
          assert r['failed']==27,r
          assert r['unsupported']==50,r
          assert r['reason_counts'].get('unsupported:production-fail-closed:HTML Data-tag tokenizer first attribute without separating whitespace is outside admitted v1 subset',0)==1,r
          assert r['reason_counts'].get('unsupported:production-fail-closed:HTML Data-tag tokenizer non-ASCII preprocessing/location authority is not implemented',0)==0,r
          print('TAG_UNICODE_TOTALS',r['passed'],r['failed'],r['unsupported'])
          PY
      - name: Block diagnostic publication
        run: |
          echo 'Diagnostic evidence collected; branch must not be merged.' >&2
          exit 1
