name: Z7 tag NUL after DOCTYPE diagnostic v1

on:
  push:
    branches:
      - candidate/z7-tokenizer-tag-nul-after-doctype-diagnostic-v1

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply proven tag-family NUL source candidate
        run: |
          set -euo pipefail
          git fetch --no-tags origin 1b687eb20ac97ae210a8bc90fe61031d82662d4c
          git show 1b687eb20ac97ae210a8bc90fe61031d82662d4c:scripts/apply_z7_tokenizer_tag_nul_semantics_v1.py > /tmp/full_helper.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/full_helper.py').read_text(encoding='utf-8')
          marker='path = ROOT / "scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py"'
          if marker not in s:
              raise SystemExit('tag helper census marker missing')
          Path('/tmp/source_helper.py').write_text(s.split(marker,1)[0] + '\nprint("applied tag-family NUL source/test candidate")\n',encoding='utf-8')
          PY
          python3 /tmp/source_helper.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py')
          s=p.read_text(encoding='utf-8')
          old='''    # Ordinary Data NUL and the complete pinned DOCTYPE-NUL family are
    # admitted. Comment/tag NUL remains fail closed.
    if "\\x00" in input_text:
        if state_name in {
            "PLAINTEXT state",
            "RCDATA state",
            "RAWTEXT state",
            "Script data state",
            "CDATA section state",
        }:
            pass
        elif state_name == "Data state" and (
            "<" not in input_text or input_text[:9].lower() == "<!doctype"
        ):
            pass
        else:
            return "input-preprocessing-nul"
'''
          new='''    # Diagnostic admission: ordinary Data, complete pinned DOCTYPE-NUL,
    # and tag-family NUL. Markup declaration comment/bogus-comment NUL remains fail closed.
    if "\\x00" in input_text:
        if state_name in {
            "PLAINTEXT state",
            "RCDATA state",
            "RAWTEXT state",
            "Script data state",
            "CDATA section state",
        }:
            pass
        elif state_name == "Data state" and (
            "<" not in input_text or
            input_text[:9].lower() == "<!doctype" or
            (input_text.startswith("<") and not input_text.startswith("<!"))
        ):
            pass
        else:
            return "input-preprocessing-nul"
'''
          if s.count(old)!=1:
              raise SystemExit(f'classifier anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old_expr='classify_pre_execution("tokenizer/test3.test", "Data state", "<a\\x00>", "", []) == "input-preprocessing-nul"'
          if s.count(old_expr)==1:
              s=s.replace(old_expr,'classify_pre_execution("tokenizer/test3.test", "Data state", "<a\\x00>", "", []) is None',1)
              s=s.replace('"markup Data NUL remains classified unsupported"','"tag-family Data NUL admitted classification"',1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused tokenizer targets
        run: cmake --build build --parallel 2 --target zevryon-html-tokenizer-data-tags-v1-tests zevryon-html-tokenizer-data-tag-recovery-v1-tests zevryon-html-tokenizer-token-stream-v1-tests zevryon-html-tokenizer-token-stream-v1-probe
      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build/zevryon-html-tokenizer-data-tags-v1-tests
          ./build/zevryon-html-tokenizer-data-tag-recovery-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests
      - name: Verify harnesses
        run: |
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
      - name: Measure complete corpus
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --probe build/zevryon-html-tokenizer-token-stream-v1-probe > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('census.json').read_text(encoding='utf-8'))
          assert r['executions']==7036,r
          assert r['failed']<=122,r
          assert r['reason_counts'].get('failed:parse-error-stream-mismatch',0)<=113,r
          assert r['reason_counts'].get('failed:token-stream-mismatch',0)<=9,r
          print('DIAGNOSTIC_TOTALS',r['passed'],r['failed'],r['unsupported'])
          print('DIAGNOSTIC_NUL',r['reason_counts'].get('unsupported:input-preprocessing-nul',0))
          print('DIAGNOSTIC_PARSE_MISMATCH',r['reason_counts'].get('failed:parse-error-stream-mismatch',0))
          print('DIAGNOSTIC_TOKEN_MISMATCH',r['reason_counts'].get('failed:token-stream-mismatch',0))
          PY
      - name: Block diagnostic publication
        run: |
          echo 'Diagnostic evidence collected; branch must not be merged.' >&2
          exit 1
