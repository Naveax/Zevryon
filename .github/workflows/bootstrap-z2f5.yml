name: bootstrap-z2f5

on:
  push:
    branches:
      - work/z2f-bounded-gpu-device-presentation

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Bootstrap Z2F-5 payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-gpu-device-presentation
      - name: Materialize verified payload
        run: |
          cat .z2f5/part* | base64 -d > /tmp/z2f5-payload.tar.gz
          echo "9a7681260eab7b001ebd2eb30aab13feedd956b020b7556ad29d16fe8906e0d6  /tmp/z2f5-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/z2f5-payload.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cmake/gpu_atlas_frame_submission.cmake')
          text = path.read_text(encoding='utf-8')
          include = 'include("${CMAKE_CURRENT_LIST_DIR}/gpu_device_presentation.cmake")'
          if include not in text:
              path.write_text(text.rstrip() + '\n\n' + include + '\n', encoding='utf-8')
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gpu_device_presentation.* tests/gpu_device_presentation_* cmake/gpu_device_presentation.cmake cmake/gpu_atlas_frame_submission.cmake docs/Z2F5_BOUNDED_GPU_DEVICE_PRESENTATION.md
          git commit -m "Implement bounded GPU device presentation"
          git push origin HEAD:work/z2f-bounded-gpu-device-presentation
