name: bootstrap-z2f5

on:
  push:
    branches:
      - work/z2f-bounded-gpu-device-presentation

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Bootstrap Z2F-5 benchmark'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-gpu-device-presentation
      - name: Materialize verified benchmark
        run: |
          cat .z2f5benchtar/part* | base64 -d > /tmp/z2f5-benchmark.tar.gz
          echo "f269ad748abd2537596b7361555f62cce122562819525abb80ea0472170e22ef  /tmp/z2f5-benchmark.tar.gz" | sha256sum -c -
          tar -xzf /tmp/z2f5-benchmark.tar.gz
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gpu_device_presentation_benchmark_main.cpp
          git commit -m "Add bounded GPU device presentation benchmark"
          git push origin HEAD:work/z2f-bounded-gpu-device-presentation
