name: bootstrap-z2f5

on:
  push:
    branches:
      - work/z2f-bounded-gpu-device-presentation

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Cleanup Z2F-5 staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-gpu-device-presentation
      - name: Remove staging payloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .z2f5 .z2f5bench .z2f5benchtar
          git commit -m "Remove Z2F-5 staging payloads"
          git push origin HEAD:work/z2f-bounded-gpu-device-presentation
