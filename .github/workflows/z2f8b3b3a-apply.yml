''',
              '''    bool export_surface(
        NativeShaderSurfaceView* surface,
        NativeShaderExecutionError* error) noexcept override {
        std::lock_guard<std::mutex> lock(mutex_);
        clear_error(error);
        if (surface == nullptr) {
            return fail(error, NativeShaderExecutionErrorKind::InvalidInput,
