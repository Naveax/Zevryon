name: z2f8b3b3a-apply

on:
  push:
    branches: [work/z2f8b3b3a-direct-d3d12-shader-present]
    paths: ['.github/workflows/z2f8b3b3a-apply.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact production patches from parent revision
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/z2f8b3b3a-apply.yml \
            | sed -n "/python3 - <<'PY'/,/^          PY$/p" \
            | sed 's/^          //' > /tmp/apply-production-patches.sh
          test -s /tmp/apply-production-patches.sh
          bash /tmp/apply-production-patches.sh
      - name: Commit patched production sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/native_window_swapchain.hpp \
            src/native_shader_execution_d3d12.cpp \
            src/native_window_swapchain_d3d12.cpp
          git commit -m "Z2F-8B3B3A: connect D3D12 shader surfaces to DXGI"
          git push origin HEAD:work/z2f8b3b3a-direct-d3d12-shader-present
