name: z2f8b3b3a-style

on:
  pull_request:
    paths:
      - '.github/workflows/z2f8b3b3a-style.yml'
  workflow_dispatch:

concurrency:
  group: z2f8b3b3a-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  format-zevryon-style:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Locate clang-format
        shell: bash
        run: |
          set -euo pipefail
          for candidate in clang-format clang-format-19 clang-format-18 clang-format-17; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CLANG_FORMAT=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          sudo apt-get update
          sudo apt-get install -y clang-format
          echo "CLANG_FORMAT=clang-format" >> "$GITHUB_ENV"
      - name: Format changed lines with repository conventions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORMAT_STYLE: "{BasedOnStyle: LLVM, IndentWidth: 4, ContinuationIndentWidth: 4, PointerAlignment: Left, DerivePointerAlignment: false, ColumnLimit: 100}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess

          files = [
              'src/native_shader_execution_d3d12.cpp',
              'src/native_window_swapchain_d3d12.cpp',
          ]
          base = os.environ['BASE_SHA']
          formatter = os.environ['CLANG_FORMAT']
          style = os.environ['FORMAT_STYLE']
          hunk = re.compile(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@')
          for path in files:
              diff = subprocess.run(
                  ['git', 'diff', '--unified=0', base, '--', path],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE).stdout
              ranges = []
              for line in diff.splitlines():
                  match = hunk.match(line)
                  if match is None:
                      continue
                  start = int(match.group(1))
                  count = int(match.group(2) or '1')
                  if count > 0:
                      ranges.append((start, start + count - 1))
              if not ranges:
                  continue
              args = [formatter, '-i', f'--style={style}']
              for start, end in ranges:
                  args.append(f'--lines={start}:{end}')
              args.append(path)
              subprocess.run(args, check=True)
          PY
          git diff --check
      - name: Publish style cleanup and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm --ignore-unmatch .github/workflows/z2f8b3b3a-style.yml
          git add src/native_shader_execution_d3d12.cpp src/native_window_swapchain_d3d12.cpp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Zevryon style to direct D3D12 presentation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
