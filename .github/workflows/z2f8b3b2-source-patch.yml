name: z2f8b3b2-source-patch

on:
  pull_request:
    paths:
      - '.github/workflows/z2f8b3b2-source-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Apply exact signedness fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/native_shader_execution.cpp')
          text = path.read_text()
          old = '''void hash_text(std::uint64_t* hash, std::string_view text) noexcept {
              for (const unsigned char byte : text) {
                  *hash ^= byte;
                  *hash *= kFnvPrime;
              }
          }
          '''
          new = '''void hash_text(std::uint64_t* hash, std::string_view text) noexcept {
              for (const char character : text) {
                  const auto byte = static_cast<unsigned char>(character);
                  *hash ^= byte;
                  *hash *= kFnvPrime;
              }
          }
          '''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
      - name: Commit source repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native_shader_execution.cpp
          git commit -m 'Fix native shader hash signedness'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
