name: Z7 bogus-comment NUL after DOCTYPE diagnostic v1

on:
  push:
    branches:
      - candidate/z7-tokenizer-bogus-comment-nul-after-doctype-diagnostic-v1

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply proven bogus-comment NUL candidate
        run: |
          set -euo pipefail
          git fetch --no-tags origin 34ce695763b2bd64293d8a04098d8f56723888ae
          git show 34ce695763b2bd64293d8a04098d8f56723888ae:scripts/apply_z7_tokenizer_markup_bogus_comment_nul_v1.py > scripts/.bogus_nul_old_helper.py
          python3 scripts/apply_z7_bogus_comment_nul_after_doctype_diagnostic_v1.py
          git diff --check
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused tokenizer targets
        run: cmake --build build --parallel 2 --target zevryon-html-tokenizer-markup-declarations-v1-tests zevryon-html-tokenizer-token-stream-v1-tests zevryon-html-tokenizer-token-stream-v1-probe
      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build/zevryon-html-tokenizer-markup-declarations-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests
      - name: Verify harnesses
        run: |
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
      - name: Measure complete corpus
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --probe build/zevryon-html-tokenizer-token-stream-v1-probe > census.json
          python3 -c "import json; r=json.load(open('census.json')); assert r['executions']==7036; assert r['failed']<=122; print('DIAGNOSTIC_TOTALS',r['passed'],r['failed'],r['unsupported']); print('DIAGNOSTIC_NUL',r['reason_counts'].get('unsupported:input-preprocessing-nul',0)); print('DIAGNOSTIC_PARSE_MISMATCH',r['reason_counts'].get('failed:parse-error-stream-mismatch',0)); print('DIAGNOSTIC_TOKEN_MISMATCH',r['reason_counts'].get('failed:token-stream-mismatch',0))"
      - name: Block diagnostic publication
        run: |
          echo 'Diagnostic evidence collected; branch must not be merged.' >&2
          exit 1
