name: Z7 tree reparent staging

on:
  pull_request:
    paths:
      - 'src/logical_node_source_v2_reparent.hpp'
      - 'tests/logical_node_source_v2_reparent_tests.cpp'
      - '.github/workflows/z7-tree-reparent-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Attach test target
        run: |
          cat >> cmake/logical_node_arena.cmake <<'EOF'
          if(BUILD_TESTING)
            add_executable(
              zevryon-logical-node-source-v2-reparent-tests
              tests/logical_node_source_v2_reparent_tests.cpp)
            target_link_libraries(
              zevryon-logical-node-source-v2-reparent-tests
              PRIVATE zevryon-massivedoc-core)
            zevryon_options(zevryon-logical-node-source-v2-reparent-tests)
          endif()
          EOF
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build and execute
        run: |
          cmake --build build --parallel 2 --target zevryon-logical-node-source-v2-reparent-tests
          ./build/zevryon-logical-node-source-v2-reparent-tests

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Attach test target
        shell: pwsh
        run: |
          @'
          if(BUILD_TESTING)
            add_executable(
              zevryon-logical-node-source-v2-reparent-tests
              tests/logical_node_source_v2_reparent_tests.cpp)
            target_link_libraries(
              zevryon-logical-node-source-v2-reparent-tests
              PRIVATE zevryon-massivedoc-core)
            zevryon_options(zevryon-logical-node-source-v2-reparent-tests)
          endif()
          '@ | Add-Content -Path cmake/logical_node_arena.cmake
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=ON `
            -DZEVRYON_ENABLE_RUST_CORE=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build and execute
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target zevryon-logical-node-source-v2-reparent-tests
          .\build\Release\zevryon-logical-node-source-v2-reparent-tests.exe
