name: apply-z2d1-once

on:
  push:
    branches:
      - work/z2d-unicode-line-break-opportunities
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2d-unicode-line-break-opportunities
          fetch-depth: 0
      - name: Verify staged payload
        shell: bash
        run: |
          set -euo pipefail
          cat .z2d1-payload/chunk-* > /tmp/z2d1.b64
          test "$(wc -c < /tmp/z2d1.b64)" -eq 39948
          echo "fd086eb12b7f6b58cf3b584a5e2c1125447b8f8160f7e75d5e840ca8c8e72923  /tmp/z2d1.b64" | sha256sum --check
          base64 --decode /tmp/z2d1.b64 > /tmp/z2d1.tar.gz
          echo "b43ca68b54a13c40644244d549a872135251aa46e0975fb3f587bd7ebc028951  /tmp/z2d1.tar.gz" | sha256sum --check
          gzip --test /tmp/z2d1.tar.gz
          tar --list --gzip --file /tmp/z2d1.tar.gz
      - name: Materialize Z2D-1 sources
        shell: bash
        run: |
          set -euo pipefail
          tar --extract --gzip --file /tmp/z2d1.tar.gz --directory .
          test -f src/line_break_opportunity.cpp
          test -f src/unicode_line_break_data.cpp
          test -f tests/line_break_opportunity_tests.cpp
          test -f .github/workflows/z2-unicode-line-break.yml
          rm -rf .z2d1-payload
          rm -f .github/workflows/apply-z2d1-once.yml
      - name: Commit materialized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Z2D-1: materialize bounded Unicode line-break sources"
          git push origin HEAD:work/z2d-unicode-line-break-opportunities
