name: apply-z2d1-once

on:
  push:
    branches:
      - work/z2d-unicode-line-break-opportunities
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2d-unicode-line-break-opportunities
          fetch-depth: 0
          show-progress: false
      - name: Decode and materialize Z2D-1 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          expected_encoded_hash = 'fd086eb12b7f6b58cf3b584a5e2c1125447b8f8160f7e75d5e840ca8c8e72923'
          paths = sorted(Path('.z2d1-payload').glob('chunk-*'))
          if len(paths) != 8:
              raise SystemExit(f'expected 8 payload chunks, found {len(paths)}')
          chunks = [path.read_text(encoding='ascii').removesuffix('\n') for path in paths]
          encoded = ''.join(chunks)
          encoded_hash = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if encoded_hash != expected_encoded_hash:
              if len(encoded) != 39956:
                  raise SystemExit(f'unexpected staged payload length/hash: {len(encoded)} {encoded_hash}')
              prefix = ''.join(chunks[:-1])
              final_chunk = chunks[-1]
              repaired = []
              for index in range(0, len(final_chunk) - 7):
                  candidate = prefix + final_chunk[:index] + final_chunk[index + 8:]
                  if hashlib.sha256(candidate.encode('ascii')).hexdigest() == expected_encoded_hash:
                      repaired.append((index, final_chunk[index:index + 8], candidate))
              if len(repaired) != 1:
                  raise SystemExit(f'expected one exact 8-byte repair, found {len(repaired)}')
              index, removed, encoded = repaired[0]
              print({'repaired_final_chunk_at': index, 'removed': removed})
          if len(encoded) != 39948:
              raise SystemExit(f'encoded length mismatch after repair: {len(encoded)}')
          archive = base64.b64decode(encoded, validate=True)
          archive_hash = hashlib.sha256(archive).hexdigest()
          if archive_hash != 'b43ca68b54a13c40644244d549a872135251aa46e0975fb3f587bd7ebc028951':
              raise SystemExit(f'archive SHA-256 mismatch: {archive_hash}')
          gzip.decompress(archive)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              names = bundle.getnames()
              if len(names) != 12:
                  raise SystemExit(f'archive member count mismatch: {len(names)}')
              for member in bundle.getmembers():
                  if member.islnk() or member.issym() or member.name.startswith('/') or '..' in Path(member.name).parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              bundle.extractall(path='.', filter='data')
          required = [
              'src/line_break_opportunity.cpp',
              'src/unicode_line_break_data.cpp',
              'tests/line_break_opportunity_tests.cpp',
              '.github/workflows/z2-unicode-line-break.yml',
          ]
          for name in required:
              if not Path(name).is_file():
                  raise SystemExit(f'missing materialized file: {name}')
          print({'chunks': len(paths), 'encoded_bytes': len(encoded), 'archive_bytes': len(archive), 'members': names})
          PY
          rm -rf .z2d1-payload
          rm -f .github/workflows/apply-z2d1-once.yml
      - name: Commit materialized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Z2D-1: materialize bounded Unicode line-break sources"
          git push origin HEAD:work/z2d-unicode-line-break-opportunities
