name: apply-z2d1-once

on:
  push:
    branches:
      - work/z2d-unicode-line-break-opportunities
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2d-unicode-line-break-opportunities
          fetch-depth: 0
          show-progress: false
      - name: Inspect staged payload parts
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          paths = [Path(f'.z2d1-payload/chunk-{index:02d}') for index in range(8)]
          paths += [Path(f'.z2d1-repair/chunk07-{index:02d}') for index in range(5)]
          rows = []
          for path in paths:
              raw = path.read_bytes()
              normalized = raw[:-1] if raw.endswith(b'\n') else raw
              rows.append({
                  'path': str(path),
                  'raw_bytes': len(raw),
                  'raw_sha256': hashlib.sha256(raw).hexdigest(),
                  'normalized_bytes': len(normalized),
                  'normalized_sha256': hashlib.sha256(normalized).hexdigest(),
                  'prefix': normalized[:16].decode('ascii', errors='replace'),
                  'suffix': normalized[-16:].decode('ascii', errors='replace'),
              })
          Path('z2d1-part-diagnostic.json').write_text(
              json.dumps(rows, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY
      - name: Upload part diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: z2d1-part-diagnostic-${{ github.sha }}
          path: z2d1-part-diagnostic.json
      - name: Decode and materialize Z2D-1 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import tarfile
          from pathlib import Path
          def read_piece(path: Path) -> str:
              return path.read_text(encoding='ascii').removesuffix('\n')
          prefix_paths = [Path(f'.z2d1-payload/chunk-{index:02d}') for index in range(7)]
          repair_paths = [Path(f'.z2d1-repair/chunk07-{index:02d}') for index in range(5)]
          encoded = ''.join(read_piece(path) for path in prefix_paths + repair_paths)
          if len(encoded) != 39948:
              raise SystemExit(f'encoded length mismatch: {len(encoded)}')
          actual = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if actual != 'fd086eb12b7f6b58cf3b584a5e2c1125447b8f8160f7e75d5e840ca8c8e72923':
              raise SystemExit(f'encoded SHA-256 mismatch: {actual}')
          archive = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(archive).hexdigest() != 'b43ca68b54a13c40644244d549a872135251aa46e0975fb3f587bd7ebc028951':
              raise SystemExit('archive SHA-256 mismatch')
          gzip.decompress(archive)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              bundle.extractall(path='.', filter='data')
          PY
          rm -rf .z2d1-payload .z2d1-repair
          rm -f .github/workflows/z2-unicode-line-break.yml
          rm -f z2d1-part-diagnostic.json
      - name: Commit materialized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Z2D-1: materialize bounded Unicode line-break sources"
          git push origin HEAD:work/z2d-unicode-line-break-opportunities
