name: apply-z2d1-once

on:
  push:
    branches:
      - work/z2d-unicode-line-break-opportunities
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2d-unicode-line-break-opportunities
          fetch-depth: 0
          show-progress: false
      - name: Decode and materialize Z2D-1 sources
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import json
          import tarfile
          import traceback
          from pathlib import Path

          diagnostic = {}
          try:
              paths = sorted(Path('.z2d1-payload').glob('chunk-*'))
              diagnostic['paths'] = [str(path) for path in paths]
              diagnostic['chunk_sizes'] = [path.stat().st_size for path in paths]
              diagnostic['chunk_sha256'] = [hashlib.sha256(path.read_bytes()).hexdigest() for path in paths]
              encoded = ''.join(path.read_text(encoding='ascii') for path in paths)
              diagnostic['encoded_length'] = len(encoded)
              diagnostic['encoded_sha256'] = hashlib.sha256(encoded.encode('ascii')).hexdigest()
              archive = base64.b64decode(encoded, validate=True)
              diagnostic['archive_length'] = len(archive)
              diagnostic['archive_sha256'] = hashlib.sha256(archive).hexdigest()
              diagnostic['gzip_length'] = len(gzip.decompress(archive))
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
                  names = bundle.getnames()
                  diagnostic['members'] = names
                  for member in bundle.getmembers():
                      if member.islnk() or member.issym() or member.name.startswith('/') or '..' in Path(member.name).parts:
                          raise RuntimeError(f'unsafe archive member: {member.name}')
                  bundle.extractall(path='.', filter='data')
              required = [
                  'src/line_break_opportunity.cpp',
                  'src/unicode_line_break_data.cpp',
                  'tests/line_break_opportunity_tests.cpp',
                  '.github/workflows/z2-unicode-line-break.yml',
              ]
              diagnostic['required_exists'] = {name: Path(name).is_file() for name in required}
              if not all(diagnostic['required_exists'].values()):
                  raise RuntimeError('one or more materialized files are missing')
              diagnostic['success'] = True
          except Exception as exc:
              diagnostic['success'] = False
              diagnostic['error'] = repr(exc)
              diagnostic['traceback'] = traceback.format_exc()
          Path('z2d1-bootstrap-diagnostic.json').write_text(
              json.dumps(diagnostic, indent=2, sort_keys=True) + '\n',
              encoding='utf-8')
          print(json.dumps(diagnostic, indent=2, sort_keys=True))
          if not diagnostic['success']:
              raise SystemExit(1)
          PY
          rm -rf .z2d1-payload
          rm -f .github/workflows/apply-z2d1-once.yml
          rm -f z2d1-bootstrap-diagnostic.json
      - name: Upload bootstrap diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z2d1-bootstrap-diagnostic-${{ github.sha }}
          path: z2d1-bootstrap-diagnostic.json
          if-no-files-found: warn
      - name: Commit materialized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Z2D-1: materialize bounded Unicode line-break sources"
          git push origin HEAD:work/z2d-unicode-line-break-opportunities
