name: apply-z2d1-once

on:
  push:
    branches:
      - work/z2d-unicode-line-break-opportunities
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2d-unicode-line-break-opportunities
          fetch-depth: 0
          show-progress: false
      - name: Connect Unicode line-break CMake module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cmake/harfbuzz_shaping.cmake')
          text = path.read_text(encoding='utf-8')
          include_line = 'include("${CMAKE_CURRENT_LIST_DIR}/unicode_line_break.cmake")'
          if include_line not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '\n' + include_line + '\n'
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit CMake integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmake/harfbuzz_shaping.cmake
          git commit -m "Z2D-1: connect Unicode line-break build module"
          git push origin HEAD:work/z2d-unicode-line-break-opportunities
