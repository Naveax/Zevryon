name: apply-z2d1-once

on:
  push:
    branches:
      - work/z2d-unicode-line-break-opportunities

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2d-unicode-line-break-opportunities
          fetch-depth: 0
      - name: Materialize Z2D-1 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .z2d1-payload/chunk-* > /tmp/z2d1.b64
          base64 --decode /tmp/z2d1.b64 > /tmp/z2d1.tar.gz
          tar -xzf /tmp/z2d1.tar.gz -C .
          python3 - <<'PY'
          from pathlib import Path

          header = Path('src/resource_ledger.hpp')
          text = header.read_text(encoding='utf-8')
          old = "    GlyphClusterMap,\n    CaretBoundaryMap,\n    Count"
          new = "    GlyphClusterMap,\n    CaretBoundaryMap,\n    LineBreakOpportunityMap,\n    Count"
          if 'LineBreakOpportunityMap' not in text:
              if old not in text:
                  raise SystemExit('resource ledger enum anchor not found')
              text = text.replace(old, new, 1)
              header.write_text(text, encoding='utf-8')

          source = Path('src/resource_ledger.cpp')
          text = source.read_text(encoding='utf-8')
          old = '    "glyph_cluster_map",\n    "caret_boundary_map",\n};'
          new = '    "glyph_cluster_map",\n    "caret_boundary_map",\n    "line_break_opportunity_map",\n};'
          if 'line_break_opportunity_map' not in text:
              if old not in text:
                  raise SystemExit('resource ledger name anchor not found')
              text = text.replace(old, new, 1)
              source.write_text(text, encoding='utf-8')

          cmake = Path('cmake/harfbuzz_shaping.cmake')
          text = cmake.read_text(encoding='utf-8')
          include_line = 'include("${CMAKE_CURRENT_LIST_DIR}/unicode_line_break.cmake")'
          if include_line not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '\n' + include_line + '\n'
              cmake.write_text(text, encoding='utf-8')
          PY
          rm -rf .z2d1-payload
          rm -f .github/workflows/apply-z2d1-once.yml
      - name: Commit Z2D-1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Z2D-1: add bounded Unicode 17 line-break opportunities"
          git push origin HEAD:work/z2d-unicode-line-break-opportunities
