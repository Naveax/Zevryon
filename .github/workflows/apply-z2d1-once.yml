name: apply-z2d1-once

on:
  push:
    branches:
      - work/z2d-unicode-line-break-opportunities
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2d-unicode-line-break-opportunities
          fetch-depth: 0
          show-progress: false
      - name: Decode and materialize Z2D-1 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          def read_piece(path: Path) -> str:
              return path.read_text(encoding='ascii').removesuffix('\n')

          prefix_paths = [Path(f'.z2d1-payload/chunk-{index:02d}') for index in range(7)]
          repair_paths = [Path(f'.z2d1-repair/chunk07-{index:02d}') for index in range(5)]
          if not all(path.is_file() for path in prefix_paths + repair_paths):
              raise SystemExit('one or more staged payload parts are missing')

          repair_hashes = [
              '37624cf5bc71a77c31cc21e8c4f6eedf0da4c817d202de26b2efefdf9ddc14bb',
              'bfe0b5f37af90dce38f8bc6b5eb59435c440ac8b1e9c02fddae84bb1afb82d5b',
              'ae9df570513a7fa988b8a8af9a41f49c48212be8ff4ab360656c6a6a12cd2f34',
              '9657819b3e5d44e130d4169c972626d6dadf77edceed88c13f34b62a7a20e7cf',
              'bc6cf67156ed4f05b4e428e0f0fe0eb686efa4c5262a2f2977d8a15b1293f309',
          ]
          repair_parts = []
          for path, expected_hash in zip(repair_paths, repair_hashes, strict=True):
              part = read_piece(path)
              actual_hash = hashlib.sha256(part.encode('ascii')).hexdigest()
              if actual_hash != expected_hash:
                  raise SystemExit(f'repair part mismatch for {path}: {actual_hash}')
              repair_parts.append(part)

          encoded = ''.join(read_piece(path) for path in prefix_paths) + ''.join(repair_parts)
          if len(encoded) != 39948:
              raise SystemExit(f'encoded length mismatch: {len(encoded)}')
          if hashlib.sha256(encoded.encode('ascii')).hexdigest() != 'fd086eb12b7f6b58cf3b584a5e2c1125447b8f8160f7e75d5e840ca8c8e72923':
              raise SystemExit('encoded SHA-256 mismatch')

          archive = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(archive).hexdigest() != 'b43ca68b54a13c40644244d549a872135251aa46e0975fb3f587bd7ebc028951':
              raise SystemExit('archive SHA-256 mismatch')
          gzip.decompress(archive)

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              for member in bundle.getmembers():
                  if member.islnk() or member.issym() or member.name.startswith('/') or '..' in Path(member.name).parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              bundle.extractall(path='.', filter='data')

          required = [
              'src/line_break_opportunity.cpp',
              'src/unicode_line_break_data.cpp',
              'tests/line_break_opportunity_tests.cpp',
          ]
          for name in required:
              if not Path(name).is_file():
                  raise SystemExit(f'missing materialized file: {name}')
          PY
          rm -rf .z2d1-payload .z2d1-repair
          rm -f .github/workflows/z2-unicode-line-break.yml
      - name: Commit materialized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Z2D-1: materialize bounded Unicode line-break sources"
          git push origin HEAD:work/z2d-unicode-line-break-opportunities
