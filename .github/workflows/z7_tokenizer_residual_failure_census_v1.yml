name: Z7 residual failure census v1

on:
  push:
    branches:
      - diagnostic/z7-tokenizer-residual-failure-census-v1

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Expand diagnostic sample capacity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py')
          s=p.read_text(encoding='utf-8')
          old='MAX_SAMPLES = 25'
          if s.count(old)!=1:
              raise SystemExit(f'MAX_SAMPLES anchor count={s.count(old)}')
          p.write_text(s.replace(old,'MAX_SAMPLES = 200',1),encoding='utf-8')
          PY
          git diff --check
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build canonical tokenizer probe
        run: cmake --build build --parallel 2 --target zevryon-html-tokenizer-token-stream-v1-probe
      - name: Measure and classify all residual failures
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --probe build/zevryon-html-tokenizer-token-stream-v1-probe > census.json
          python3 - <<'PY'
          import json
          from collections import Counter,defaultdict
          from pathlib import Path
          r=json.loads(Path('census.json').read_text(encoding='utf-8'))
          assert r['executions']==7036,r
          assert r['failed']==122,r
          assert len(r['failure_samples'])==122,(len(r['failure_samples']),r['failed'])
          groups=defaultdict(list)
          for item in r['failure_samples']:
              groups[item['reason']].append(item['label'])
          print('RESIDUAL_TOTALS',r['passed'],r['failed'],r['unsupported'])
          print('RESIDUAL_REASONS',json.dumps({k:len(v) for k,v in sorted(groups.items())},sort_keys=True))
          for reason in sorted(groups):
              print('BEGIN_REASON',reason,len(groups[reason]))
              for label in groups[reason]:
                  print('CASE',reason,label)
              print('END_REASON',reason)
          Path('failure-samples.json').write_text(json.dumps(groups,indent=2,ensure_ascii=False,sort_keys=True),encoding='utf-8')
          PY
      - name: Upload residual failure evidence
        uses: actions/upload-artifact@v4
        with:
          name: z7-residual-failure-census-v1
          path: |
            census.json
            failure-samples.json
          if-no-files-found: error
      - name: Block diagnostic publication
        run: |
          echo 'Diagnostic evidence collected; branch must not be merged.' >&2
          exit 1
