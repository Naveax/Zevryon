name: z2d2-signed-advance-patch-once

on:
  push:
    branches:
      - work/z2d-bounded-width-line-selection
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/z2d2-signed-advance-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2d-bounded-width-line-selection
          fetch-depth: 0
      - name: Correct signed glyph-group advance accumulation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/line_selection.cpp')
          text = source.read_text(encoding='utf-8')
          old_helper = '''std::uint64_t advance_magnitude(std::int32_t advance) noexcept {
    const std::int64_t widened = advance;
    return widened >= 0 ? static_cast<std::uint64_t>(widened)
                        : static_cast<std::uint64_t>(-widened);
}
'''
          new_helper = '''bool checked_add_signed(
    std::int64_t* value,
    std::int32_t addition) noexcept {
    const std::int64_t widened = addition;
    if ((widened > 0 &&
         *value > std::numeric_limits<std::int64_t>::max() - widened) ||
        (widened < 0 &&
         *value < std::numeric_limits<std::int64_t>::min() - widened)) {
        return false;
    }
    *value += widened;
    return true;
}

std::uint64_t advance_magnitude(std::int64_t advance) noexcept {
    return advance >= 0
        ? static_cast<std::uint64_t>(advance)
        : static_cast<std::uint64_t>(-(advance + 1)) + 1U;
}
'''
          if old_helper not in text:
              raise SystemExit('advance helper anchor not found')
          text = text.replace(old_helper, new_helper, 1)

          old_loop = '''        std::uint64_t owner_advance = 0U;
        for (std::size_t glyph_offset = 0U;
             glyph_offset < glyph_count;
             ++glyph_offset) {
            const std::size_t glyph_index = first_glyph + glyph_offset;
            if (!checked_add(
                    &owner_advance,
                    advance_magnitude(run.glyphs[glyph_index].x_advance))) {
                return fail(
                    LineSelectionErrorKind::AdvanceOverflow,
                    record.segment_index,
                    glyph_index,
                    cluster_index,
                    cluster_index,
                    "glyph-group inline advance overflowed",
                    error);
            }
        }
        cluster_advances[static_cast<std::size_t>(cluster_index)] =
            owner_advance;
'''
          new_loop = '''        std::int64_t signed_owner_advance = 0;
        for (std::size_t glyph_offset = 0U;
             glyph_offset < glyph_count;
             ++glyph_offset) {
            const std::size_t glyph_index = first_glyph + glyph_offset;
            if (!checked_add_signed(
                    &signed_owner_advance,
                    run.glyphs[glyph_index].x_advance)) {
                return fail(
                    LineSelectionErrorKind::AdvanceOverflow,
                    record.segment_index,
                    glyph_index,
                    cluster_index,
                    cluster_index,
                    "signed glyph-group inline advance overflowed",
                    error);
            }
        }
        const std::uint64_t owner_advance =
            advance_magnitude(signed_owner_advance);
        cluster_advances[static_cast<std::size_t>(cluster_index)] =
            owner_advance;
'''
          if old_loop not in text:
              raise SystemExit('owner advance loop anchor not found')
          text = text.replace(old_loop, new_loop, 1)
          source.write_text(text, encoding='utf-8')

          tests = Path('tests/line_selection_tests.cpp')
          test_text = tests.read_text(encoding='utf-8')
          anchor = '''void test_rtl_advance_uses_magnitude() {
'''
          test = '''void test_mixed_sign_glyph_group_uses_net_advance() {
    Fixture fixture;
    fixture.cluster_count = 1U;
    fixture.shaped_text.segments.emplace_back(
        fixture.shaped_text.glyph_resource());
    MultiRunShapedSegment& segment = fixture.shaped_text.segments.back();
    segment.run = ShapingRunBoundary{
        0U,
        static_cast<FontFaceId>(3U),
        ScriptId::Latn,
        ShapingDirection::LeftToRight,
        FontFallbackSource::Primary,
        0U,
        0U};
    segment.glyphs.first_cluster = 0U;
    segment.glyphs.cluster_limit = 1U;
    segment.glyphs.script = segment.run.script;
    segment.glyphs.direction = segment.run.direction;
    segment.glyphs.glyphs.push_back(ShapedGlyph{
        301U, 0U, 10, 0, 0, 0, 0U});
    segment.glyphs.glyphs.push_back(ShapedGlyph{
        302U, 0U, -3, 0, 0, 0, 0U});
    fixture.cluster_map.records.push_back(GlyphClusterRecord{
        0U, 0U, 0U, 2U});
    append_opportunities(
        &fixture,
        {
            LineBreakOpportunity::Prohibited,
            LineBreakOpportunity::Mandatory
        });
    append_caret_safety(&fixture, {true, true});

    LineSelection output = select(&fixture, 7U);
    REQUIRE(output.lines.size() == 1U);
    REQUIRE(output.lines[0].inline_advance == 7U);
    REQUIRE(!selected_line_has_flag(
        output,
        0U,
        kSelectedLineOverflow));
}

'''
          if anchor not in test_text:
              raise SystemExit('test insertion anchor not found')
          test_text = test_text.replace(anchor, test + anchor, 1)
          main_anchor = '''    test_certified_cluster_and_caret_maps_feed_selection();
    test_rtl_advance_uses_magnitude();
'''
          main_new = '''    test_certified_cluster_and_caret_maps_feed_selection();
    test_mixed_sign_glyph_group_uses_net_advance();
    test_rtl_advance_uses_magnitude();
'''
          if main_anchor not in test_text:
              raise SystemExit('main test anchor not found')
          test_text = test_text.replace(main_anchor, main_new, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/line_selection.cpp tests/line_selection_tests.cpp
          git commit -m "Z2D-2: accumulate net signed glyph-group advances"
          git push origin HEAD:work/z2d-bounded-width-line-selection
