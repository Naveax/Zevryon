name: Z2R-3D-U Unicode promotion readiness
# Temporary idempotent repair job; removed after the normal source commit lands.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cmake/rust_core.cmake"
      - "cmake/z2r3d_unicode_probe.cmake"
      - "src/unicode_stream.*"
      - "scripts/z2r3d_*unicode*.py"
      - "tests/*z2r3d_unicode*"
      - "docs/Z2R3D_UNICODE_PROMOTION_READINESS.md"
      - ".github/workflows/z2r3d-unicode-promotion-readiness.yml"
      - "rust/crates/zevryon-unicode-*/**"
      - "rust/unicode-bridge/**"
permissions:
  contents: write
concurrency:
  group: z2r3du-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repair-budget:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/z2r3d-unicode-promotion-readiness
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/z2r3d_unicode_workload.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''    std::array<std::byte, 128> storage{};
    std::pmr::monotonic_buffer_resource arena(
        storage.data(),
        storage.size(),
        std::pmr::null_memory_resource());
    std::pmr::vector<DecodedCodePoint> output(&arena);'''
          new = '''    std::pmr::vector<DecodedCodePoint> output(
        std::pmr::null_memory_resource());'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise RuntimeError('budget resource block not recognized')
          PY
          if git diff --quiet -- tests/z2r3d_unicode_workload.cpp; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/z2r3d_unicode_workload.cpp
          git commit -m "Make Z2R-3D-U budget failure deterministic"
          git push origin HEAD:agent/z2r3d-unicode-promotion-readiness
  contracts:
    needs: repair-budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip pytest
      - run: >-
          python -m py_compile scripts/z2r3d_ci_unicode.py
          scripts/z2r3d_run_unicode_workloads.py
          scripts/z2r3d_unicode_certification.py
          scripts/z2r3d_finalize_unicode_promotion.py
      - run: python -m pytest -q tests/test_z2r3d_unicode_certification.py
  platform:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux, compiler: GNU}
          - {os: windows-latest, platform: windows, compiler: MSVC}
          - {os: macos-latest, platform: macos, compiler: AppleClang}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip psutil
      - run: >-
          python scripts/z2r3d_ci_unicode.py platform
          --platform ${{ matrix.platform }} --compiler ${{ matrix.compiler }}
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: z2r3du-${{ matrix.platform }}-${{ github.sha }}
          path: evidence/z2r3du/${{ matrix.platform }}-*.json
          if-no-files-found: error
  final:
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip pytest
      - uses: actions/download-artifact@v4
        with:
          pattern: z2r3du-*-${{ github.sha }}
          path: evidence/z2r3du/downloaded
          merge-multiple: true
      - run: python -m pytest -q tests/test_z2r3d_unicode_certification.py
      - run: >-
          python scripts/z2r3d_ci_unicode.py finalize
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: z2r3du-promotion-${{ github.sha }}
          path: evidence/z2r3du/z2r3du-promotion-readiness.json
          if-no-files-found: error
