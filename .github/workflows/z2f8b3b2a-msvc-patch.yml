name: z2f8b3b2a-msvc-patch

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/z2f8b3b2a-msvc-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply exact MSVC lambda-constness fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/native_shader_execution_d3d12.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'std::uint32_t stride) mutable {'
          new = 'std::uint32_t stride) {'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one patch target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code -- src/native_shader_execution_d3d12.cpp && exit 1 || true
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native_shader_execution_d3d12.cpp
          git commit -m 'fix D3D12 descriptor lambda constness for MSVC'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
