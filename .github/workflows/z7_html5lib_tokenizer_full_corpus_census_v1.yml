name: Z7 html5lib tokenizer full corpus census v1

on:
  pull_request:
    paths:
      - 'src/html_tokenizer_*'
      - 'tests/html_tokenizer_*'
      - 'scripts/z7_html5lib_tokenizer_*'
      - 'config/z7_html5lib_tokenizer_corpus.json'
      - 'config/z7_html5lib_tokenizer_full_corpus_census_v1.json'
      - 'config/z7_html5lib_tokenizer_full_corpus_census_v2.json'
      - 'config/z7_html5lib_tokenizer_full_corpus_census_v3.json'
      - 'config/z7_html5lib_tokenizer_full_corpus_census_v4.json'
      - 'config/z7_html5lib_tokenizer_full_corpus_census_v5.json'
      - 'tests/fixtures/html5lib-tokenizer/**'
      - 'docs/Z7_HTML5LIB_TOKENIZER_FULL_CORPUS_CENSUS_V1.md'
      - '.github/workflows/z7_html5lib_tokenizer_full_corpus_census_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON

      - name: Build canonical tokenizer probe
        run: cmake --build build --parallel 2 --target zevryon-html-tokenizer-token-stream-v1-probe

      - name: Verify provenance and harness self-tests
        run: |
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1_baseline.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v2_baseline.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v3_baseline.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v4_baseline.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v5_baseline.py --self-test

      - name: Require admitted census to remain regression-free
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v5_baseline.py \
            --policy no-regression \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("census.json").read_text(encoding="utf-8"))
          assert report["files"] == 14, report
          assert report["tests"] == 6810, report
          assert report["executions"] == 7036, report
          assert report["passed"] >= 6618, report
          assert report["failed"] <= 122, report
          assert report["unsupported"] <= 296, report
          assert report["passed"] + report["failed"] + report["unsupported"] == 7036, report
          assert report["baseline_policy"] == "no-regression", report
          assert report["baseline_regression_free"] is True, report
          assert report["exact_execution_accounting"] is True, report
          assert report["full_corpus_pass_claim"] is False, report
          assert report["html_tokenizer_conformance_claim"] is False, report
          assert report["z7_status_change"] is False, report
          print(json.dumps(report, indent=2, ensure_ascii=False, sort_keys=True))
          PY
