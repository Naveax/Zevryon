name: z2-cached-catalog-harfbuzz-shaping

on:
  pull_request:
    paths:
      - '.github/workflows/z2-cached-catalog-harfbuzz-shaping.yml'
      - 'cmake/harfbuzz_shaping.cmake'
      - 'src/cached_catalog_harfbuzz_shaper.*'
      - 'src/cached_catalog_harfbuzz_shaping_benchmark_main.cpp'
      - 'src/prepared_harfbuzz_face_cache.*'
      - 'src/catalog_harfbuzz_shaper.*'
      - 'tests/cached_catalog_harfbuzz_shaper_tests.cpp'
      - 'docs/Z2B12B_CACHED_CATALOG_HARFBUZZ_SHAPING.md'
  workflow_dispatch:

concurrency:
  group: z2-cached-catalog-harfbuzz-shaping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz and real-font fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libharfbuzz-dev fonts-dejavu-core
      - name: Configure strict Release build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON \
            -DZEVRYON_TEST_FONT_LATIN=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Build cache-backed shaping chain and benchmark
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-cached-catalog-harfbuzz-shaper-tests \
            zevryon-prepared-harfbuzz-face-cache-tests \
            zevryon-prepared-harfbuzz-shaping-tests \
            zevryon-cached-catalog-harfbuzz-shaping-benchmark \
            2>&1 | tee cached-catalog-shaping-build.log
      - name: Repeat cache-backed concurrency certification
        run: |
          set -o pipefail
          ctest --test-dir build \
            -R '^cached-catalog-harfbuzz-shaper-tests$' \
            --repeat until-fail:10 --output-on-failure \
            2>&1 | tee cached-catalog-shaping-repeat.log
      - name: Run cache and prepared dependencies
        run: |
          set -o pipefail
          ctest --test-dir build \
            -R '^(prepared-harfbuzz-face-cache-tests|prepared-harfbuzz-shaping-tests)$' \
            --output-on-failure \
            2>&1 | tee cached-catalog-shaping-dependencies.log
      - name: Run alternating automatic/direct/plain distributions
        run: |
          for run in 1 2 3 4 5; do
            ./build/zevryon-cached-catalog-harfbuzz-shaping-benchmark \
              /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
              > "cached-catalog-shaping-benchmark-${run}.jsonl"
          done
      - name: Enforce equivalence and cache-hit latency gates
        run: |
          python3 - <<'PY'
          import json, statistics
          equal = (
              "input_utf8_bytes", "input_codepoints", "input_clusters",
              "output_glyphs", "output_bytes", "total_x_advance",
              "units_per_em", "generation_id", "face_id", "resource_id",
          )
          cached_direct, cached_plain = [], []
          for run in range(1, 6):
              rows = [json.loads(x) for x in open(
                  f"cached-catalog-shaping-benchmark-{run}.jsonl",
                  encoding="utf-8") if x.strip()]
              assert len(rows) == 3, (run, len(rows))
              d = {row["mode"]: row for row in rows}
              assert set(d) == {"plain_binding_call", "direct_prepared_call",
                                "cached_prepared_call"}
              plain, direct, cached = d["plain_binding_call"], \
                  d["direct_prepared_call"], d["cached_prepared_call"]
              assert plain["schema"] == direct["schema"] == cached["schema"] == \
                  "zevryon.cached-catalog-shaping-benchmark.v1"
              assert plain["prepared"] is False
              assert direct["prepared"] is True
              assert cached["prepared"] is True
              for key in equal:
                  assert plain[key] == direct[key] == cached[key], (
                      run, key, plain[key], direct[key], cached[key])
              for row in (plain, direct, cached):
                  assert row["input_utf8_bytes"] >= 64
                  assert row["output_glyphs"] > 0
                  assert row["output_bytes"] == row["output_glyphs"] * 28
                  assert row["accounting_clean"] is True
                  assert row["within_hard_limits"] is True
                  assert 0.0 < row["p50_ms"] <= row["p95_ms"] <= \
                      row["p99_ms"] <= row["maximum_ms"]
              cd = cached["p50_ms"] / direct["p50_ms"]
              cp = cached["p50_ms"] / plain["p50_ms"]
              assert cd <= 1.35, (run, "cached/direct", cd)
              assert cp <= 0.90, (run, "cached/plain", cp)
              cached_direct.append(cd); cached_plain.append(cp)
          assert statistics.median(cached_direct) <= 1.20, cached_direct
          assert statistics.median(cached_plain) <= 0.75, cached_plain
          print({"cached_direct": cached_direct,
                 "cached_plain": cached_plain,
                 "median_cached_direct": statistics.median(cached_direct),
                 "median_cached_plain": statistics.median(cached_plain)})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-cached-catalog-shaping-${{ github.sha }}
          path: |
            cached-catalog-shaping-build.log
            cached-catalog-shaping-repeat.log
            cached-catalog-shaping-dependencies.log
            cached-catalog-shaping-benchmark-*.jsonl
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz and real-font fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libharfbuzz-dev fonts-dejavu-core
      - name: Configure ASan and UBSan build
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            -DZEVRYON_ENABLE_SANITIZERS=ON \
            -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON \
            -DZEVRYON_TEST_FONT_LATIN=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Build cache-backed shaping chain under sanitizers
        run: |
          set -o pipefail
          cmake --build build-sanitized --parallel 2 --target \
            zevryon-cached-catalog-harfbuzz-shaper-tests \
            zevryon-prepared-harfbuzz-face-cache-tests \
            zevryon-prepared-harfbuzz-shaping-tests \
            2>&1 | tee cached-catalog-shaping-sanitizer-build.log
      - name: Run cache-backed shaping chain under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -o pipefail
          ctest --test-dir build-sanitized \
            -R '^(cached-catalog-harfbuzz-shaper-tests|prepared-harfbuzz-face-cache-tests|prepared-harfbuzz-shaping-tests)$' \
            --output-on-failure \
            2>&1 | tee cached-catalog-shaping-sanitizer-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-cached-catalog-shaping-sanitized-${{ github.sha }}
          path: |
            cached-catalog-shaping-sanitizer-build.log
            cached-catalog-shaping-sanitizer-test.log
          if-no-files-found: warn
