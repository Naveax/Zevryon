name: z2-line-selection

on:
  pull_request:
    paths:
      - '.github/workflows/z2-line-selection.yml'
      - 'cmake/line_selection.cmake'
      - 'cmake/unicode_line_break.cmake'
      - 'src/line_selection.*'
      - 'src/line_selection_benchmark_main.cpp'
      - 'src/line_break_opportunity.*'
      - 'src/caret_boundary_map.*'
      - 'src/glyph_cluster_map.*'
      - 'src/multi_run_harfbuzz_shaper.*'
      - 'src/resource_ledger.*'
      - 'tests/line_selection_tests.cpp'
      - 'docs/Z2D2_BOUNDED_WIDTH_LINE_SELECTION.md'
  workflow_dispatch:

concurrency:
  group: z2-line-selection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build line selection and dependencies
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-line-selection-tests \
            zevryon-line-selection-benchmark \
            zevryon-caret-boundary-map-tests \
            zevryon-glyph-cluster-map-tests \
            2>&1 | tee line-selection-build.log
      - name: Repeat focused certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^line-selection-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee line-selection-repeat.log
      - name: Run three independent distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-line-selection-benchmark \
              > "line-selection-benchmark-${run}.json"
          done
      - name: Enforce exact output, memory and latency gates
        run: |
          python3 - <<'PY'
          import json

          rows = []
          for run in range(1, 4):
              with open(f'line-selection-benchmark-{run}.json', encoding='utf-8') as handle:
                  row = json.load(handle)
              assert row['schema'] == 'zevryon.line-selection-benchmark.v1'
              assert row['input_clusters'] == 65_536
              assert row['input_segments'] == 2_048
              assert row['input_glyphs'] == 32_768
              assert row['input_boundaries'] == 65_537
              assert row['available_inline_advance'] == 2_048
              assert row['legal_boundaries'] == 8_192
              assert row['zero_advance_clusters'] == 32_768
              assert row['output_lines'] == 1_024
              assert row['soft_break_lines'] == 960
              assert row['mandatory_break_lines'] == 64
              assert row['overflow_lines'] == 0
              assert row['record_bytes'] == 16
              assert row['current_bytes'] == 16_384
              assert row['peak_bytes'] == 540_672
              assert row['hard_limit_bytes'] == 540_672
              assert row['total_inline_advance'] == 2_097_152
              assert row['maximum_line_advance'] == 2_048
              assert row['maximum_line_clusters'] == 64
              assert row['checksum'] == 14_685_043_611_820_972_315
              assert row['accounting_clean'] is True
              assert row['within_hard_limits'] is True
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 6.0, row
              assert row['p99_ms'] <= 9.0, row
              assert row['maximum_ms'] <= 15.0, row
              rows.append(row)
          assert len({row['checksum'] for row in rows}) == 1
          print({
              'p50_ms': [row['p50_ms'] for row in rows],
              'p95_ms': [row['p95_ms'] for row in rows],
              'p99_ms': [row['p99_ms'] for row in rows],
              'maximum_ms': [row['maximum_ms'] for row in rows],
              'checksum': rows[0]['checksum'],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-line-selection-${{ github.sha }}
          path: |
            line-selection-build.log
            line-selection-repeat.log
            line-selection-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests under sanitizers
        run: cmake --build build-sanitized --parallel 2 --target zevryon-line-selection-tests
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^line-selection-tests$' --output-on-failure

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build and run focused tests
        run: |
          cmake --build build --parallel 2 --target zevryon-line-selection-tests
          ctest --test-dir build -R '^line-selection-tests$' --output-on-failure
