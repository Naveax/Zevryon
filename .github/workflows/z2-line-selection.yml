name: z2-line-selection

on:
  pull_request:
    paths:
      - '.github/workflows/z2-line-selection.yml'
      - 'cmake/line_selection.cmake'
      - 'cmake/unicode_line_break.cmake'
      - 'src/line_selection.*'
      - 'src/line_selection_benchmark_main.cpp'
      - 'src/line_break_opportunity.*'
      - 'src/caret_boundary_map.*'
      - 'src/glyph_cluster_map.*'
      - 'src/multi_run_harfbuzz_shaper.*'
      - 'src/resource_ledger.*'
      - 'tests/line_selection_tests.cpp'
      - 'docs/Z2D2_BOUNDED_WIDTH_LINE_SELECTION.md'
  workflow_dispatch:

concurrency:
  group: z2-line-selection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-net-advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2d-bounded-width-line-selection
          fetch-depth: 0
      - name: Correct signed glyph-group advance accumulation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/line_selection.cpp')
          text = source.read_text(encoding='utf-8')
          old_helper = '''std::uint64_t advance_magnitude(std::int32_t advance) noexcept {
    const std::int64_t widened = advance;
    return widened >= 0 ? static_cast<std::uint64_t>(widened)
                        : static_cast<std::uint64_t>(-widened);
}
'''
          new_helper = '''bool checked_add_signed(
    std::int64_t* value,
    std::int32_t addition) noexcept {
    const std::int64_t widened = addition;
    if ((widened > 0 &&
         *value > std::numeric_limits<std::int64_t>::max() - widened) ||
        (widened < 0 &&
         *value < std::numeric_limits<std::int64_t>::min() - widened)) {
        return false;
    }
    *value += widened;
    return true;
}

std::uint64_t advance_magnitude(std::int64_t advance) noexcept {
    return advance >= 0
        ? static_cast<std::uint64_t>(advance)
        : static_cast<std::uint64_t>(-(advance + 1)) + 1U;
}
'''
          if old_helper not in text:
              raise SystemExit('advance helper anchor not found')
          text = text.replace(old_helper, new_helper, 1)

          old_loop = '''        std::uint64_t owner_advance = 0U;
        for (std::size_t glyph_offset = 0U;
             glyph_offset < glyph_count;
             ++glyph_offset) {
            const std::size_t glyph_index = first_glyph + glyph_offset;
            if (!checked_add(
                    &owner_advance,
                    advance_magnitude(run.glyphs[glyph_index].x_advance))) {
                return fail(
                    LineSelectionErrorKind::AdvanceOverflow,
                    record.segment_index,
                    glyph_index,
                    cluster_index,
                    cluster_index,
                    "glyph-group inline advance overflowed",
                    error);
            }
        }
        cluster_advances[static_cast<std::size_t>(cluster_index)] =
            owner_advance;
'''
          new_loop = '''        std::int64_t signed_owner_advance = 0;
        for (std::size_t glyph_offset = 0U;
             glyph_offset < glyph_count;
             ++glyph_offset) {
            const std::size_t glyph_index = first_glyph + glyph_offset;
            if (!checked_add_signed(
                    &signed_owner_advance,
                    run.glyphs[glyph_index].x_advance)) {
                return fail(
                    LineSelectionErrorKind::AdvanceOverflow,
                    record.segment_index,
                    glyph_index,
                    cluster_index,
                    cluster_index,
                    "signed glyph-group inline advance overflowed",
                    error);
            }
        }
        const std::uint64_t owner_advance =
            advance_magnitude(signed_owner_advance);
        cluster_advances[static_cast<std::size_t>(cluster_index)] =
            owner_advance;
'''
          if old_loop not in text:
              raise SystemExit('owner advance loop anchor not found')
          text = text.replace(old_loop, new_loop, 1)
          source.write_text(text, encoding='utf-8')

          tests = Path('tests/line_selection_tests.cpp')
          test_text = tests.read_text(encoding='utf-8')
          anchor = '''void test_rtl_advance_uses_magnitude() {
'''
          test = '''void test_mixed_sign_glyph_group_uses_net_advance() {
    Fixture fixture;
    fixture.cluster_count = 1U;
    fixture.shaped_text.segments.emplace_back(
        fixture.shaped_text.glyph_resource());
    MultiRunShapedSegment& segment = fixture.shaped_text.segments.back();
    segment.run = ShapingRunBoundary{
        0U,
        static_cast<FontFaceId>(3U),
        ScriptId::Latn,
        ShapingDirection::LeftToRight,
        FontFallbackSource::Primary,
        0U,
        0U};
    segment.glyphs.first_cluster = 0U;
    segment.glyphs.cluster_limit = 1U;
    segment.glyphs.script = segment.run.script;
    segment.glyphs.direction = segment.run.direction;
    segment.glyphs.glyphs.push_back(ShapedGlyph{
        301U, 0U, 10, 0, 0, 0, 0U});
    segment.glyphs.glyphs.push_back(ShapedGlyph{
        302U, 0U, -3, 0, 0, 0, 0U});
    fixture.cluster_map.records.push_back(GlyphClusterRecord{
        0U, 0U, 0U, 2U});
    append_opportunities(
        &fixture,
        {
            LineBreakOpportunity::Prohibited,
            LineBreakOpportunity::Mandatory
        });
    append_caret_safety(&fixture, {true, true});

    LineSelection output = select(&fixture, 7U);
    REQUIRE(output.lines.size() == 1U);
    REQUIRE(output.lines[0].inline_advance == 7U);
    REQUIRE(!selected_line_has_flag(
        output,
        0U,
        kSelectedLineOverflow));
}

'''
          if anchor not in test_text:
              raise SystemExit('test insertion anchor not found')
          test_text = test_text.replace(anchor, test + anchor, 1)
          main_anchor = '''    test_certified_cluster_and_caret_maps_feed_selection();
    test_rtl_advance_uses_magnitude();
'''
          main_new = '''    test_certified_cluster_and_caret_maps_feed_selection();
    test_mixed_sign_glyph_group_uses_net_advance();
    test_rtl_advance_uses_magnitude();
'''
          if main_anchor not in test_text:
              raise SystemExit('main test anchor not found')
          test_text = test_text.replace(main_anchor, main_new, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/line_selection.cpp tests/line_selection_tests.cpp
          git commit -m "Z2D-2: accumulate net signed glyph-group advances"
          git push origin HEAD:work/z2d-bounded-width-line-selection

  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build line selection and dependencies
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-line-selection-tests \
            zevryon-line-selection-benchmark \
            zevryon-caret-boundary-map-tests \
            zevryon-glyph-cluster-map-tests \
            2>&1 | tee line-selection-build.log
      - name: Repeat focused certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^line-selection-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee line-selection-repeat.log
      - name: Run three independent distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-line-selection-benchmark \
              > "line-selection-benchmark-${run}.json"
          done
      - name: Enforce exact output, memory and latency gates
        run: |
          python3 - <<'PY'
          import json

          rows = []
          for run in range(1, 4):
              with open(f'line-selection-benchmark-{run}.json', encoding='utf-8') as handle:
                  row = json.load(handle)
              assert row['schema'] == 'zevryon.line-selection-benchmark.v1'
              assert row['input_clusters'] == 65_536
              assert row['input_segments'] == 2_048
              assert row['input_glyphs'] == 32_768
              assert row['input_boundaries'] == 65_537
              assert row['available_inline_advance'] == 2_048
              assert row['legal_boundaries'] == 8_192
              assert row['zero_advance_clusters'] == 32_768
              assert row['output_lines'] == 1_024
              assert row['soft_break_lines'] == 960
              assert row['mandatory_break_lines'] == 64
              assert row['overflow_lines'] == 0
              assert row['record_bytes'] == 16
              assert row['current_bytes'] == 16_384
              assert row['peak_bytes'] == 540_672
              assert row['hard_limit_bytes'] == 540_672
              assert row['total_inline_advance'] == 2_097_152
              assert row['maximum_line_advance'] == 2_048
              assert row['maximum_line_clusters'] == 64
              assert row['checksum'] == 14_685_043_611_820_972_315
              assert row['accounting_clean'] is True
              assert row['within_hard_limits'] is True
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 6.0, row
              assert row['p99_ms'] <= 9.0, row
              assert row['maximum_ms'] <= 15.0, row
              rows.append(row)
          assert len({row['checksum'] for row in rows}) == 1
          print({
              'p50_ms': [row['p50_ms'] for row in rows],
              'p95_ms': [row['p95_ms'] for row in rows],
              'p99_ms': [row['p99_ms'] for row in rows],
              'maximum_ms': [row['maximum_ms'] for row in rows],
              'checksum': rows[0]['checksum'],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-line-selection-${{ github.sha }}
          path: |
            line-selection-build.log
            line-selection-repeat.log
            line-selection-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests under sanitizers
        run: cmake --build build-sanitized --parallel 2 --target zevryon-line-selection-tests
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^line-selection-tests$' --output-on-failure

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build and run focused tests
        run: |
          cmake --build build --parallel 2 --target zevryon-line-selection-tests
          ctest --test-dir build -R '^line-selection-tests$' --output-on-failure
