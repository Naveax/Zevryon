name: bootstrap-z2f8b3b1

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'work/z2f8b3b-shader-native-rendering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f8b3b-shader-native-rendering
          fetch-depth: 0
      - name: Verify and extract packet payload
        run: |
          set -euo pipefail
          cat .z2f8b3b1/part* | base64 -d > /tmp/z2f8b3b1.tar.gz
          echo '35b62ca0943158406e9a52f8caf3302de39f93a138b80d18d99913d8f6da36dd  /tmp/z2f8b3b1.tar.gz' | sha256sum -c -
          tar -tzf /tmp/z2f8b3b1.tar.gz | sed '/\/$/d' | sort > /tmp/actual-members.txt
          cat > /tmp/expected-members.txt <<'MEMBERS'
          cmake/shader_draw_packet.cmake
          docs/Z2F8B3B1_SHADER_DRAW_PACKET.md
          src/shader_draw_packet.cpp
          src/shader_draw_packet.hpp
          src/shader_draw_packet_benchmark_main.cpp
          tests/shader_draw_packet_equivalence_tests.cpp
          tests/shader_draw_packet_fixture.hpp
          tests/shader_draw_packet_tests.cpp
          MEMBERS
          sort -o /tmp/expected-members.txt /tmp/expected-members.txt
          diff -u /tmp/expected-members.txt /tmp/actual-members.txt
          tar -xzf /tmp/z2f8b3b1.tar.gz
      - name: Bind packet compiler into the root graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')
          marker = 'cmake/shader_draw_packet.cmake'
          if marker not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '\n# Z2F-8B3B1 compiles bounded shader draw packets and persistent atlas updates.\n'
              text += 'include("${CMAKE_CURRENT_SOURCE_DIR}/cmake/shader_draw_packet.cmake")\n'
              path.write_text(text, encoding='utf-8')
          PY
      - name: Publish production sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt cmake/shader_draw_packet.cmake docs/Z2F8B3B1_SHADER_DRAW_PACKET.md src/shader_draw_packet.cpp src/shader_draw_packet.hpp src/shader_draw_packet_benchmark_main.cpp tests/shader_draw_packet_equivalence_tests.cpp tests/shader_draw_packet_fixture.hpp tests/shader_draw_packet_tests.cpp
          git rm -r .z2f8b3b1
          git commit -m 'Implement bounded shader draw packet compiler'
          git push origin HEAD:work/z2f8b3b-shader-native-rendering
