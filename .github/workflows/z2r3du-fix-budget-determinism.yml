name: Z2R-3D-U fix budget determinism
# Retry bootstrap on the existing pull request.
on:
  pull_request:
    paths:
      - ".github/workflows/z2r3du-fix-budget-determinism.yml"
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/z2r3d-unicode-promotion-readiness
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/z2r3d_unicode_workload.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''    std::array<std::byte, 128> storage{};
    std::pmr::monotonic_buffer_resource arena(
        storage.data(),
        storage.size(),
        std::pmr::null_memory_resource());
    std::pmr::vector<DecodedCodePoint> output(&arena);'''
          new = '''    std::pmr::vector<DecodedCodePoint> output(
        std::pmr::null_memory_resource());'''
          if text.count(old) != 1:
              raise RuntimeError('budget resource patch did not match exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/z2r3d_unicode_workload.cpp
          git commit -m "Make Z2R-3D-U budget failure deterministic"
          git push origin HEAD:agent/z2r3d-unicode-promotion-readiness
