name: z2-native-shader-execution

on:
  pull_request:
    paths:
      - '.github/workflows/z2-native-shader-execution.yml'
      - 'cmake/native_shader_execution.cmake'
      - 'src/native_shader_execution*'
      - 'shaders/native_shader_execution.comp'
      - 'tests/native_shader_execution*'
      - 'docs/Z2F8B3B2_NATIVE_SHADER_EXECUTION.md'
      - 'CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: z2-native-shader-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libharfbuzz-dev
      - name: Configure strict release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-native-shader-execution-tests \
            zevryon-native-shader-execution-equivalence-tests \
            zevryon-native-shader-execution-benchmark \
            2>&1 | tee native-shader-build.log
      - name: Repeat functional certification
        run: |
          set -o pipefail
          for run in $(seq 1 20); do
            ./build/zevryon-native-shader-execution-tests
          done 2>&1 | tee native-shader-repeat.log
      - name: Run independent backend and packet oracle
        run: |
          set -o pipefail
          ./build/zevryon-native-shader-execution-equivalence-tests \
            2>&1 | tee native-shader-equivalence.log
      - name: Run three dispatch-plan benchmark distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-native-shader-execution-benchmark 512 \
              > "native-shader-benchmark-${run}.txt"
          done
      - name: Enforce exact topology and reference gates
        run: |
          python3 - <<'PY'
          def load(path):
              row = {}
              with open(path, encoding='utf-8') as handle:
                  for line in handle:
                      key, value = line.strip().split('=', 1)
                      row[key] = value
              return row

          rows = [load(f'native-shader-benchmark-{run}.txt') for run in range(1, 4)]
          for row in rows:
              assert row['schema'] == 'zevryon.native-shader-execution.v1'
              assert int(row['iterations']) == 512
              assert int(row['samples']) == 512
              assert int(row['commands']) == 68
              assert int(row['fills']) == 65
              assert int(row['glyphs']) == 240
              assert int(row['scissors']) == 1
              assert int(row['atlas_pages']) == 3
              assert int(row['atlas_bytes']) == 49_152
              assert int(row['output_bytes']) == 921_600
              assert int(row['readback_checksum']) == 17_057_955_876_043_375_715
              p50 = float(row['p50_ms'])
              p95 = float(row['p95_ms'])
              p99 = float(row['p99_ms'])
              maximum = float(row['max_ms'])
              assert 0.0 < p50 <= p95 <= p99 <= maximum
              assert p95 <= 3.0, row
              assert p99 <= 6.0, row
              assert maximum <= 20.0, row
          stable = ('readback_checksum', 'plan_checksum')
          for key in stable:
              assert len({row[key] for row in rows}) == 1, key
          print({
              'p50_ms': [float(row['p50_ms']) for row in rows],
              'p95_ms': [float(row['p95_ms']) for row in rows],
              'p99_ms': [float(row['p99_ms']) for row in rows],
              'maximum_ms': [float(row['max_ms']) for row in rows],
              'readback_checksum': int(rows[0]['readback_checksum']),
              'plan_checksum': int(rows[0]['plan_checksum']),
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-native-shader-reference-${{ github.sha }}
          path: |
            native-shader-build.log
            native-shader-repeat.log
            native-shader-equivalence.log
            native-shader-benchmark-*.txt
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DZEVRYON_ENABLE_SANITIZERS=ON
      - name: Build focused targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-native-shader-execution-tests
          zevryon-native-shader-execution-equivalence-tests
      - name: Run under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./build/zevryon-native-shader-execution-tests
          ./build/zevryon-native-shader-execution-equivalence-tests

  d3d12-runtime:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure D3D12 build
        shell: pwsh
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=OFF
      - name: Build real D3D12 compute targets
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target zevryon-native-shader-execution-d3d12-tests
          cmake --build build --config Release --parallel 2 --target zevryon-native-shader-execution-d3d12-benchmark
      - name: Repeat exact D3D12 GPU readback
        shell: pwsh
        run: |
          1..10 | ForEach-Object { ./build/Release/zevryon-native-shader-execution-d3d12-tests.exe }
      - name: Run three D3D12 benchmark distributions
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            ./build/Release/zevryon-native-shader-execution-d3d12-benchmark.exe 128 | Out-File -Encoding utf8 "d3d12-native-shader-benchmark-$_.txt"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-native-shader-d3d12-${{ github.sha }}
          path: d3d12-native-shader-benchmark-*.txt
          if-no-files-found: warn

  vulkan-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan, XCB and shaping dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libharfbuzz-dev \
            libvulkan-dev mesa-vulkan-drivers \
            libxcb1-dev libwayland-dev libwayland-bin wayland-protocols xvfb
      - name: Select lavapipe ICD
        run: |
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Configure Vulkan build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build real Vulkan compute targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-native-shader-execution-vulkan-tests
          zevryon-native-shader-execution-vulkan-benchmark
      - name: Start Xvfb and repeat exact Vulkan GPU readback
        env:
          DISPLAY: :99
          ZEVRYON_VULKAN_WSI_SYSTEM: xcb
        run: |
          Xvfb :99 -screen 0 1280x720x24 >xvfb.log 2>&1 &
          sleep 2
          for run in $(seq 1 10); do
            ./build/zevryon-native-shader-execution-vulkan-tests
          done
          for run in 1 2 3; do
            ./build/zevryon-native-shader-execution-vulkan-benchmark 128 \
              > "vulkan-native-shader-benchmark-${run}.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-native-shader-vulkan-${{ github.sha }}
          path: |
            vulkan-native-shader-benchmark-*.txt
            xvfb.log
          if-no-files-found: warn

  metal-runtime:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure Metal build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=OFF
      - name: Build real Metal compute targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-native-shader-execution-metal-tests
          zevryon-native-shader-execution-metal-benchmark
      - name: Repeat exact Metal GPU readback
        run: |
          for run in $(seq 1 10); do
            ./build/zevryon-native-shader-execution-metal-tests
          done
          for run in 1 2 3; do
            ./build/zevryon-native-shader-execution-metal-benchmark 128 \
              > "metal-native-shader-benchmark-${run}.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-native-shader-metal-${{ github.sha }}
          path: metal-native-shader-benchmark-*.txt
          if-no-files-found: warn
