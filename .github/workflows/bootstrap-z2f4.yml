name: bootstrap-z2f4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-gpu-residency-compositor
      - name: Inspect payload
        shell: bash
        run: |
          set +e
          cat .z2f4/part00 .z2f4/part01 .z2f4/part02 .z2f4/part03 | tr -d '\r\n' > /tmp/z2f4-payload.b64
          wc -c /tmp/z2f4-payload.b64 > z2f4-diagnostic.txt
          sha256sum /tmp/z2f4-payload.b64 >> z2f4-diagnostic.txt
          base64 -d /tmp/z2f4-payload.b64 > /tmp/z2f4-payload.tar.gz
          echo "decode_status=$?" >> z2f4-diagnostic.txt
          wc -c /tmp/z2f4-payload.tar.gz >> z2f4-diagnostic.txt
          sha256sum /tmp/z2f4-payload.tar.gz >> z2f4-diagnostic.txt
          gzip -t /tmp/z2f4-payload.tar.gz
          echo "gzip_status=$?" >> z2f4-diagnostic.txt
          tar -tzf /tmp/z2f4-payload.tar.gz > z2f4-members.txt 2>> z2f4-diagnostic.txt
          echo "tar_status=$?" >> z2f4-diagnostic.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2f4-bootstrap-diagnostic-${{ github.sha }}
          path: |
            z2f4-diagnostic.txt
            z2f4-members.txt
          if-no-files-found: warn
