name: bootstrap-z2f4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-gpu-residency-compositor
      - name: Export combined payload
        shell: bash
        run: |
          set +e
          wc -c .z2f4/part00 .z2f4/part01 .z2f4/part02 .z2f4/part03 .z2f4/part04 > z2f4-diagnostic.txt
          cat .z2f4/part00 .z2f4/part01 .z2f4/part02 .z2f4/part03 .z2f4/part04 | tr -d '\r\n' > z2f4-payload.b64
          wc -c z2f4-payload.b64 >> z2f4-diagnostic.txt
          sha256sum z2f4-payload.b64 >> z2f4-diagnostic.txt
          base64 -d z2f4-payload.b64 > z2f4-payload.tar.gz
          echo "decode_status=$?" >> z2f4-diagnostic.txt
          wc -c z2f4-payload.tar.gz >> z2f4-diagnostic.txt
          sha256sum z2f4-payload.tar.gz >> z2f4-diagnostic.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2f4-payload-bytes-${{ github.sha }}
          path: |
            z2f4-diagnostic.txt
            z2f4-payload.b64
          if-no-files-found: error
