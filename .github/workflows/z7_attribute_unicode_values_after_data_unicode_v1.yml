name: Z7 attribute Unicode values after Data Unicode diagnostic v1

on:
  push:
    branches:
      - diagnostic/z7-attribute-unicode-values-after-data-unicode-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply Unicode attribute-value candidate
        run: |
          set -euo pipefail
          python3 scripts/apply_z7_attribute_unicode_values_after_data_unicode_v1.py
          git diff --check
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused tokenizer targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-html-tokenizer-data-tags-v1-tests
          zevryon-html-tokenizer-token-stream-v1-tests
          zevryon-html-tokenizer-token-stream-v1-probe
      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build/zevryon-html-tokenizer-data-tags-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests
      - name: Verify corpus harnesses
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --self-test
      - name: Measure exact corpus movement
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py \
            --policy no-regression \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > census.json
          python3 - <<'PY'
          import json
          r=json.load(open('census.json'))
          assert r['files']==14,r
          assert r['tests']==6810,r
          assert r['executions']==7036,r
          assert r['baseline_regression_free'] is True,r
          print('ATTRIBUTE_UNICODE_TOTALS',r['passed'],r['failed'],r['unsupported'])
          for key,value in sorted(r['reason_counts'].items()):
              if 'attribute' in key or 'non-ASCII' in key or 'unicode' in key:
                  print('ATTRIBUTE_UNICODE_REASON',key,value)
          PY
      - name: Block diagnostic publication
        run: |
          echo 'Diagnostic evidence collected; branch must not be merged.' >&2
          exit 1
