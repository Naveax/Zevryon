name: z2d1-compile-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/z2d1-compile-diagnostic.yml'
      - 'cmake/unicode_line_break.cmake'
      - 'cmake/harfbuzz_shaping.cmake'
      - 'src/line_break_*'
      - 'src/unicode_line_break_*'
      - 'src/resource_ledger.*'
      - 'tests/line_break_*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gcc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2d-unicode-line-break-opportunities
          fetch-depth: 0
      - name: Make focused tests Release-safe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/line_break_opportunity_tests.cpp')
          text = path.read_text(encoding='utf-8')
          text = text.replace('#include <cassert>\n', '#include <cstdlib>\n', 1)
          anchor = 'namespace {\n\n'
          requirement = '''namespace {\n\n#define REQUIRE(condition) do { \\
    if (!(condition)) { \\
        std::cerr << "requirement failed: " #condition \\
                  << " at " << __FILE__ << ':' << __LINE__ << '\\n'; \\
        std::abort(); \\
    } \\
} while (false)\n\n'''
          if '#define REQUIRE(condition)' not in text:
              if anchor not in text:
                  raise SystemExit('test namespace anchor not found')
              text = text.replace(anchor, requirement, 1)
          text = text.replace('assert(', 'REQUIRE(')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit test hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/line_break_opportunity_tests.cpp
          git commit -m "Z2D-1: make focused tests Release-safe"
          git push origin HEAD:work/z2d-unicode-line-break-opportunities
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build focused target with complete log
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target zevryon-line-break-opportunity-tests \
            2>&1 | tee z2d1-compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2d1-compile-diagnostic-${{ github.sha }}
          path: z2d1-compile.log
          if-no-files-found: warn
