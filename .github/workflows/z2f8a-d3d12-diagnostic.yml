name: z2f8a-d3d12-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/z2f8a-d3d12-diagnostic.yml'
      - 'src/native_gpu_sdk_execution_d3d12.cpp'
      - 'src/native_gpu_sdk_execution.hpp'
      - 'src/native_gpu_sdk_execution.cpp'
      - 'cmake/native_gpu_sdk_execution.cmake'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure Direct3D 12 diagnostic build
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build SDK targets with complete log
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target `
            zevryon-native-gpu-sdk-platform-smoke-tests `
            zevryon-native-gpu-sdk-execution-tests 2>&1 | Tee-Object -FilePath d3d12-sdk-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2f8a-d3d12-diagnostic-${{ github.sha }}
          path: d3d12-sdk-build.log
          if-no-files-found: error
