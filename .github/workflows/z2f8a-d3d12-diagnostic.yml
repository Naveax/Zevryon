name: z2f8a-native-diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/z2f8a-d3d12-diagnostic.yml'
      - 'cmake/native_gpu_sdk_execution.cmake'
      - 'src/native_platform_submission_standalone.cpp'
      - 'src/native_gpu_sdk_execution*'
      - 'tests/native_gpu_sdk_execution*'

permissions:
  contents: read

jobs:
  d3d12-standalone:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone Direct3D 12 SDK graph
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build D3D12 smoke target with complete log
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target zevryon-native-gpu-sdk-platform-smoke-tests 2>&1 | Tee-Object -FilePath d3d12-standalone-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2 --target zevryon-native-gpu-sdk-execution-tests 2>&1 | Tee-Object -FilePath d3d12-standalone-build.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real Direct3D 12 SDK smoke through hardware or WARP
        shell: pwsh
        run: |
          $exe = '.\build\Release\zevryon-native-gpu-sdk-platform-smoke-tests.exe'
          if (-not (Test-Path $exe)) { throw "D3D12 smoke executable was not generated" }
          & $exe | Tee-Object -FilePath d3d12-standalone-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2f8a-d3d12-standalone-${{ github.sha }}
          path: |
            d3d12-standalone-build.log
            d3d12-standalone-smoke.log
          if-no-files-found: warn

  macos-default:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure default macOS graph
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build and test default macOS graph
        run: |
          set -o pipefail
          cmake --build build --parallel 2 2>&1 | tee macos-default-build.log
          ctest --test-dir build --output-on-failure | tee macos-default-ctest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2f8a-macos-default-${{ github.sha }}
          path: |
            macos-default-build.log
            macos-default-ctest.log
          if-no-files-found: warn
