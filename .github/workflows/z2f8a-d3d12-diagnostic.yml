name: z2f8a-d3d12-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/z2f8a-d3d12-diagnostic.yml'
      - 'src/native_gpu_sdk_execution_d3d12.cpp'
      - 'src/native_gpu_sdk_execution.hpp'
      - 'src/native_gpu_sdk_execution.cpp'
      - 'cmake/native_gpu_sdk_execution.cmake'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz through vcpkg
        shell: pwsh
        run: vcpkg install harfbuzz:x64-windows
      - name: Configure Direct3D 12 diagnostic build
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts\buildsystems\vcpkg.cmake'
          cmake -S . -B build -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build full Windows graph with complete log
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath d3d12-sdk-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require and run D3D12 smoke executable
        shell: pwsh
        run: |
          $exe = '.\build\Release\zevryon-native-gpu-sdk-platform-smoke-tests.exe'
          if (-not (Test-Path $exe)) { throw "D3D12 smoke executable was not generated" }
          & $exe | Tee-Object -FilePath d3d12-sdk-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2f8a-d3d12-diagnostic-${{ github.sha }}
          path: |
            d3d12-sdk-build.log
            d3d12-sdk-smoke.log
          if-no-files-found: warn
