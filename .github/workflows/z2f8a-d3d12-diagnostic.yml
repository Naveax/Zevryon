name: z2f8a-d3d12-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/z2f8a-d3d12-diagnostic.yml'
      - 'src/native_gpu_sdk_execution_d3d12.cpp'
      - 'src/native_gpu_sdk_execution_vulkan.cpp'
      - 'src/native_gpu_sdk_execution.hpp'
      - 'src/native_gpu_sdk_execution.cpp'
      - 'src/native_gpu_sdk_execution_benchmark_main.cpp'
      - 'tests/native_gpu_sdk_execution_equivalence_tests.cpp'
      - 'tests/native_gpu_sdk_platform_smoke_tests.cpp'
      - 'cmake/native_gpu_sdk_execution.cmake'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-concrete-native-gpu-execution
      - name: Apply exact SDK safety patches
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          replacements = {
              'tests/native_gpu_sdk_platform_smoke_tests.cpp': (
                  '        command.kind = index;\n',
                  '        command.kind = static_cast<NativePlatformCommandKind>(index);\n'),
              'tests/native_gpu_sdk_execution_equivalence_tests.cpp': (
                  '        command.kind = index % 11U;\n',
                  '        command.kind = static_cast<NativePlatformCommandKind>(index % 11U);\n'),
              'src/native_gpu_sdk_execution_benchmark_main.cpp': (
                  '        command.kind = index % 11U;\n',
                  '        command.kind = static_cast<NativePlatformCommandKind>(index % 11U);\n'),
              'src/native_gpu_sdk_execution_vulkan.cpp': (
                  '#if defined(VK_VERSION_1_1)\n        if (vkEnumerateInstanceVersion != nullptr) {\n            (void)vkEnumerateInstanceVersion(&version);\n        }\n#endif\n',
                  '#if defined(VK_VERSION_1_1)\n        if (vkEnumerateInstanceVersion(&version) != VK_SUCCESS) {\n            version = VK_API_VERSION_1_0;\n        }\n#endif\n'),
          }
          changed = []
          for relative, (old, new) in replacements.items():
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'exact patch precondition failed: {relative}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(relative)
          print({'changed': changed})
          '@ | python -
          if (git diff --quiet) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/native_gpu_sdk_platform_smoke_tests.cpp tests/native_gpu_sdk_execution_equivalence_tests.cpp src/native_gpu_sdk_execution_benchmark_main.cpp src/native_gpu_sdk_execution_vulkan.cpp
          git commit -m "Harden native GPU SDK platform construction"
          git push origin HEAD:work/z2f-concrete-native-gpu-execution
      - name: Install HarfBuzz through vcpkg
        shell: pwsh
        run: vcpkg install harfbuzz:x64-windows
      - name: Configure Direct3D 12 diagnostic build
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts\buildsystems\vcpkg.cmake'
          cmake -S . -B build -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build full Windows graph with complete log
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath d3d12-sdk-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require and run D3D12 smoke executable
        shell: pwsh
        run: |
          $exe = '.\build\Release\zevryon-native-gpu-sdk-platform-smoke-tests.exe'
          if (-not (Test-Path $exe)) { throw "D3D12 smoke executable was not generated" }
          & $exe | Tee-Object -FilePath d3d12-sdk-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2f8a-d3d12-diagnostic-${{ github.sha }}
          path: |
            d3d12-sdk-build.log
            d3d12-sdk-smoke.log
          if-no-files-found: warn
