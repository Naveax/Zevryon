name: z2-device-raster-backend

on:
  pull_request:
    paths:
      - '.github/workflows/z2-device-raster-backend.yml'
      - 'cmake/device_raster_backend.cmake'
      - 'cmake/glyph_atlas_submission.cmake'
      - 'src/device_raster_backend.*'
      - 'src/glyph_atlas_submission.*'
      - 'tests/device_raster_backend_tests.cpp'
      - 'tests/device_raster_backend_equivalence_tests.cpp'
      - 'docs/Z2F3_BOUNDED_DEVICE_RASTER_EXECUTION.md'
  workflow_dispatch:

concurrency:
  group: z2-device-raster-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-device-raster-backend-tests \
            zevryon-device-raster-backend-equivalence-tests \
            zevryon-device-raster-backend-benchmark \
            zevryon-glyph-atlas-submission-tests \
            zevryon-text-paint-command-stream-tests \
            2>&1 | tee device-raster-build.log
      - name: Repeat focused certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^device-raster-backend-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee device-raster-repeat.log
      - name: Exhaustively certify reference raster output
        run: |
          set -o pipefail
          ctest --test-dir build -R '^device-raster-backend-equivalence-tests$' \
            --output-on-failure 2>&1 | tee device-raster-equivalence.log
      - name: Run three independent distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-device-raster-backend-benchmark \
              > "device-raster-benchmark-${run}.json"
          done
      - name: Enforce bounded output and latency gates
        run: |
          python3 - <<'PY'
          import json
          rows = []
          for run in range(1, 4):
              with open(f'device-raster-benchmark-{run}.json', encoding='utf-8') as handle:
                  row = json.load(handle)
              assert row['schema'] == 'zevryon.device-raster-backend-benchmark.v1'
              assert row['input_document_lines'] == 16_384
              assert row['input_projected_lines'] == 80
              assert row['input_unique_keys'] == 96
              assert row['input_glyph_uses'] == 320
              assert row['cold_jobs'] == 96
              assert row['source_records'] == 96
              assert row['source_payload_bytes'] == 12_720
              assert row['cold_uploads'] == 93
              assert row['cold_draw_instances'] == 310
              assert row['cold_draw_batches'] == 3
              assert row['backend_upload_batches'] == 3
              assert row['hot_jobs'] == 0
              assert row['hot_uploads'] == 0
              assert row['hot_draw_instances'] == 310
              assert row['output_current_bytes'] == 102_592
              assert row['output_peak_bytes'] == 102_592
              assert row['cache_current_bytes'] == 9_360
              assert row['cache_peak_bytes'] == 18_723
              assert row['cache_pages'] == 3
              assert row['cache_entries'] == 96
              assert row['checksum'] == 3_419_726_875_785_770_731
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 5.0, row
              assert row['p99_ms'] <= 8.0, row
              assert row['maximum_ms'] <= 20.0, row
              rows.append(row)
          assert len({row['checksum'] for row in rows}) == 1
          assert len({row['source_payload_bytes'] for row in rows}) == 1
          assert len({row['output_current_bytes'] for row in rows}) == 1
          assert len({row['output_peak_bytes'] for row in rows}) == 1
          print({
              'p50_ms': [row['p50_ms'] for row in rows],
              'p95_ms': [row['p95_ms'] for row in rows],
              'p99_ms': [row['p99_ms'] for row in rows],
              'maximum_ms': [row['maximum_ms'] for row in rows],
              'checksum': rows[0]['checksum'],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-device-raster-backend-${{ github.sha }}
          path: |
            device-raster-build.log
            device-raster-repeat.log
            device-raster-equivalence.log
            device-raster-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests under sanitizers
        run: >-
          cmake --build build-sanitized --parallel 2 --target
          zevryon-device-raster-backend-tests
          zevryon-device-raster-backend-equivalence-tests
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^device-raster-backend-(tests|equivalence-tests)$' --output-on-failure

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build benchmark and focused tests
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-device-raster-backend-tests \
            zevryon-device-raster-backend-equivalence-tests \
            zevryon-device-raster-backend-benchmark \
            2>&1 | tee apple-device-raster-build.log
          ctest --test-dir build -R '^device-raster-backend-(tests|equivalence-tests)$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-device-raster-backend-appleclang-${{ github.sha }}
          path: apple-device-raster-build.log
          if-no-files-found: warn
