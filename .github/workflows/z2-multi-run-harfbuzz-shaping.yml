# Final Z2C-2 certificate: this workflow is read-only and contains no repair job.
name: z2-multi-run-harfbuzz-shaping

on:
  pull_request:
    paths:
      - '.github/workflows/z2-multi-run-harfbuzz-shaping.yml'
      - 'cmake/harfbuzz_shaping.cmake'
      - 'src/multi_run_harfbuzz_shaper.*'
      - 'src/multi_run_harfbuzz_shaping_benchmark_main.cpp'
      - 'src/shaping_run_plan.*'
      - 'src/cached_catalog_harfbuzz_shaper.*'
      - 'src/resource_ledger.*'
      - 'tests/multi_run_harfbuzz_shaper_tests.cpp'
      - 'docs/Z2C2_BOUNDED_MULTI_RUN_SHAPING.md'
  workflow_dispatch:

concurrency:
  group: z2-multi-run-harfbuzz-shaping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz and real-font fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libharfbuzz-dev fonts-dejavu-core
      - name: Configure strict Release build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON \
            -DZEVRYON_TEST_FONT_LATIN=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Build multi-run shaping chain and benchmark
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-multi-run-harfbuzz-shaper-tests \
            zevryon-cached-catalog-harfbuzz-shaper-tests \
            zevryon-shaping-run-plan-tests \
            zevryon-multi-run-harfbuzz-shaping-benchmark \
            2>&1 | tee multi-run-shaping-build.log
      - name: Repeat multi-run concurrency and rollback certification
        run: |
          set -o pipefail
          ctest --test-dir build \
            -R '^multi-run-harfbuzz-shaper-tests$' \
            --repeat until-fail:10 --output-on-failure \
            2>&1 | tee multi-run-shaping-repeat.log
      - name: Run planner and cache-backed dependencies
        run: |
          set -o pipefail
          ctest --test-dir build \
            -R '^(shaping-run-plan-tests|cached-catalog-harfbuzz-shaper-tests)$' \
            --output-on-failure \
            2>&1 | tee multi-run-shaping-dependencies.log
      - name: Run alternating 64 KiB executor distributions
        run: |
          for run in 1 2 3 4 5; do
            ./build/zevryon-multi-run-harfbuzz-shaping-benchmark \
              /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
              > "multi-run-shaping-benchmark-${run}.jsonl"
          done
      - name: Enforce equivalence, memory, latency, and overhead gates
        run: |
          python3 - <<'PY'
          import json
          import statistics

          ratios = []
          executor_p50 = []
          executor_p95 = []
          executor_p99 = []
          executor_max = []
          equal = (
              "input_utf8_bytes", "input_codepoints", "input_clusters",
              "input_runs", "output_segments", "output_glyphs",
              "glyph_bytes", "metadata_bytes", "total_x_advance", "checksum",
          )
          for run in range(1, 6):
              rows = [json.loads(line) for line in open(
                  f"multi-run-shaping-benchmark-{run}.jsonl",
                  encoding="utf-8") if line.strip()]
              assert len(rows) == 2, (run, len(rows))
              data = {row["mode"]: row for row in rows}
              assert set(data) == {
                  "manual_cached_segment_loop",
                  "production_multi_run_executor",
              }
              manual = data["manual_cached_segment_loop"]
              executor = data["production_multi_run_executor"]
              assert manual["schema"] == executor["schema"] == \
                  "zevryon.multi-run-shaping-benchmark.v1"
              for key in equal:
                  assert manual[key] == executor[key], (
                      run, key, manual[key], executor[key])
              for row in (manual, executor):
                  assert row["input_utf8_bytes"] == 65_536
                  assert row["input_codepoints"] == 49_152
                  assert row["input_clusters"] == 49_152
                  assert row["input_runs"] == 1_024
                  assert row["output_segments"] == 1_024
                  assert row["output_glyphs"] > 0
                  assert row["glyph_bytes"] == row["output_glyphs"] * 28
                  assert 0 < row["metadata_bytes"] <= 512 * 1024
                  assert row["glyph_bytes"] <= 4 * 1024 * 1024
                  assert row["accounting_clean"] is True
                  assert row["within_hard_limits"] is True
                  assert 0.0 < row["p50_ms"] <= row["p95_ms"] <= \
                      row["p99_ms"] <= row["maximum_ms"]
              ratio = executor["p50_ms"] / manual["p50_ms"]
              assert ratio <= 1.10, (run, ratio)
              ratios.append(ratio)
              executor_p50.append(executor["p50_ms"])
              executor_p95.append(executor["p95_ms"])
              executor_p99.append(executor["p99_ms"])
              executor_max.append(executor["maximum_ms"])
          aggregate = {
              "executor_manual_p50_ratios": ratios,
              "median_ratio": statistics.median(ratios),
              "median_p50_ms": statistics.median(executor_p50),
              "median_p95_ms": statistics.median(executor_p95),
              "median_p99_ms": statistics.median(executor_p99),
              "worst_maximum_ms": max(executor_max),
          }
          assert aggregate["median_ratio"] <= 1.03, aggregate
          assert aggregate["median_p50_ms"] <= 50.0, aggregate
          assert aggregate["median_p95_ms"] <= 50.0, aggregate
          assert aggregate["median_p99_ms"] <= 55.0, aggregate
          assert aggregate["worst_maximum_ms"] <= 65.0, aggregate
          print(aggregate)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-multi-run-shaping-${{ github.sha }}
          path: |
            multi-run-shaping-build.log
            multi-run-shaping-repeat.log
            multi-run-shaping-dependencies.log
            multi-run-shaping-benchmark-*.jsonl
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz and real-font fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libharfbuzz-dev fonts-dejavu-core
      - name: Configure ASan and UBSan build
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            -DZEVRYON_ENABLE_SANITIZERS=ON \
            -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON \
            -DZEVRYON_TEST_FONT_LATIN=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Build multi-run shaping chain under sanitizers
        run: |
          set -o pipefail
          cmake --build build-sanitized --parallel 2 --target \
            zevryon-multi-run-harfbuzz-shaper-tests \
            zevryon-cached-catalog-harfbuzz-shaper-tests \
            zevryon-shaping-run-plan-tests \
            2>&1 | tee multi-run-shaping-sanitizer-build.log
      - name: Run multi-run shaping chain under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -o pipefail
          ctest --test-dir build-sanitized \
            -R '^(multi-run-harfbuzz-shaper-tests|cached-catalog-harfbuzz-shaper-tests|shaping-run-plan-tests)$' \
            --output-on-failure \
            2>&1 | tee multi-run-shaping-sanitizer-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-multi-run-shaping-sanitized-${{ github.sha }}
          path: |
            multi-run-shaping-sanitizer-build.log
            multi-run-shaping-sanitizer-test.log
          if-no-files-found: warn
