name: Z7 input-stream ordering after comment diagnostic v1

on:
  push:
    branches:
      - candidate/z7-tokenizer-input-stream-order-after-comment-diagnostic-v1

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply Data invalid-Unicode authority and ordering candidate
        run: |
          set -euo pipefail
          git fetch --no-tags origin 3331a02157701b02b8979ea88412b2c3d322fa9c
          git show 3331a02157701b02b8979ea88412b2c3d322fa9c:scripts/apply_z7_tokenizer_data_invalid_unicode_production_v1.py > scripts/.data_unicode_helper.py
          python3 scripts/.data_unicode_helper.py
          rm scripts/.data_unicode_helper.py
          python3 scripts/apply_z7_input_stream_order_after_comment_diagnostic_v1.py
          git diff --check
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused tokenizer targets
        run: cmake --build build --parallel 2 --target zevryon-html-tokenizer-data-tags-v1-tests zevryon-html-tokenizer-data-utf8-text-v1-tests zevryon-html-tokenizer-markup-declarations-v1-tests zevryon-html-tokenizer-token-stream-v1-tests zevryon-html-tokenizer-token-stream-v1-probe
      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build/zevryon-html-tokenizer-data-tags-v1-tests
          ./build/zevryon-html-tokenizer-data-utf8-text-v1-tests
          ./build/zevryon-html-tokenizer-markup-declarations-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests
      - name: Measure exact corpus movement
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --probe build/zevryon-html-tokenizer-token-stream-v1-probe > census.json
          python3 - <<'PY'
          import json
          r=json.load(open('census.json'))
          assert r['executions']==7036,r
          assert r['failed']<=27,r
          assert r['unsupported']<=53,r
          print('DIAGNOSTIC_TOTALS',r['passed'],r['failed'],r['unsupported'])
          print('DIAGNOSTIC_PARSE_MISMATCH',r['reason_counts'].get('failed:parse-error-stream-mismatch',0))
          print('DIAGNOSTIC_TOKEN_MISMATCH',r['reason_counts'].get('failed:token-stream-mismatch',0))
          print('DIAGNOSTIC_NUL',r['reason_counts'].get('unsupported:input-preprocessing-nul',0))
          for item in r['failure_samples']:
              if item['reason']=='parse-error-stream-mismatch':
                  print('REMAINING_PARSE',item['label'])
          PY
      - name: Block diagnostic publication
        run: |
          echo 'Diagnostic evidence collected; branch must not be merged.' >&2
          exit 1
