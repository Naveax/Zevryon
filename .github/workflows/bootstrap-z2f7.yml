name: bootstrap-z2f7

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'work/z2f-native-platform-adapters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-native-platform-adapters
      - name: Materialize verified Z2F-7 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .z2f7/part* | base64 -d > /tmp/z2f7-payload.tar.gz
          echo "135a14de8e8c9794b2b33cb847a9e556c6788abc71b98ce1076fbed2edb80c7e  /tmp/z2f7-payload.tar.gz" | sha256sum -c -
          tar -tzf /tmp/z2f7-payload.tar.gz > /tmp/z2f7-members.txt
          test "$(wc -l < /tmp/z2f7-members.txt)" -eq 9
          tar -xzf /tmp/z2f7-payload.tar.gz
      - name: Publish source files through Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: work/z2f-native-platform-adapters
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          paths = [
              'cmake/native_platform_adapters.cmake',
              'cmake/native_damage_presentation.cmake',
              'docs/Z2F7_NATIVE_PLATFORM_ADAPTERS.md',
              'src/native_platform_adapters.hpp',
              'src/native_platform_adapters.cpp',
              'src/native_platform_adapters_benchmark_main.cpp',
              'tests/native_platform_adapters_tests.cpp',
              'tests/native_platform_adapters_equivalence_tests.cpp',
          ]
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'zevryon-z2f7-bootstrap',
          }

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          for name in paths:
              content = Path(name).read_bytes()
              blob_sha = hashlib.sha1(
                  b'blob ' + str(len(content)).encode('ascii') + b'\0' + content
              ).hexdigest()
              encoded_path = urllib.parse.quote(name, safe='/')
              url = f'https://api.github.com/repos/{repo}/contents/{encoded_path}'
              current_sha = None
              try:
                  current = request('GET', f'{url}?ref={urllib.parse.quote(branch, safe="")}')
                  current_sha = current['sha']
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
              if current_sha == blob_sha:
                  print(f'unchanged {name} {blob_sha}')
                  continue
              payload = {
                  'message': f'Publish Z2F-7: {name}',
                  'content': base64.b64encode(content).decode('ascii'),
                  'branch': branch,
              }
              if current_sha is not None:
                  payload['sha'] = current_sha
              result = request('PUT', url, payload)
              print(f'published {name} {result["commit"]["sha"]}')
          PY
