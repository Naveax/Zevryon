name: repair-z2f3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-device-raster-execution
          fetch-depth: 0

      - name: Repair source and restore permanent workflows
        run: |
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/device_raster_backend.cpp')
          text = source.read_text(encoding='utf-8')
          old = '\n'.join([
              '            GlyphRasterSourceRecord source;',
              '            source.key = job.key;',
              '            source.payload_offset = offset;',
              '            source.payload_size = current.payload_size;',
              '            source.width = current.width;',
              '            source.height = current.height;',
              '            source.row_bytes = current.row_bytes;',
              '            source.bearing_x = current.bearing_x;',
              '            source.bearing_y = current.bearing_y;',
              '            source.format = current.format;',
              '            source.flags = (current.flags & kDeviceGlyphRasterMetricsEmpty) != 0U ? 1U : 0U;',
              '            source.content_checksum = fnv1a64(destination);',
          ])
          new = '\n'.join([
              '            const bool empty =',
              '                (current.flags & kDeviceGlyphRasterMetricsEmpty) != 0U;',
              '            GlyphRasterSourceRecord source;',
              '            source.key = job.key;',
              '            source.payload_offset = empty ? 0U : offset;',
              '            source.payload_size = current.payload_size;',
              '            source.width = current.width;',
              '            source.height = current.height;',
              '            source.row_bytes = current.row_bytes;',
              '            source.bearing_x = current.bearing_x;',
              '            source.bearing_y = current.bearing_y;',
              '            source.format = current.format;',
              '            source.flags = empty ?',
              '                static_cast<std::uint8_t>(kGlyphRasterSourceEmpty) : 0U;',
              '            source.content_checksum = empty ? 0U : fnv1a64(destination);',
          ])
          if text.count(old) != 1:
              raise SystemExit(f'expected one empty-raster publication block, found {text.count(old)}')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          focused_hex = Path('.z2f3/focused.hex').read_text(encoding='utf-8').strip()
          Path('.github/workflows/z2-device-raster-backend.yml').write_bytes(
              bytes.fromhex(focused_hex))
          PY

          git checkout origin/main -- .github/workflows/z2-glyph-atlas-submission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/device_raster_backend.cpp \
            .github/workflows/z2-device-raster-backend.yml \
            .github/workflows/z2-glyph-atlas-submission.yml
          git rm -r .z2f3 .github/workflows/repair-z2f3.yml
          git commit -m "Repair Z2F-3 empty raster publication"
          git push origin HEAD:work/z2f-bounded-device-raster-execution
