name: z2-text-paint-command-stream

on:
  pull_request:
    paths:
      - '.github/workflows/z2-text-paint-command-stream.yml'
      - 'cmake/text_paint_command_stream.cmake'
      - 'cmake/viewport_projection.cmake'
      - 'src/text_paint_command_stream.*'
      - 'src/viewport_projection.*'
      - 'src/line_fragment_layout.*'
      - 'src/multi_run_harfbuzz_shaper.*'
      - 'src/glyph_cluster_map.*'
      - 'src/ledger_memory_resource.*'
      - 'src/resource_ledger.*'
      - 'tests/text_paint_command_stream_tests.cpp'
      - 'tests/text_paint_command_equivalence_tests.cpp'
      - 'docs/Z2F1_BOUNDED_TEXT_PAINT_COMMAND_STREAM.md'
  workflow_dispatch:

concurrency:
  group: z2-text-paint-command-stream-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-text-paint-command-stream-tests \
            zevryon-text-paint-command-equivalence-tests \
            zevryon-text-paint-command-stream-benchmark \
            zevryon-viewport-projection-tests \
            zevryon-line-box-layout-tests \
            2>&1 | tee text-paint-command-build.log
      - name: Repeat focused certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^text-paint-command-stream-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee text-paint-command-repeat.log
      - name: Exhaustively certify command coalescing
        run: |
          set -o pipefail
          ctest --test-dir build -R '^text-paint-command-equivalence-tests$' \
            --output-on-failure 2>&1 | tee text-paint-command-equivalence.log
      - name: Run three independent distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-text-paint-command-stream-benchmark \
              > "text-paint-command-benchmark-${run}.json"
          done
      - name: Enforce exact output, memory and latency gates
        run: |
          python3 - <<'PY'
          import json

          rows = []
          for run in range(1, 4):
              with open(f'text-paint-command-benchmark-{run}.json', encoding='utf-8') as handle:
                  row = json.load(handle)
              assert row['schema'] == 'zevryon.text-paint-command-stream-benchmark.v1'
              assert row['input_document_lines'] == 16_384
              assert row['input_clusters'] == 65_536
              assert row['input_source_fragments'] == 65_536
              assert row['input_projected_lines'] == 80
              assert row['input_projected_fragment_rects'] == 320
              assert row['input_projected_carets'] == 640
              assert row['input_projected_selection_rects'] == 64
              assert row['output_clips'] == 1
              assert row['output_commands'] == 305
              assert row['output_glyph_batches'] == 240
              assert row['output_fill_rects'] == 65
              assert row['selection_commands'] == 64
              assert row['caret_commands'] == 1
              assert row['referenced_glyphs'] == 320
              assert row['coalesced_fragments'] == 80
              assert row['rtl_glyph_batches'] == 160
              assert row['lines_before_viewport'] == 8
              assert row['lines_after_viewport'] == 8
              assert row['maximum_glyphs_per_batch'] == 2
              assert row['maximum_glyph_batches_per_line'] == 3
              assert row['clip_record_bytes'] == 32
              assert row['command_record_bytes'] == 16
              assert row['glyph_batch_record_bytes'] == 64
              assert row['fill_rect_record_bytes'] == 48
              assert row['retained_bytes'] == 23_392
              assert row['peak_bytes'] == 23_392
              assert row['hard_limit_bytes'] == 23_392
              assert row['checksum'] == 1_355_758_546_038_770_003
              assert row['expected_checksum'] == row['checksum']
              assert row['within_hard_limits'] is True
              assert row['accounting_clean'] is True
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 4.0, row
              assert row['p99_ms'] <= 7.0, row
              assert row['maximum_ms'] <= 15.0, row
              rows.append(row)
          assert len({row['checksum'] for row in rows}) == 1
          print({
              'p50_ms': [row['p50_ms'] for row in rows],
              'p95_ms': [row['p95_ms'] for row in rows],
              'p99_ms': [row['p99_ms'] for row in rows],
              'maximum_ms': [row['maximum_ms'] for row in rows],
              'checksum': rows[0]['checksum'],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-text-paint-command-stream-${{ github.sha }}
          path: |
            text-paint-command-build.log
            text-paint-command-repeat.log
            text-paint-command-equivalence.log
            text-paint-command-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests under sanitizers
        run: >-
          cmake --build build-sanitized --parallel 2 --target
          zevryon-text-paint-command-stream-tests
          zevryon-text-paint-command-equivalence-tests
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^text-paint-command-(stream|equivalence)-tests$' --output-on-failure

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build benchmark and focused tests
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-text-paint-command-stream-tests \
            zevryon-text-paint-command-equivalence-tests \
            zevryon-text-paint-command-stream-benchmark \
            2>&1 | tee apple-text-paint-command-build.log
          ctest --test-dir build -R '^text-paint-command-(stream|equivalence)-tests$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-text-paint-command-stream-appleclang-${{ github.sha }}
          path: apple-text-paint-command-build.log
          if-no-files-found: warn
