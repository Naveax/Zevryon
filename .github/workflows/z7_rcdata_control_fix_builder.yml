name: Z7 RCDATA control-error fix builder

on:
  push:
    branches:
      - candidate/z7-rcdata-rawtext-empty-last-start-tag-v1
    paths:
      - '.github/workflows/z7_rcdata_control_fix_builder.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/z7-rcdata-rawtext-empty-last-start-tag-v1
          fetch-depth: 1
      - name: Apply exact control-error fix
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 --decode > /tmp/z7_fix.py
          python3 /tmp/z7_fix.py
      - name: Focused verification
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
          cmake --build build --parallel 2 --target zevryon-html-tokenizer-token-stream-v1-tests
          ctest --test-dir build --output-on-failure -R '^zevryon-html-tokenizer-token-stream-v1-tests$'
      - name: Commit fix and remove builder
        run: |
          rm .github/workflows/z7_rcdata_control_fix_builder.yml
          git config user.name Naveax
          git config user.email Omersevik095@gmail.com
          git add src/html_tokenizer_token_stream_v1.cpp tests/html_tokenizer_token_stream_v1_tests.cpp .github/workflows/z7_rcdata_control_fix_builder.yml
          git commit -m 'Z7: report text-state input control errors'
          git push origin HEAD:candidate/z7-rcdata-rawtext-empty-last-start-tag-v1
