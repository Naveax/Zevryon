name: Z7 CDATA initial-state builder

on:
  push:
    branches:
      - candidate/z7-tokenizer-cdata-initial-state-v1

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/z7-tokenizer-cdata-initial-state-v1

      - name: Apply production patch
        run: python3 scripts/run_z7_tokenizer_cdata_initial_state_v1.py

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON

      - name: Build focused production targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-html-tokenizer-token-stream-v1-tests
          zevryon-html-tokenizer-token-stream-v1-probe

      - name: Run focused token-stream tests
        run: ./build/zevryon-html-tokenizer-token-stream-v1-tests

      - name: Verify corpus and v7 authority self-tests
        run: |
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v7_baseline.py --self-test

      - name: Diagnose exact CDATA corpus movement
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("census.json").read_text(encoding="utf-8"))
          assert report["files"] == 14, report
          assert report["tests"] == 6810, report
          assert report["executions"] == 7036, report
          assert report["passed"] + report["failed"] + report["unsupported"] == 7036, report
          summary = {
              "passed": report["passed"],
              "failed": report["failed"],
              "unsupported": report["unsupported"],
              "failure_samples": report.get("failure_samples", []),
              "unsupported_samples": report.get("unsupported_samples", []),
              "reason_counts": report["reason_counts"],
              "file_reports": report["file_reports"],
          }
          print(json.dumps(summary, indent=2, ensure_ascii=False, sort_keys=True))
          if report["failed"] > 122:
              raise SystemExit("diagnostic: CDATA introduced new failures; production commit intentionally blocked")
          raise SystemExit("diagnostic complete; production commit intentionally blocked until exact movement is understood")
          PY

      - name: Commit tested production diff and self-clean builder
        shell: bash
        run: |
          set -euo pipefail
          rm -f census.json
          rm -f .github/workflows/z7_tokenizer_cdata_initial_state_builder.yml
          rm -f scripts/apply_z7_tokenizer_cdata_initial_state_v1.py
          rm -f scripts/run_z7_tokenizer_cdata_initial_state_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/html_tokenizer_token_stream_v1.hpp \
                  src/html_tokenizer_token_stream_v1.cpp \
                  tests/html_tokenizer_token_stream_v1_probe.cpp \
                  tests/html_tokenizer_token_stream_v1_tests.cpp \
                  scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py \
                  docs/Z7_HTML_TOKENIZER_CDATA_SECTION_V1.md \
                  .github/workflows/z7_tokenizer_cdata_initial_state_builder.yml \
                  scripts/apply_z7_tokenizer_cdata_initial_state_v1.py \
                  scripts/run_z7_tokenizer_cdata_initial_state_v1.py
          git diff --cached --quiet && { echo "builder produced no diff" >&2; exit 1; }
          git diff --cached --check
          git commit -m "Z7: admit bounded CDATA initial state"
          git push origin HEAD:candidate/z7-tokenizer-cdata-initial-state-v1
