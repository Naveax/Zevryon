name: Z7 html5lib tokenizer full corpus provenance v2 builder

on:
  push:
    branches:
      - candidate/z7-html5lib-tokenizer-full-corpus-provenance-v2

permissions:
  contents: write

jobs:
  build-provenance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Zevryon candidate
        uses: actions/checkout@v4
        with:
          ref: candidate/z7-html5lib-tokenizer-full-corpus-provenance-v2
          fetch-depth: 1

      - name: Checkout pinned html5lib tokenizer authority
        uses: actions/checkout@v4
        with:
          repository: html5lib/html5lib-tests
          ref: 224991ec10db04f056a89eed8b0bd8695fd2950e
          path: _upstream/html5lib-tests
          fetch-depth: 1
          persist-credentials: false

      - name: Build complete 14-fixture provenance authority
        run: >-
          python3 scripts/build_z7_html5lib_tokenizer_full_corpus_v2.py
          --upstream _upstream/html5lib-tests

      - name: Verify generated v2 authority and tamper guards
        shell: bash
        run: |
          set -euo pipefail
          report="$(python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test)"
          printf '%s\n' "$report"
          REPORT="$report" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(os.environ["REPORT"])
          manifest = json.loads(Path("config/z7_html5lib_tokenizer_corpus.json").read_text(encoding="utf-8"))
          expected_tests = sum(item["test_count"] for item in manifest["files"])
          expected_executions = sum(item["execution_count"] for item in manifest["files"])

          assert manifest["schema"] == "zevryon.z7.html5lib-tokenizer-corpus.v2", manifest
          assert manifest["authority"] == "z7-html5lib-tokenizer-corpus-provenance-v2", manifest
          assert manifest["conformance_claim"] is False, manifest
          assert len(manifest["files"]) == 14, manifest
          assert report["schema"] == "zevryon.z7.html5lib-tokenizer-corpus-verification.v2", report
          assert report["authority"] == "z7-html5lib-tokenizer-corpus-provenance-v2", report
          assert report["files_verified"] == 14, report
          assert report["tests_verified"] == expected_tests, report
          assert report["executions_verified"] == expected_executions, report
          assert report["provenance_gate_passed"] is True, report
          assert report["conformance_claim"] is False, report
          assert report["self_test_passed"] is True, report
          assert report["tamper_rejection_checked"] is True, report
          assert report["commit_drift_rejection_checked"] is True, report
          assert report["git_blob_drift_rejection_checked"] is True, report
          assert report["malformed_token_kind_rejection_checked"] is True, report
          PY

      - name: Ensure existing execution authorities survive v2 manifest expansion
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DZEVRYON_ENABLE_RUST_CORE=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
          cmake --build build --parallel 2 --target zevryon-html-tokenizer-token-stream-v1-probe
          ctest --test-dir build --output-on-failure \
            -R "z7-html5lib-tokenizer-(corpus-provenance|corpus-provenance-self-test|runner-v1|test1-admitted-runner-v1|test1-admitted-runner-v1-self-test)"

      - name: Reject unintended checkout/build artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _upstream build
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all | grep -vE '^.. (_upstream|build)/' | grep -vE '^\?\? (_upstream|build)/' | grep -vE '^.. scripts/build_z7_html5lib_tokenizer_full_corpus_v2.py$' | grep -vE '^.. .github/workflows/z7_html5lib_tokenizer_full_corpus_provenance_v2_builder.yml$' || true)" || {
            echo 'Generated authority contains unexpected paths:' >&2
            git status --short >&2
            exit 1
          }

      - name: Commit tested provenance and remove one-shot builder
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/z7_html5lib_tokenizer_full_corpus_provenance_v2_builder.yml \
            scripts/build_z7_html5lib_tokenizer_full_corpus_v2.py
          git add \
            config/z7_html5lib_tokenizer_corpus.json \
            scripts/z7_html5lib_tokenizer_corpus_verify.py \
            docs/Z7_HTML5LIB_TOKENIZER_CORPUS.md \
            tests/fixtures/html5lib-tokenizer/*.test
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Z7: pin complete html5lib tokenizer corpus provenance v2'
          git push origin HEAD:candidate/z7-html5lib-tokenizer-full-corpus-provenance-v2
