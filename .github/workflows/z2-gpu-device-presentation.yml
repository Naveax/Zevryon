name: z2-gpu-device-presentation

on:
  pull_request:
    paths:
      - '.github/workflows/z2-gpu-device-presentation.yml'
      - 'cmake/gpu_device_presentation.cmake'
      - 'cmake/gpu_atlas_frame_submission.cmake'
      - 'src/gpu_device_presentation.*'
      - 'src/gpu_atlas_frame_submission.*'
      - 'src/device_raster_backend.*'
      - 'tests/gpu_device_presentation_tests.cpp'
      - 'tests/gpu_device_presentation_equivalence_tests.cpp'
      - 'docs/Z2F5_BOUNDED_GPU_DEVICE_PRESENTATION.md'
  workflow_dispatch:

concurrency:
  group: z2-gpu-device-presentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-gpu-device-presentation-tests \
            zevryon-gpu-device-presentation-equivalence-tests \
            zevryon-gpu-device-presentation-benchmark \
            zevryon-gpu-atlas-frame-submission-tests \
            zevryon-device-raster-backend-tests \
            2>&1 | tee gpu-device-build.log
      - name: Repeat functional certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^gpu-device-presentation-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee gpu-device-repeat.log
      - name: Run independent device and presentation oracle
        run: |
          set -o pipefail
          ctest --test-dir build -R '^gpu-device-presentation-equivalence-tests$' \
            --output-on-failure 2>&1 | tee gpu-device-equivalence.log
      - name: Run three independent benchmark distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-gpu-device-presentation-benchmark 256 \
              > "gpu-device-benchmark-${run}.json"
          done
      - name: Enforce exact topology, memory and latency gates
        run: |
          python3 - <<'PY'
          import json

          rows = []
          for run in range(1, 4):
              with open(f'gpu-device-benchmark-{run}.json', encoding='utf-8') as handle:
                  row = json.load(handle)
              assert row['schema'] == 'zevryon.gpu-device-presentation-benchmark.v1'
              assert row['input_document_lines'] == 16_384
              assert row['input_projected_lines'] == 80
              assert row['input_uploads'] == 93
              assert row['input_payload_bytes'] == 12_720
              assert row['input_draw_instances'] == 310
              assert row['input_draw_batches'] == 3
              assert row['selection_commands'] == 64
              assert row['caret_commands'] == 1
              assert row['texture_count'] == 3
              assert row['surface_image_count'] == 3
              assert row['in_flight_frames'] == 1
              assert row['texture_pins'] == 3
              assert row['upload_submissions'] == 3
              assert row['present_submissions'] == 2
              assert row['retired_frames'] == 1
              assert row['texture_allocations'] == 3
              assert row['texture_reuses'] == 0
              assert row['texture_evictions'] == 0
              assert row['surface_reconfigurations'] == 1
              assert row['last_submitted_fence'] == 5
              assert row['cold_present_fence'] == 4
              assert row['hot_present_fence'] == 5
              assert row['frame_command_count'] == 68
              assert row['metadata_current_bytes'] == 816
              assert row['metadata_peak_bytes'] == 1_104
              assert row['metadata_hard_limit_bytes'] == 1_104
              assert row['texture_handle_bytes'] == 32
              assert row['texture_record_bytes'] == 80
              assert row['surface_image_handle_bytes'] == 32
              assert row['surface_image_record_bytes'] == 64
              assert row['texture_pin_bytes'] == 32
              assert row['present_receipt_bytes'] == 80
              assert row['in_flight_frame_bytes'] == 96
              assert row['checksum'] == 13_139_880_764_296_641_394
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 2.0, row
              assert row['p99_ms'] <= 4.0, row
              assert row['maximum_ms'] <= 15.0, row
              rows.append(row)
          assert len({row['checksum'] for row in rows}) == 1
          assert len({row['metadata_current_bytes'] for row in rows}) == 1
          assert len({row['metadata_peak_bytes'] for row in rows}) == 1
          print({
              'p50_ms': [row['p50_ms'] for row in rows],
              'p95_ms': [row['p95_ms'] for row in rows],
              'p99_ms': [row['p99_ms'] for row in rows],
              'maximum_ms': [row['maximum_ms'] for row in rows],
              'checksum': rows[0]['checksum'],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-gpu-device-presentation-${{ github.sha }}
          path: |
            gpu-device-build.log
            gpu-device-repeat.log
            gpu-device-equivalence.log
            gpu-device-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests under sanitizers
        run: |
          set -o pipefail
          cmake --build build-sanitized --parallel 2 --target \
            zevryon-gpu-device-presentation-tests \
            zevryon-gpu-device-presentation-equivalence-tests \
            2>&1 | tee gpu-device-sanitizer-build.log
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^gpu-device-presentation-(tests|equivalence-tests)$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-gpu-device-presentation-sanitizer-${{ github.sha }}
          path: gpu-device-sanitizer-build.log
          if-no-files-found: warn

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build and run focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-gpu-device-presentation-tests \
            zevryon-gpu-device-presentation-equivalence-tests \
            zevryon-gpu-device-presentation-benchmark \
            2>&1 | tee apple-gpu-device-build.log
          ctest --test-dir build -R '^gpu-device-presentation-(tests|equivalence-tests)$' --output-on-failure
          ./build/zevryon-gpu-device-presentation-benchmark 128 > apple-gpu-device-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-gpu-device-presentation-appleclang-${{ github.sha }}
          path: |
            apple-gpu-device-build.log
            apple-gpu-device-benchmark.json
          if-no-files-found: warn
