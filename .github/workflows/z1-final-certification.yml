name: Z1 final certification

on:
  pull_request:
    paths:
      - 'config/zenith_program.json'
      - 'certification/z1_gate_closure.json'
      - 'tests/test_z1_gate_closure.py'
      - 'tests/test_zenith_program_contract.py'
      - '.github/workflows/z1-final-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Z1 gate closure and program contract
        run: >-
          python -m pytest -q
          tests/test_z1_gate_closure.py
          tests/test_zenith_program_contract.py
      - name: Validate closure JSON syntax
        run: python -m json.tool certification/z1_gate_closure.json > /dev/null

  closure-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Z1 gate closure and program contract
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_z1_gate_closure.py
          tests/test_zenith_program_contract.py
      - name: Validate closure JSON syntax
        shell: pwsh
        run: python -m json.tool certification/z1_gate_closure.json > $null
