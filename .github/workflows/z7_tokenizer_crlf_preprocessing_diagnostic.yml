name: Z7 CRLF preprocessing diagnostic

on:
  push:
    branches:
      - candidate/z7-tokenizer-crlf-preprocessing-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/z7-tokenizer-crlf-preprocessing-v1

      - name: Apply diagnostic production patch
        run: |
          python3 scripts/apply_z7_tokenizer_crlf_preprocessing_v1.py
          git diff --check

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON

      - name: Build focused tokenizer targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-html-tokenizer-token-stream-v1-tests
          zevryon-html-tokenizer-token-stream-v1-probe

      - name: Run focused tokenizer tests
        run: ./build/zevryon-html-tokenizer-token-stream-v1-tests

      - name: Verify corpus and v8 authority self-tests
        run: |
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v8_baseline.py --self-test

      - name: Measure raw CRLF corpus movement
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("census.json").read_text(encoding="utf-8"))
          baseline = json.loads(Path("config/z7_html5lib_tokenizer_full_corpus_census_v8.json").read_text(encoding="utf-8"))

          assert report["files"] == 14, report
          assert report["tests"] == 6810, report
          assert report["executions"] == 7036, report
          assert report["passed"] + report["failed"] + report["unsupported"] == 7036, report
          assert report["exact_execution_accounting"] is True, report
          assert report["html_tokenizer_conformance_claim"] is False, report
          assert report["z7_status_change"] is False, report

          print("CRLF_DIAGNOSTIC_TOTALS", json.dumps({
              "passed": report["passed"],
              "failed": report["failed"],
              "unsupported": report["unsupported"],
          }, sort_keys=True))
          print("CRLF_DIAGNOSTIC_DELTA", json.dumps({
              "passed": report["passed"] - baseline["passed"],
              "failed": report["failed"] - baseline["failed"],
              "unsupported": report["unsupported"] - baseline["unsupported"],
          }, sort_keys=True))

          changed_files = {}
          for path, current in report["file_reports"].items():
              before = baseline["file_reports"][path]
              if current != before:
                  changed_files[path] = {"before": before, "after": current}
          print("CRLF_DIAGNOSTIC_CHANGED_FILES", json.dumps(changed_files, indent=2, sort_keys=True))

          changed_reasons = {}
          keys = set(baseline["reason_counts"]) | set(report["reason_counts"])
          for key in sorted(keys):
              before = baseline["reason_counts"].get(key, 0)
              after = report["reason_counts"].get(key, 0)
              if before != after:
                  changed_reasons[key] = {"before": before, "after": after, "delta": after - before}
          print("CRLF_DIAGNOSTIC_CHANGED_REASONS", json.dumps(changed_reasons, indent=2, sort_keys=True))
          print("CRLF_DIAGNOSTIC_FAILURE_SAMPLES", json.dumps(report["failure_samples"], indent=2, ensure_ascii=False))
          print("CRLF_DIAGNOSTIC_UNSUPPORTED_SAMPLES", json.dumps(report["unsupported_samples"], indent=2, ensure_ascii=False))

          raise SystemExit("diagnostic-only run complete; production publication intentionally blocked")
          PY
