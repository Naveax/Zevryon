name: Z7 parser certification

on:
  pull_request:
    paths:
      - 'tests/streaming_html_parser_fuzz_certification_tests.cpp'
      - 'tests/streaming_html_large_document_certification_tests.cpp'
      - 'src/streaming_html_node_source_v2.cpp'
      - 'src/streaming_html_node_source_v2.hpp'
      - 'src/logical_node_source_v2.cpp'
      - 'src/logical_node_source_v2.hpp'
      - '.github/workflows/z7-parser-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Attach fuzz certification target
        shell: bash
        run: |
          cat >> cmake/logical_node_arena.cmake <<'EOF'
          if(BUILD_TESTING)
            add_executable(
              zevryon-streaming-html-parser-fuzz-certification-tests
              tests/streaming_html_parser_fuzz_certification_tests.cpp)
            target_link_libraries(
              zevryon-streaming-html-parser-fuzz-certification-tests
              PRIVATE zevryon-massivedoc-core)
            zevryon_options(zevryon-streaming-html-parser-fuzz-certification-tests)
          endif()
          EOF
      - name: Configure sanitizer authority
        run: >-
          cmake -S . -B build-z7-fuzz -G Ninja -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build fuzz authority
        run: cmake --build build-z7-fuzz --target zevryon-streaming-html-parser-fuzz-certification-tests
      - name: Execute 10000-case sanitizer authority
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build-z7-fuzz/zevryon-streaming-html-parser-fuzz-certification-tests

  bounded-large-document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Attach large-document certification target
        shell: bash
        run: |
          cat >> cmake/logical_node_arena.cmake <<'EOF'
          if(BUILD_TESTING)
            add_executable(
              zevryon-streaming-html-large-document-certification-tests
              tests/streaming_html_large_document_certification_tests.cpp)
            target_link_libraries(
              zevryon-streaming-html-large-document-certification-tests
              PRIVATE zevryon-massivedoc-core)
            zevryon_options(zevryon-streaming-html-large-document-certification-tests)
          endif()
          EOF
      - name: Configure release authority
        run: cmake -S . -B build-z7-large -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build large-document authority
        run: cmake --build build-z7-large --target zevryon-streaming-html-large-document-certification-tests
      - name: Execute bounded large-document authority
        run: ./build-z7-large/zevryon-streaming-html-large-document-certification-tests
