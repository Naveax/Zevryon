name: Z7 parser certification

on:
  pull_request:
    paths:
      - 'tests/streaming_html_parser_fuzz_certification_tests.cpp'
      - 'tests/streaming_html_large_document_certification_tests.cpp'
      - 'src/streaming_html_node_source_v2.cpp'
      - 'src/streaming_html_node_source_v2.hpp'
      - 'src/logical_node_source_v2.cpp'
      - 'src/logical_node_source_v2.hpp'
      - 'cmake/html_tree_builder_v1.cmake'
      - 'cmake/z7_parser_certification.cmake'
      - 'config/zenith_program.json'
      - '.github/workflows/z7-parser-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure sanitizer authority
        run: >-
          cmake -S . -B build-z7-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build fuzz authority
        run: cmake --build build-z7-fuzz --parallel 2 --target zevryon-streaming-html-parser-fuzz-certification-tests
      - name: Execute 10000-case sanitizer authority
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build-z7-fuzz/zevryon-streaming-html-parser-fuzz-certification-tests

  bounded-large-document:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure release authority
        run: >-
          cmake -S . -B build-z7-large -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build large-document authority
        run: cmake --build build-z7-large --parallel 2 --target zevryon-streaming-html-large-document-certification-tests
      - name: Execute bounded large-document authority
        run: ./build-z7-large/zevryon-streaming-html-large-document-certification-tests
