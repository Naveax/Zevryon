name: z2-real-metal-window-presentation

on:
  pull_request:
    paths:
      - '.github/workflows/z2-real-metal-window-presentation.yml'
      - '.z2f8b3a-metal-upload-patch.b64'
      - 'src/native_window_swapchain_metal.mm'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f8b3-shared-render-pipeline
          fetch-depth: 0
      - name: Apply encoded Metal upload patch
        run: |
          base64 -d .z2f8b3a-metal-upload-patch.b64 > /tmp/metal-upload-patch.py
          python3 /tmp/metal-upload-patch.py
      - name: Publish optimized Metal transfer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native_window_swapchain_metal.mm
          git commit -m 'Reuse Metal full-frame upload buffers'
          git push origin HEAD:work/z2f8b3-shared-render-pipeline
