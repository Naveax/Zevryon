name: Z7 Script-data Unicode after zero-failure production builder v1

on:
  push:
    branches:
      - candidate/z7-script-unicode-after-zero-failure-production-v1

permissions:
  contents: write

jobs:
  build-production:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact fresh main base
        run: |
          set -euo pipefail
          BASE='4a84520aa234753cdb429053da5a463aa7e76e7b'
          git merge-base --is-ancestor "$BASE" HEAD
      - name: Apply Script-data Unicode production candidate
        run: |
          set -euo pipefail
          python3 scripts/apply_z7_script_unicode_after_zero_failure_production_v1.py
          git diff --check
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused tokenizer targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-html-tokenizer-script-data-v1-tests
          zevryon-html-tokenizer-token-stream-v1-tests
          zevryon-html-tokenizer-token-stream-v1-probe
      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build/zevryon-html-tokenizer-script-data-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests
      - name: Verify corpus harnesses
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --self-test
      - name: Require exact no-regression corpus movement
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py \
            --policy no-regression \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > census.json
          python3 - <<'PY'
          import json
          r=json.load(open('census.json'))
          assert r['files']==14,r
          assert r['tests']==6810,r
          assert r['executions']==7036,r
          assert r['passed']==6986,r
          assert r['failed']==0,r
          assert r['unsupported']==50,r
          assert r['reason_counts'].get('unsupported:production-fail-closed:HTML Script-data non-ASCII preprocessing/location authority is not implemented',0)==0,r
          assert r['reason_counts'].get('unsupported:input-preprocessing-nul',0)==19,r
          assert r['reason_counts'].get('failed:parse-error-stream-mismatch',0)==0,r
          assert r['reason_counts'].get('failed:token-stream-mismatch',0)==0,r
          assert r['baseline_regression_free'] is True,r
          assert r['full_corpus_pass_claim'] is False,r
          assert r['html_tokenizer_conformance_claim'] is False,r
          assert r['z7_status_change'] is False,r
          print('SCRIPT_UNICODE_PRODUCTION_TOTALS',r['passed'],r['failed'],r['unsupported'])
          PY
      - name: Self-clean and publish production commit
        run: |
          set -euo pipefail
          BASE='4a84520aa234753cdb429053da5a463aa7e76e7b'
          git rm scripts/apply_z7_script_unicode_after_zero_failure_production_v1.py
          git rm .github/workflows/z7_script_unicode_after_zero_failure_production_builder_v1.yml
          mapfile -t changed < <(git diff --name-only "$BASE" -- | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            src/html_tokenizer_script_data_v1.cpp
            tests/html_tokenizer_script_data_v1_tests.cpp
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
          git diff --check "$BASE"
          git config user.name 'Naveax'
          git config user.email 'Omersevik095@gmail.com'
          git add src/html_tokenizer_script_data_v1.cpp tests/html_tokenizer_script_data_v1_tests.cpp
          git commit -m 'Z7: admit Script-data Unicode after zero-failure fixes'
          git push origin HEAD:candidate/z7-script-unicode-after-zero-failure-production-v1
