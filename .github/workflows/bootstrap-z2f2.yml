name: bootstrap-z2f2

on:
  push:
    branches:
      - work/z2f-bounded-glyph-atlas-submission
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'pull_request' || github.event.head_commit.message == 'Run Z2F-2 payload bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-glyph-atlas-submission
      - name: Materialize payload
        run: |
          wc -c .z2f2/part*
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile
          encoded = b''.join(path.read_bytes() for path in sorted(Path('.z2f2').glob('part*')))
          print('encoded_bytes', len(encoded))
          print('encoded_sha256', hashlib.sha256(encoded).hexdigest())
          raw = base64.b64decode(encoded, validate=True)
          print('archive_bytes', len(raw))
          print('archive_sha256', hashlib.sha256(raw).hexdigest())
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              print('archive_members', archive.getnames())
              archive.extractall('.')
          path = Path('cmake/text_paint_command_stream.cmake')
          text = path.read_text(encoding='utf-8')
          include = 'include("${CMAKE_CURRENT_LIST_DIR}/glyph_atlas_submission.cmake")'
          if include not in text:
              path.write_text(text.rstrip() + '\n\n' + include + '\n', encoding='utf-8')
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/glyph_atlas_submission.* tests/glyph_atlas_* cmake/glyph_atlas_submission.cmake cmake/text_paint_command_stream.cmake docs/Z2F2_BOUNDED_GLYPH_RASTER_ATLAS_SUBMISSION.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Implement bounded glyph atlas submission"
          git push origin HEAD:work/z2f-bounded-glyph-atlas-submission
