name: bootstrap-z2f2

on:
  pull_request:
    branches:
      - main

concurrency:
  group: bootstrap-z2f2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-glyph-atlas-submission
          fetch-depth: 0
      - name: Remove bootstrap payload
        run: |
          test -f src/glyph_atlas_submission.hpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .z2f2
          git commit -m "Remove Z2F-2 bootstrap payload"
          git push origin HEAD:work/z2f-bounded-glyph-atlas-submission
