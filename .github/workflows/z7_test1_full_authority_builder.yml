name: Z7 test1 full authority builder

on:
  push:
    branches:
      - candidate/z7-test1-full-authority-v1

permissions:
  contents: write

jobs:
  build-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/z7-test1-full-authority-v1
          fetch-depth: 1

      - name: Apply 69/0 test1 authority promotion
        run: python3 scripts/apply_z7_test1_full_authority_v1.py

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON

      - name: Build focused tokenizer targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-html-tokenizer-token-stream-v1-probe
          zevryon-html-tokenizer-data-tags-v1-tests
          zevryon-html-tokenizer-data-stream-v1-tests
          zevryon-html-tokenizer-data-utf8-text-v1-tests
          zevryon-html-tokenizer-named-character-reference-v1-tests
          zevryon-html-tokenizer-numeric-character-reference-v1-tests

      - name: Run focused production and authority tests
        run: >-
          ctest --test-dir build --output-on-failure
          -R "(html-tokenizer-(data-tags|data-stream|data-utf8-text|named-character-reference|numeric-character-reference)-v1-tests|z7-html5lib-tokenizer-(corpus-provenance|test1-admitted-runner-v1|test1-admitted-runner-v1-self-test)|z7-html-named-reference-table-(provenance|verifier-tests))"

      - name: Assert exact 69/0 external authority report
        shell: bash
        run: |
          set -euo pipefail
          report="$(python3 scripts/z7_html5lib_tokenizer_test1_admitted_runner_v1.py --probe build/zevryon-html-tokenizer-token-stream-v1-probe)"
          printf '%s\n' "$report"
          REPORT="$report" python3 - <<'PY'
          import json
          import os

          report = json.loads(os.environ["REPORT"])
          assert report["executions"] == 69, report
          assert report["admitted"] == 69, report
          assert report["passed"] == 69, report
          assert report["failed"] == 0, report
          assert report["unsupported"] == 0, report
          assert report["unsupported_descriptions"] == [], report
          assert report["admitted_surface_pass_claim"] is True, report
          assert report["full_fixture_pass_claim"] is True, report
          assert report["html_tokenizer_conformance_claim"] is False, report
          assert report["z7_status_change"] is False, report
          PY

      - name: Assert exact literal non-ASCII production probe
        shell: bash
        run: |
          set -euo pipefail
          actual="$(build/zevryon-html-tokenizer-token-stream-v1-probe DATA '' 26c2ac3b)"
          expected=$'TOKEN\tC\t26c2ac3b\nSTATS\t4\t1\t1\t4\t0\t0'
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Commit tested authority slice and remove builder
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/z7_test1_full_authority_builder.yml scripts/apply_z7_test1_full_authority_v1.py
          git add scripts/z7_html5lib_tokenizer_test1_admitted_runner_v1.py docs/Z7_HTML5LIB_TOKENIZER_TEST1_ADMITTED_RUNNER_V1.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Z7: promote pinned test1 authority to 69/69'
          git push origin HEAD:candidate/z7-test1-full-authority-v1
