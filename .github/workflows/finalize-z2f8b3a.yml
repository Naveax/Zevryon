name: finalize-z2f8b3a

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'work/z2f8b3-shared-render-pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f8b3-shared-render-pipeline
          fetch-depth: 0
      - name: Document the shared pixel link boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cmake/native_window_swapchain.cmake')
          text = path.read_text(encoding='utf-8')
          old = 'if(TARGET zevryon-native-gpu-sdk-execution)\n  add_library(\n'
          new = '''if(TARGET zevryon-native-gpu-sdk-execution)\n  # Pixel-view validation is independent from the optional compositor and\n  # platform presenter libraries, keeping minimal native graphs link-complete.\n  add_library(\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'Pixel-view validation is independent' not in text:
              raise SystemExit('unexpected native swapchain CMake preamble')
          PY
      - name: Commit final production head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmake/native_window_swapchain.cmake
          git rm .github/workflows/finalize-z2f8b3a.yml
          git commit -m 'Finalize shared native pixel link boundary'
          git push origin HEAD:work/z2f8b3-shared-render-pipeline
