name: z2-native-window-swapchain

on:
  pull_request:
    paths:
      - '.github/workflows/z2-native-window-swapchain.yml'
      - 'cmake/native_window_swapchain.cmake'
      - 'cmake/native_gpu_sdk_execution.cmake'
      - 'src/native_window_swapchain*'
      - 'tests/native_window_swapchain*'
      - 'docs/Z2F8B1_NATIVE_WINDOW_SWAPCHAIN_CONTRACT.md'
  workflow_dispatch:

concurrency:
  group: z2-native-window-swapchain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-native-window-swapchain-tests \
            zevryon-native-window-swapchain-equivalence-tests \
            zevryon-native-window-swapchain-benchmark \
            2>&1 | tee native-window-swapchain-build.log
      - name: Repeat functional certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^native-window-swapchain-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee native-window-swapchain-repeat.log
      - name: Run 9216-case lifecycle oracle
        run: |
          set -o pipefail
          ctest --test-dir build \
            -R '^native-window-swapchain-equivalence-tests$' \
            --output-on-failure \
            2>&1 | tee native-window-swapchain-equivalence.log
      - name: Run three benchmark distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-native-window-swapchain-benchmark 512 \
              > "native-window-swapchain-benchmark-${run}.json"
          done
      - name: Enforce exact topology, memory and latency gates
        run: |
          python3 - <<'PY'
          import json

          rows = []
          for run in range(1, 4):
              with open(
                  f'native-window-swapchain-benchmark-{run}.json',
                  encoding='utf-8') as handle:
                  row = json.load(handle)
              assert row['schema'] == 'zevryon.native-window-swapchain-benchmark.v1'
              assert row['input_document_lines'] == 16_384
              assert row['input_projected_lines'] == 80
              assert row['backend_count'] == 3
              assert row['iterations'] == 512
              assert row['submissions_per_iteration'] == 3
              assert row['damage_rects_per_submission'] == 4
              assert row['commands_per_submission'] == 80
              assert row['swapchain_images_per_backend'] == 3
              assert row['frames_in_flight_limit'] == 2
              assert row['surface_width'] == 1_920
              assert row['surface_height'] == 1_080
              assert row['surface_bytes_per_backend'] == 24_883_200
              assert row['surface_bytes_total'] == 74_649_600
              assert row['peak_in_flight_bytes_total'] == 24_883_200
              assert row['context_record_bytes'] == 72
              assert row['capabilities_record_bytes'] == 40
              assert row['limits_record_bytes'] == 40
              assert row['config_record_bytes'] == 208
              assert row['image_record_bytes'] == 96
              assert row['receipt_record_bytes'] == 152
              assert row['vulkan_checksum'] == 10_962_443_306_537_649_593
              assert row['metal_checksum'] == 1_849_862_543_801_632_953
              assert row['d3d12_checksum'] == 7_341_730_954_224_147_497
              assert row['checksum'] == 14_701_532_127_464_725_038
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 2.0, row
              assert row['p99_ms'] <= 4.0, row
              assert row['maximum_ms'] <= 15.0, row
              rows.append(row)

          stable = (
              'surface_bytes_total',
              'peak_in_flight_bytes_total',
              'vulkan_checksum',
              'metal_checksum',
              'd3d12_checksum',
              'checksum',
          )
          for key in stable:
              assert len({row[key] for row in rows}) == 1, key
          print({
              'p50_ms': [row['p50_ms'] for row in rows],
              'p95_ms': [row['p95_ms'] for row in rows],
              'p99_ms': [row['p99_ms'] for row in rows],
              'maximum_ms': [row['maximum_ms'] for row in rows],
              'checksum': rows[0]['checksum'],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-native-window-swapchain-${{ github.sha }}
          path: |
            native-window-swapchain-build.log
            native-window-swapchain-repeat.log
            native-window-swapchain-equivalence.log
            native-window-swapchain-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests under sanitizers
        run: |
          set -o pipefail
          cmake --build build-sanitized --parallel 2 --target \
            zevryon-native-window-swapchain-tests \
            zevryon-native-window-swapchain-equivalence-tests \
            2>&1 | tee native-window-swapchain-sanitizer-build.log
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build-sanitized
          -R '^native-window-swapchain-(tests|equivalence-tests)$'
          --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-native-window-swapchain-sanitizer-${{ github.sha }}
          path: native-window-swapchain-sanitizer-build.log
          if-no-files-found: warn

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-native-window-swapchain-tests
          zevryon-native-window-swapchain-equivalence-tests
      - name: Run focused tests
        run: >-
          ctest --test-dir build
          -R '^native-window-swapchain-(tests|equivalence-tests)$'
          --output-on-failure

  msvc:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC build
        shell: pwsh
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build focused targets
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target zevryon-native-window-swapchain-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2 --target zevryon-native-window-swapchain-equivalence-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run focused tests
        shell: pwsh
        run: ctest --test-dir build -C Release -R '^native-window-swapchain-(tests|equivalence-tests)$' --output-on-failure
