name: z2-native-window-swapchain

on:
  pull_request:
    paths:
      - '.github/workflows/z2-native-window-swapchain.yml'
      - '.z2f8b2_patch_pending'
      - 'src/native_gpu_sdk_execution.hpp'
      - 'src/native_gpu_sdk_execution.cpp'
      - 'src/native_gpu_sdk_execution_d3d12.cpp'
      - 'src/native_window_swapchain.hpp'

permissions:
  contents: write

jobs:
  publish-z2f8b2a-abi:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact ABI patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .z2f8b2_patch_pending
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          context_block = '''

enum NativeGpuSdkContextFlags : std::uint32_t {
    kNativeGpuSdkContextDeviceValid = 1U << 0U,
    kNativeGpuSdkContextGraphicsQueueValid = 1U << 1U,
    kNativeGpuSdkContextPresentQueueValid = 1U << 2U,
    kNativeGpuSdkContextSharedGraphicsPresentQueue = 1U << 3U,
    kNativeGpuSdkContextSoftwareDevice = 1U << 4U
};

struct NativeGpuSdkContextHandle final {
    NativeGpuApiKind api_kind{NativeGpuApiKind::ReferenceCpu};
    std::uint8_t reserved0[3]{0, 0, 0};
    std::uint32_t flags{0};
    std::uint64_t device_generation{0};
    std::uint64_t runtime_generation{0};
    std::uint64_t instance_or_factory{0};
    std::uint64_t physical_device_or_adapter{0};
    std::uint64_t device{0};
    std::uint64_t graphics_queue{0};
    std::uint64_t present_queue{0};
    std::uint32_t graphics_queue_family{0};
    std::uint32_t present_queue_family{0};

    bool operator==(const NativeGpuSdkContextHandle&) const noexcept = default;
};

static_assert(sizeof(NativeGpuSdkContextHandle) == 72U);
'''
          replace_once(
              'src/native_gpu_sdk_execution.hpp',
              'static_assert(sizeof(NativeWindowSurfaceHandle) == 48U);\n',
              'static_assert(sizeof(NativeWindowSurfaceHandle) == 48U);' + context_block + '\n')
          replace_once(
              'src/native_gpu_sdk_execution.hpp',
              '''    virtual bool initialize(
        const NativeGpuSdkConfig& config,
        NativeGpuSdkError* error) noexcept = 0;
    virtual bool configure_offscreen_surface(
''',
              '''    virtual bool initialize(
        const NativeGpuSdkConfig& config,
        NativeGpuSdkError* error) noexcept = 0;
    virtual bool export_context(
        NativeGpuSdkContextHandle* context,
        NativeGpuSdkError* error) noexcept;
    virtual bool configure_offscreen_surface(
''')
          duplicate_context = '''enum NativeGpuSdkContextFlags : std::uint32_t {
    kNativeGpuSdkContextDeviceValid = 1U << 0U,
    kNativeGpuSdkContextGraphicsQueueValid = 1U << 1U,
    kNativeGpuSdkContextPresentQueueValid = 1U << 2U,
    kNativeGpuSdkContextSharedGraphicsPresentQueue = 1U << 3U,
    kNativeGpuSdkContextSoftwareDevice = 1U << 4U
};

struct NativeGpuSdkContextHandle final {
    NativeGpuApiKind api_kind{NativeGpuApiKind::ReferenceCpu};
    std::uint8_t reserved0[3]{0, 0, 0};
    std::uint32_t flags{0};
    std::uint64_t device_generation{0};
    std::uint64_t runtime_generation{0};
    std::uint64_t instance_or_factory{0};
    std::uint64_t physical_device_or_adapter{0};
    std::uint64_t device{0};
    std::uint64_t graphics_queue{0};
    std::uint64_t present_queue{0};
    std::uint32_t graphics_queue_family{0};
    std::uint32_t present_queue_family{0};

    bool operator==(const NativeGpuSdkContextHandle&) const noexcept = default;
};

static_assert(sizeof(NativeGpuSdkContextHandle) == 72U);

'''
          replace_once('src/native_window_swapchain.hpp', duplicate_context, '')
          replace_once(
              'src/native_window_swapchain.hpp',
              '#include <mutex>\n',
              '#include <memory>\n#include <mutex>\n')
          replace_once(
              'src/native_window_swapchain.hpp',
              '''NativeWindowSwapchainCapabilities default_native_window_swapchain_capabilities(
''',
              '''std::unique_ptr<NativeWindowSwapchainApi>
make_direct3d12_native_window_swapchain_api() noexcept;

bool native_window_swapchain_build_has_backend(
    NativeGpuApiKind kind,
    NativeWindowSystem system) noexcept;

NativeWindowSwapchainCapabilities default_native_window_swapchain_capabilities(
''')
          replace_once(
              'src/native_gpu_sdk_execution.cpp',
              '''ReferenceNativeGpuSdkApi::ReferenceNativeGpuSdkApi(NativeGpuApiKind kind) noexcept
''',
              '''bool NativeGpuSdkApi::export_context(
    NativeGpuSdkContextHandle* context,
    NativeGpuSdkError* error) noexcept {
    clear_error(error);
    if (context == nullptr) {
        return fail(error, NativeGpuSdkErrorKind::InvalidInput,
                    "native GPU context output is null");
    }
    *context = {};
    return fail(error, NativeGpuSdkErrorKind::UnsupportedBackend,
                "native GPU context export is unavailable for this backend");
}

ReferenceNativeGpuSdkApi::ReferenceNativeGpuSdkApi(NativeGpuApiKind kind) noexcept
''')
          replace_once(
              'src/native_gpu_sdk_execution_d3d12.cpp',
              '#include <array>\n',
              '#include <array>\n#include <cstdint>\n')
          replace_once(
              'src/native_gpu_sdk_execution_d3d12.cpp',
              'snapshot_.probe.flags = kNativeGpuSdkOffscreenSurface;\n',
              '''snapshot_.probe.flags = kNativeGpuSdkOffscreenSurface |
                                kNativeGpuSdkWindowSurface;
''')
          replace_once(
              'src/native_gpu_sdk_execution_d3d12.cpp',
              '''    NativeGpuSdkProbe probe() noexcept override {
        std::lock_guard<std::mutex> lock(mutex_);
        return snapshot_.probe;
    }

    bool initialize(
''',
              '''    NativeGpuSdkProbe probe() noexcept override {
        std::lock_guard<std::mutex> lock(mutex_);
        return snapshot_.probe;
    }

    bool export_context(
        NativeGpuSdkContextHandle* context,
        NativeGpuSdkError* error) noexcept override {
        std::lock_guard<std::mutex> lock(mutex_);
        clear_error(error);
        if (context == nullptr) {
            return fail(error, NativeGpuSdkErrorKind::InvalidInput,
                        "Direct3D 12 context output is null");
        }
        if (!initialized_ || factory_ == nullptr || adapter_ == nullptr ||
            device_ == nullptr || queue_ == nullptr) {
            *context = {};
            return fail(error, NativeGpuSdkErrorKind::RuntimeUnavailable,
                        "Direct3D 12 device context is not initialized");
        }
        *context = {};
        context->api_kind = NativeGpuApiKind::Direct3D12;
        context->flags =
            kNativeGpuSdkContextDeviceValid |
            kNativeGpuSdkContextGraphicsQueueValid |
            kNativeGpuSdkContextPresentQueueValid |
            kNativeGpuSdkContextSharedGraphicsPresentQueue;
        if ((snapshot_.probe.flags & kNativeGpuSdkSoftwareDevice) != 0U) {
            context->flags |= kNativeGpuSdkContextSoftwareDevice;
        }
        context->device_generation = config_.device_generation;
        context->runtime_generation = config_.runtime_generation;
        context->instance_or_factory = static_cast<std::uint64_t>(
            reinterpret_cast<std::uintptr_t>(factory_.Get()));
        context->physical_device_or_adapter = static_cast<std::uint64_t>(
            reinterpret_cast<std::uintptr_t>(adapter_.Get()));
        context->device = static_cast<std::uint64_t>(
            reinterpret_cast<std::uintptr_t>(device_.Get()));
        context->graphics_queue = static_cast<std::uint64_t>(
            reinterpret_cast<std::uintptr_t>(queue_.Get()));
        context->present_queue = context->graphics_queue;
        return true;
    }

    bool initialize(
''')
          replace_once(
              'src/native_gpu_sdk_execution_d3d12.cpp',
              '''        snapshot_.probe.flags = kNativeGpuSdkRealDevice |
                                kNativeGpuSdkOffscreenSurface;
''',
              '''        snapshot_.probe.flags = kNativeGpuSdkRealDevice |
                                kNativeGpuSdkOffscreenSurface |
                                kNativeGpuSdkWindowSurface;
''')
          Path('.z2f8b2_patch_pending').unlink()
          PY
      - name: Commit and push ABI patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Z2F-8B2A: export D3D12 native context"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
