name: z2-native-window-swapchain

on:
  pull_request:
    paths:
      - '.github/workflows/z2-native-window-swapchain.yml'
      - '.z2f8b2_patch_pending'
      - 'tools/z2f8b2_apply_abi_patch.py'
      - 'src/native_window_swapchain*'

permissions:
  contents: write

jobs:
  publish-z2f8b2a-abi:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact ABI patch
        run: python3 tools/z2f8b2_apply_abi_patch.py
      - name: Commit and push ABI patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Z2F-8B2A: export D3D12 native context"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
