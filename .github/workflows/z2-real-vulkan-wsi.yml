name: z2-real-vulkan-wsi

on:
  pull_request:
    paths:
      - '.github/workflows/z2-real-vulkan-wsi.yml'
      - 'cmake/native_vulkan_wsi.cmake'
      - 'cmake/native_window_swapchain.cmake'
      - 'src/native_vulkan_wsi*'
      - 'src/native_gpu_sdk_execution_vulkan_wsi.cpp'
      - 'src/native_window_swapchain_vulkan*'
      - 'tests/native_vulkan_wsi_test_window*'
      - 'tests/native_window_swapchain_vulkan_tests.cpp'
      - 'docs/Z2F8B2B_REAL_VULKAN_WSI.md'
  workflow_dispatch:

concurrency:
  group: z2-real-vulkan-wsi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  xcb-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan, XCB, Wayland and shaping dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libharfbuzz-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libxcb1-dev libwayland-dev libwayland-bin \
            wayland-protocols xvfb weston
      - name: Select lavapipe ICD
        run: |
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Configure strict Vulkan WSI build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused XCB targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-native-window-swapchain-vulkan-tests \
            zevryon-native-window-swapchain-vulkan-benchmark \
            zevryon-native-window-swapchain-tests \
            zevryon-native-gpu-sdk-platform-smoke-tests \
            2>&1 | tee vulkan-wsi-xcb-build.log
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x720x24 >xvfb.log 2>&1 &
          echo $! > xvfb.pid
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "ZEVRYON_VULKAN_WSI_SYSTEM=xcb" >> "$GITHUB_ENV"
      - name: Repeat real XCB lifecycle certification
        run: |
          set -o pipefail
          for run in $(seq 1 10); do
            ./build/zevryon-native-window-swapchain-vulkan-tests
          done 2>&1 | tee vulkan-wsi-xcb-repeat.log
      - name: Run three real-present benchmark distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-native-window-swapchain-vulkan-benchmark 256 \
              > "vulkan-wsi-benchmark-${run}.txt"
          done
      - name: Enforce exact topology, memory and latency gates
        run: |
          python3 - <<'PY'
          def load(path):
              row = {}
              with open(path, encoding='utf-8') as handle:
                  for line in handle:
                      key, value = line.strip().split('=', 1)
                      row[key] = value
              return row

          rows = [load(f'vulkan-wsi-benchmark-{run}.txt') for run in range(1, 4)]
          for row in rows:
              assert int(row['iterations']) == 256
              assert int(row['samples']) == 256
              assert int(row['presented']) == 256
              assert int(row['suboptimal']) == 0
              assert int(row['surface_bytes']) == 2_764_800
              assert int(row['peak_in_flight_bytes']) == 921_600
              assert int(row['checksum']) == 12_529_228_277_956_645_091
              assert int(row['software_device']) == 1
              p50 = float(row['p50_ms'])
              p95 = float(row['p95_ms'])
              p99 = float(row['p99_ms'])
              maximum = float(row['max_ms'])
              assert 0.0 < p50 <= p95 <= p99 <= maximum
              assert p95 <= 20.0, row
              assert p99 <= 25.0, row
              assert maximum <= 50.0, row
          print({
              'p50_ms': [float(row['p50_ms']) for row in rows],
              'p95_ms': [float(row['p95_ms']) for row in rows],
              'p99_ms': [float(row['p99_ms']) for row in rows],
              'maximum_ms': [float(row['max_ms']) for row in rows],
              'checksum': int(rows[0]['checksum']),
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-real-vulkan-wsi-xcb-${{ github.sha }}
          path: |
            vulkan-wsi-xcb-build.log
            vulkan-wsi-xcb-repeat.log
            vulkan-wsi-benchmark-*.txt
            xvfb.log
          if-no-files-found: warn

  wayland-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan, Wayland and Weston dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libharfbuzz-dev \
            libvulkan-dev mesa-vulkan-drivers \
            libxcb1-dev libwayland-dev libwayland-bin \
            wayland-protocols weston
      - name: Select lavapipe ICD
        run: |
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Configure and build Wayland target
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-native-window-swapchain-vulkan-tests \
            2>&1 | tee vulkan-wsi-wayland-build.log
      - name: Start headless Weston
        run: |
          runtime="$RUNNER_TEMP/zevryon-xdg-runtime"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-z2" >> "$GITHUB_ENV"
          echo "ZEVRYON_VULKAN_WSI_SYSTEM=wayland" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime" weston \
            --backend=headless-backend.so \
            --socket=wayland-z2 \
            --idle-time=0 \
            --log=weston.log &
          echo $! > weston.pid
          for attempt in $(seq 1 30); do
            test -S "$runtime/wayland-z2" && exit 0
            sleep 1
          done
          cat weston.log
          exit 1
      - name: Repeat real Wayland lifecycle certification
        run: |
          set -o pipefail
          for run in $(seq 1 10); do
            ./build/zevryon-native-window-swapchain-vulkan-tests
          done 2>&1 | tee vulkan-wsi-wayland-repeat.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-real-vulkan-wsi-wayland-${{ github.sha }}
          path: |
            vulkan-wsi-wayland-build.log
            vulkan-wsi-wayland-repeat.log
            weston.log
          if-no-files-found: warn

  sanitizer-xcb:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libharfbuzz-dev \
            libvulkan-dev mesa-vulkan-drivers \
            libxcb1-dev libwayland-dev libwayland-bin \
            wayland-protocols xvfb
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DZEVRYON_ENABLE_SANITIZERS=ON
      - name: Build focused sanitizer target
        run: >-
          cmake --build build-sanitized --parallel 2 --target
          zevryon-native-window-swapchain-vulkan-tests
      - name: Run real XCB path under ASan and UBSan
        env:
          DISPLAY: :98
          ZEVRYON_VULKAN_WSI_SYSTEM: xcb
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          export VK_ICD_FILENAMES="$icd"
          Xvfb :98 -screen 0 1280x720x24 >xvfb-sanitizer.log 2>&1 &
          sleep 2
          ./build-sanitized/zevryon-native-window-swapchain-vulkan-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-real-vulkan-wsi-sanitizer-${{ github.sha }}
          path: xvfb-sanitizer.log
          if-no-files-found: warn

  windows-vulkan-sdk:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version=1.4.350 -y --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          "VULKAN_SDK=$env:VULKAN_SDK" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure standalone Windows Vulkan WSI build
        shell: pwsh
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=OFF
      - name: Compile Win32 surface and swapchain path
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target zevryon-native-window-swapchain-vulkan-tests
          cmake --build build --config Release --parallel 2 --target zevryon-native-window-swapchain-vulkan-benchmark
          cmake --build build --config Release --parallel 2 --target zevryon-native-window-swapchain-tests
