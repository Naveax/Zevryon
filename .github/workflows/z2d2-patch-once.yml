name: z2d2-patch-once

on:
  push:
    branches:
      - work/z2d-bounded-width-line-selection

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2d-bounded-width-line-selection
          fetch-depth: 0
      - name: Parenthesize braced REQUIRE operands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/line_selection_tests.cpp')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'REQUIRE(output.lines[0] == SelectedLineRecord{\n        8U,\n        2U,\n        kSelectedLineSoftBreak});',
              'REQUIRE(output.lines[0] == (SelectedLineRecord{\n        8U,\n        2U,\n        kSelectedLineSoftBreak}));')
          text = text.replace(
              'REQUIRE(output.lines[1] == SelectedLineRecord{\n        8U,\n        4U,\n        kSelectedLineMandatoryBreak | kSelectedLineTextEnd});',
              'REQUIRE(output.lines[1] == (SelectedLineRecord{\n        8U,\n        4U,\n        kSelectedLineMandatoryBreak | kSelectedLineTextEnd}));')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/line_selection_tests.cpp
          git commit -m "Z2D-2: parenthesize braced test operands"
          git push origin HEAD:work/z2d-bounded-width-line-selection
