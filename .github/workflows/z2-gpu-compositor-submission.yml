name: z2-gpu-compositor-submission

on:
  push:
    branches:
      - work/z2f-bounded-gpu-residency-compositor
  pull_request:
    paths:
      - '.github/workflows/z2-gpu-compositor-submission.yml'
      - 'cmake/gpu_compositor_submission.cmake'
      - 'cmake/device_raster_backend.cmake'
      - 'src/gpu_compositor_submission.*'
      - 'src/device_raster_backend.*'
      - 'src/glyph_atlas_submission.*'
      - 'src/text_paint_command_stream.*'
      - 'src/resource_ledger.*'
      - 'src/ledger_memory_resource.*'
      - 'tests/gpu_compositor_submission_tests.cpp'
      - 'tests/gpu_compositor_equivalence_tests.cpp'
      - 'docs/Z2F4_BOUNDED_GPU_RESIDENCY_COMPOSITOR_SUBMISSION.md'
  workflow_dispatch:

concurrency:
  group: z2-gpu-compositor-submission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-gpu-compositor-submission-tests \
            zevryon-gpu-compositor-equivalence-tests \
            zevryon-gpu-compositor-submission-benchmark \
            zevryon-device-raster-backend-tests \
            2>&1 | tee gpu-compositor-build.log
      - name: Repeat focused certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^gpu-compositor-submission-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee gpu-compositor-repeat.log
      - name: Run state and command-order oracle
        run: |
          set -o pipefail
          ctest --test-dir build -R '^gpu-compositor-equivalence-tests$' \
            --output-on-failure 2>&1 | tee gpu-compositor-equivalence.log
      - name: Run three independent distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-gpu-compositor-submission-benchmark \
              > "gpu-compositor-benchmark-${run}.json"
          done
      - name: Enforce structural and memory gates
        run: |
          python3 - <<'PY'
          import json

          rows = []
          for run in range(1, 4):
              with open(f'gpu-compositor-benchmark-{run}.json', encoding='utf-8') as handle:
                  row = json.load(handle)
              assert row['schema'] == 'zevryon.gpu-compositor-submission-benchmark.v1'
              assert row['input_document_lines'] == 16_384
              assert row['input_projected_lines'] == 80
              assert row['input_atlas_uploads'] == 93
              assert row['input_draw_instances'] == 310
              assert row['input_draw_batches'] == 3
              assert row['selection_commands'] == 64
              assert row['caret_commands'] == 1
              assert row['texture_pages'] == 3
              assert row['cold_texture_upload_commands'] == 3
              assert row['warm_texture_upload_commands'] == 0
              assert row['glyph_draw_packets'] == 3
              assert row['fill_rect_packets'] == 65
              assert row['compositor_commands'] == 68
              assert row['cold_frame_fence'] == 1
              assert row['warm_frame_fence'] == 2
              assert row['texture_handle_bytes'] == 32
              assert row['residency_record_bytes'] == 72
              assert row['upload_command_bytes'] == 72
              assert row['draw_packet_bytes'] == 64
              assert row['fill_packet_bytes'] == 48
              assert row['command_record_bytes'] == 16
              assert row['frame_receipt_bytes'] == 48
              assert row['output_current_bytes'] == 4_648
              assert row['output_peak_bytes'] == 4_652
              assert row['output_hard_limit_bytes'] == 4_652
              assert 0 < row['cache_current_bytes'] <= row['cache_hard_limit_bytes'] == 624
              assert row['cache_peak_bytes'] <= 624
              assert row['cache_textures'] == 3
              assert row['cache_in_flight_frames'] == 1
              assert row['checksum'] != 0
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 8.0, row
              assert row['p99_ms'] <= 12.0, row
              assert row['maximum_ms'] <= 25.0, row
              rows.append(row)
          assert len({row['checksum'] for row in rows}) == 1
          assert len({row['cache_current_bytes'] for row in rows}) == 1
          assert len({row['cache_peak_bytes'] for row in rows}) == 1
          print({
              'checksum': rows[0]['checksum'],
              'cache_current_bytes': rows[0]['cache_current_bytes'],
              'cache_peak_bytes': rows[0]['cache_peak_bytes'],
              'p50_ms': [row['p50_ms'] for row in rows],
              'p95_ms': [row['p95_ms'] for row in rows],
              'p99_ms': [row['p99_ms'] for row in rows],
              'maximum_ms': [row['maximum_ms'] for row in rows],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-gpu-compositor-submission-${{ github.sha }}
          path: |
            gpu-compositor-build.log
            gpu-compositor-repeat.log
            gpu-compositor-equivalence.log
            gpu-compositor-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests
        run: >-
          cmake --build build-sanitized --parallel 2 --target
          zevryon-gpu-compositor-submission-tests
          zevryon-gpu-compositor-equivalence-tests
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^gpu-compositor-(submission|equivalence)-tests$' --output-on-failure

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build benchmark and focused tests
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-gpu-compositor-submission-tests \
            zevryon-gpu-compositor-equivalence-tests \
            zevryon-gpu-compositor-submission-benchmark \
            2>&1 | tee apple-gpu-compositor-build.log
          ctest --test-dir build -R '^gpu-compositor-(submission|equivalence)-tests$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-gpu-compositor-appleclang-${{ github.sha }}
          path: apple-gpu-compositor-build.log
          if-no-files-found: warn
