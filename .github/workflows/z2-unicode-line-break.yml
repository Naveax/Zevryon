name: z2-unicode-line-break

on:
  pull_request:
    paths:
      - '.github/workflows/z2-unicode-line-break.yml'
      - 'cmake/harfbuzz_shaping.cmake'
      - 'cmake/unicode_line_break.cmake'
      - 'src/unicode_line_break_*'
      - 'src/line_break_*'
      - 'src/resource_ledger.*'
      - 'tests/line_break_*'
      - 'docs/Z2D1_UNICODE_LINE_BREAK_OPPORTUNITIES.md'
  workflow_dispatch:

concurrency:
  group: z2-unicode-line-break-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build focused targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-line-break-opportunity-tests
          zevryon-line-break-conformance
          zevryon-line-break-opportunity-benchmark
      - name: Repeat focused tests
        run: >-
          ctest --test-dir build -R '^line-break-opportunity-tests$'
          --repeat until-fail:20 --output-on-failure
      - name: Download official Unicode 17 LineBreakTest
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request
          from pathlib import Path

          url = 'https://www.unicode.org/Public/17.0.0/ucd/auxiliary/LineBreakTest.txt'
          data = urllib.request.urlopen(url, timeout=90).read()
          if not data.startswith(b'# LineBreakTest-17.0.0.txt'):
              raise RuntimeError('unexpected LineBreakTest Unicode version')
          path = Path('evidence/ci/LineBreakTest-17.0.0.txt')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          print({'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          PY
      - name: Run complete Unicode 17 line-break conformance
        run: >-
          build/zevryon-line-break-conformance
          evidence/ci/LineBreakTest-17.0.0.txt
          > evidence/ci/z2-line-break-conformance.json
      - name: Run three independent 64 KiB distributions
        run: |
          for run in 1 2 3; do
            build/zevryon-line-break-opportunity-benchmark 256 \
              > "evidence/ci/z2-line-break-benchmark-${run}.json"
          done
      - name: Enforce correctness, memory and latency gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('evidence/ci')
          conformance = json.loads(
              (root / 'z2-line-break-conformance.json').read_text())
          assert conformance['schema'] == 'zevryon.line-break-conformance.v1'
          assert conformance['unicode_version'] == '17.0.0'
          assert conformance['tests'] == 19338
          assert conformance['parse_failures'] == 0
          assert conformance['build_failures'] == 0
          assert conformance['failures'] == 0
          assert conformance['passed'] is True

          rows = [
              json.loads((root / f'z2-line-break-benchmark-{run}.json').read_text())
              for run in range(1, 4)
          ]
          for row in rows:
              assert row['schema'] == 'zevryon.line-break-opportunity-benchmark.v1'
              assert row['unicode_version'] == '17.0.0'
              assert row['fixture_bytes'] == 65536
              assert row['input_codepoints'] == 37888
              assert row['input_clusters'] == 36864
              assert row['output_boundaries'] == 36865
              assert row['record_bytes'] == 1
              assert row['significant_clusters'] == 36864
              assert row['ignored_combining_clusters'] == 0
              assert row['mandatory_boundaries'] == 1025
              assert row['allowed_boundaries'] == 9216
              assert row['prohibited_boundaries'] == 26624
              assert row['current_bytes'] == 36865
              assert row['peak_bytes'] == 331777
              assert row['hard_limit_bytes'] == 524288
              assert row['checksum'] == 16007526823600892979
              assert row['rejected_reservations'] == 0
              assert row['accounting_clean'] is True
              assert row['within_hard_limits'] is True
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 5.0, row
              assert row['p99_ms'] <= 8.0, row
              assert row['maximum_ms'] <= 12.0, row
          assert len({row['checksum'] for row in rows}) == 1
          print(json.dumps({'conformance': conformance, 'benchmarks': rows}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-unicode-line-break-${{ github.sha }}
          path: evidence/ci/
          if-no-files-found: warn

  ubuntu-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests
        run: cmake --build build-sanitized --parallel 2 --target zevryon-line-break-opportunity-tests
      - name: Run focused tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^line-break-opportunity-tests$' --output-on-failure

  appleclang-strict:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 2 --target zevryon-line-break-opportunity-tests
      - run: ctest --test-dir build -R '^line-break-opportunity-tests$' --output-on-failure

  windows-asan:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC AddressSanitizer
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DZEVRYON_ENABLE_SANITIZERS=ON
      - name: Build focused target
        shell: pwsh
        run: |
          cmake --build build-asan --config RelWithDebInfo --target zevryon-line-break-opportunity-tests --parallel 2 2>&1 | Tee-Object -FilePath windows-line-break-asan-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage MSVC AddressSanitizer runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          $installation = (& $vswhere -latest -products * -property installationPath).Trim()
          if (-not $installation) { throw 'Visual Studio installation not found' }
          $patterns = @(
            "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan*dynamic-x86_64.dll",
            "$installation\VC\Tools\Llvm\x64\bin\clang_rt.asan*dynamic-x86_64.dll"
          )
          $runtimes = @($patterns | ForEach-Object {
            Get-ChildItem -Path $_ -File -ErrorAction SilentlyContinue
          })
          if (-not $runtimes) { throw 'MSVC AddressSanitizer runtime DLL not found' }
          $output = Resolve-Path '.\build-asan\RelWithDebInfo'
          $runtimes | Group-Object Name | ForEach-Object {
            $runtime = $_.Group | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            Copy-Item $runtime.FullName -Destination $output -Force
          }
      - name: Run focused test
        shell: pwsh
        run: |
          $env:ASAN_OPTIONS = 'halt_on_error=1:abort_on_error=1:symbolize=1'
          $process = Start-Process `
            -FilePath '.\build-asan\RelWithDebInfo\zevryon-line-break-opportunity-tests.exe' `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput 'windows-line-break-asan.stdout.log' `
            -RedirectStandardError 'windows-line-break-asan.stderr.log'
          Get-Content 'windows-line-break-asan.stdout.log' -ErrorAction SilentlyContinue
          Get-Content 'windows-line-break-asan.stderr.log' -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-z2-unicode-line-break-${{ github.sha }}
          path: windows-line-break-asan*.log
          if-no-files-found: warn
