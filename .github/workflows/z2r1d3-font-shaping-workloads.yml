name: Z2R Rust font and shaping workload certification

on:
  pull_request:
    paths:
      - '.github/workflows/z2r1d3-font-shaping-workloads.yml'
      - 'CMakeLists.txt'
      - 'cmake/rust_core.cmake'
      - 'cmake/coretext_discovery.cmake'
      - 'cmake/font_resource_sfnt.cmake'
      - 'cmake/harfbuzz_shaping.cmake'
      - 'rust/**'
      - 'src/resource_ledger.*'
      - 'src/ledger_memory_resource.*'
      - 'src/font_*'
      - 'src/*font*'
      - 'src/*harfbuzz*'
      - 'src/shaping_run_plan.*'
      - 'src/glyph_cluster_map.*'
      - 'src/caret_boundary_map.*'
      - 'tests/font_*'
      - 'tests/*font*'
      - 'tests/*harfbuzz*'
      - 'tests/shaping_run_plan_tests.cpp'
      - 'tests/glyph_cluster_map_tests.cpp'
      - 'tests/caret_boundary_map_tests.cpp'
      - 'tests/resource_ledger_tests.cpp'
      - 'tests/test_z2r1d3_font_certification.py'
      - 'scripts/massivedoc_benchmark.py'
      - 'scripts/z2r1d3_run_font_workloads.py'
      - 'scripts/z2r1d3_font_certification.py'
  workflow_dispatch:

concurrency:
  group: z2r1d3-font-shaping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  font-shaping-shadow-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native font and shaping dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libharfbuzz-dev \
            fonts-dejavu-core \
            fonts-noto-core

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Resolve deterministic font fixtures
        shell: bash
        run: |
          latin="$(fc-match -f '%{file}\n' 'DejaVu Sans' | head -n 1)"
          devanagari="$(fc-match -f '%{file}\n' 'Noto Sans Devanagari' | head -n 1)"
          test -s "$latin"
          test -s "$devanagari"
          echo "Z2R1D3_LATIN_FONT=$latin" >> "$GITHUB_ENV"
          echo "Z2R1D3_DEVANAGARI_FONT=$devanagari" >> "$GITHUB_ENV"
          sha256sum "$latin" "$devanagari"

      - name: Report toolchains
        run: |
          c++ --version
          cmake --version
          pkg-config --modversion harfbuzz fontconfig
          python --version
          rustc --version --verbose
          cargo --version

      - name: Test Z2R-1D3 certification contract
        run: python -m pytest -q tests/test_z2r1d3_font_certification.py

      - name: Configure authoritative C++ baseline
        run: >-
          cmake -S . -B build-z2r1d3-baseline
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DZEVRYON_RUST_LEDGER_SHADOW=OFF
          -DZEVRYON_ENABLE_FONTCONFIG_DISCOVERY=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON

      - name: Build baseline font and shaping graph
        run: cmake --build build-z2r1d3-baseline --parallel 2

      - name: Configure strict production Rust shadow
        run: >-
          cmake -S . -B build-z2r1d3-shadow
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=ON
          -DZEVRYON_RUST_LEDGER_SHADOW=ON
          -DZEVRYON_RUST_LEDGER_SHADOW_STRICT=ON
          -DZEVRYON_RUST_LEDGER_SHADOW_INTERVAL=256
          -DZEVRYON_ENABLE_FONTCONFIG_DISCOVERY=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON

      - name: Build strict-shadow font and shaping graph
        run: cmake --build build-z2r1d3-shadow --parallel 2

      - name: Emit exact 36-class Rust shadow probe
        shell: bash
        run: |
          mkdir -p evidence/z2r1d3
          build-z2r1d3-shadow/zevryon-resource-ledger-tests \
            --emit-rust-shadow-workload-probe \
            > evidence/z2r1d3/rust-shadow-workload-probe.json
          python -m json.tool evidence/z2r1d3/rust-shadow-workload-probe.json > /dev/null

      - name: Run authoritative baseline font and shaping workloads
        run: >-
          python scripts/z2r1d3_run_font_workloads.py
          --build-dir build-z2r1d3-baseline
          --latin-font "$Z2R1D3_LATIN_FONT"
          --devanagari-font "$Z2R1D3_DEVANAGARI_FONT"
          --mode baseline
          --samples 3
          --output evidence/z2r1d3/baseline.json

      - name: Run strict Rust-shadow font and shaping workloads
        run: >-
          python scripts/z2r1d3_run_font_workloads.py
          --build-dir build-z2r1d3-shadow
          --latin-font "$Z2R1D3_LATIN_FONT"
          --devanagari-font "$Z2R1D3_DEVANAGARI_FONT"
          --mode shadow
          --samples 3
          --output evidence/z2r1d3/shadow.json

      - name: Build fail-closed Z2R-1D3 manifest
        shell: bash
        run: |
          compiler="$(c++ --version | head -n 1)"
          python scripts/z2r1d3_font_certification.py \
            --baseline evidence/z2r1d3/baseline.json \
            --shadow evidence/z2r1d3/shadow.json \
            --probe evidence/z2r1d3/rust-shadow-workload-probe.json \
            --commit-sha "${{ github.sha }}" \
            --compiler "$compiler" \
            --build-type Release \
            --runner-os "${{ runner.os }}" \
            --max-p50-ratio 1.50 \
            --max-p95-ratio 1.50 \
            --max-wall-ratio 1.75 \
            --max-peak-pss-ratio 1.50 \
            --output evidence/z2r1d3/rust-shadow-certification-v1.json

      - name: Publish certification summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(
              Path('evidence/z2r1d3/rust-shadow-certification-v1.json').read_text()
          )
          print('## Z2R-1D3 font and shaping Rust-shadow certification')
          print()
          print(f"- Slice ready: `{report['slice_ready']}`")
          print(f"- Promotion ready: `{report['promotion_ready']}`")
          print(f"- Production tests: `{report['tests']['count']}`")
          print(f"- Shadow mismatches: `{report['probe']['mismatches']}`")
          print(f"- Manifest SHA-256: `{report['manifest_sha256']}`")
          print()
          print('| Workload | P50 ratio | P95 ratio | Wall ratio | Peak-PSS ratio | Passed |')
          print('|---|---:|---:|---:|---:|---:|')
          for item in report['workloads']:
              peak = item['peak_pss_ratio']
              peak_text = 'n/a' if peak is None else f'{peak:.4f}'
              print(
                  f"| {item['name']} | {item['p50_ratio']:.4f} | "
                  f"{item['p95_ratio']:.4f} | {item['wall_time_ratio']:.4f} | "
                  f"{peak_text} | {item['passed']} |"
              )
          PY

      - name: Upload Z2R-1D3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z2r1d3-font-shaping-${{ github.sha }}
          path: evidence/z2r1d3/
          if-no-files-found: error
