name: Z7 Data bogus-comment recovery builder

on:
  push:
    branches:
      - candidate/z7-data-bogus-comment-recovery-v1

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/z7-data-bogus-comment-recovery-v1

      - name: Apply production patch
        run: python3 scripts/apply_z7_data_bogus_comment_recovery_v1.py

      - name: Align invalid end-tag control error ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one correction anchor in {path}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          cpp = Path("src/html_tokenizer_data_tags_v1.cpp")
          replace_once(
              cpp,
              '''    bool consume_bogus_comment(
                  std::size_t* cursor,
                  std::size_t data_begin,
                  std::size_t error_offset,
                  std::string error_code) {''',
              '''    bool consume_bogus_comment(
                  std::size_t* cursor,
                  std::size_t data_begin,
                  std::size_t error_offset,
                  std::string error_code,
                  bool leading_control_error_emitted) {''',
          )
          replace_once(
              cpp,
              '''            if (ascii_control_parse_error(character) &&
                      !emit_parse_error(scan, "control-character-in-input-stream")) {''',
              '''            if (ascii_control_parse_error(character) &&
                      !(leading_control_error_emitted && scan == data_begin) &&
                      !emit_parse_error(scan, "control-character-in-input-stream")) {''',
          )
          replace_once(
              cpp,
              '''            return consume_bogus_comment(
                      cursor,
                      probe,
                      probe,
                      "unexpected-question-mark-instead-of-tag-name");''',
              '''            return consume_bogus_comment(
                      cursor,
                      probe,
                      probe,
                      "unexpected-question-mark-instead-of-tag-name",
                      false);''',
          )
          replace_once(
              cpp,
              '''            if (end_tag) {
                      return consume_bogus_comment(
                          cursor,
                          probe,
                          probe,
                          "invalid-first-character-of-tag-name");
                  }''',
              '''            if (end_tag) {
                      const bool leading_control_error_emitted =
                          ascii_control_parse_error(input_[probe]);
                      if (leading_control_error_emitted &&
                          !emit_parse_error(probe, "control-character-in-input-stream")) {
                          return false;
                      }
                      return consume_bogus_comment(
                          cursor,
                          probe,
                          probe,
                          "invalid-first-character-of-tag-name",
                          leading_control_error_emitted);
                  }''',
          )

          tests = Path("tests/html_tokenizer_data_tags_v1_tests.cpp")
          anchor = '''    {
                  CollectingSink sink;
                  std::string error;
                  if (!require(
                          tokenize_html_data_tags_v1("a<?b>c", {}, &sink, nullptr, &error),'''
          regression = r'''    {
                  CollectingSink sink;
                  std::string error;
                  const std::string input("</\v>", 4U);
                  if (!require(
                          tokenize_html_data_tags_v1(input, {}, &sink, nullptr, &error),
                          std::string("invalid end-tag control ordering: ") + error) ||
                      !require(sink.tokens.size() == 1U, "invalid end-tag control comment count") ||
                      !require(
                          sink.tokens[0].kind == HtmlTokenizerV1TokenKind::Comment &&
                              sink.tokens[0].data == std::string("\v", 1U),
                          "invalid end-tag control comment payload") ||
                      !require(sink.errors.size() == 2U, "invalid end-tag control error count") ||
                      !require(
                          sink.errors[0].code == "control-character-in-input-stream" &&
                              sink.errors[0].line == 1U && sink.errors[0].column == 3U,
                          "input-stream control error precedes end-tag state error") ||
                      !require(
                          sink.errors[1].code == "invalid-first-character-of-tag-name" &&
                              sink.errors[1].line == 1U && sink.errors[1].column == 3U,
                          "invalid end-tag state error follows control observation")) {
                      return false;
                  }
              }
'''
          replace_once(tests, anchor, regression + anchor)
          PY

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON

      - name: Build focused production targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-html-tokenizer-data-tags-v1-tests
          zevryon-html-tokenizer-token-stream-v1-probe

      - name: Run focused Data-tag tests
        run: ./build/zevryon-html-tokenizer-data-tags-v1-tests

      - name: Diagnose full-corpus movement before admission
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v6_baseline.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("census.json").read_text(encoding="utf-8"))
          summary = {
              "passed": report["passed"],
              "failed": report["failed"],
              "unsupported": report["unsupported"],
              "failure_samples": report.get("failure_samples", []),
              "reason_counts": report["reason_counts"],
              "file_reports": report["file_reports"],
          }
          print(json.dumps(summary, indent=2, ensure_ascii=False, sort_keys=True))
          assert report["files"] == 14, report
          assert report["tests"] == 6810, report
          assert report["executions"] == 7036, report
          assert report["passed"] == 6687, report
          assert report["failed"] == 122, report
          assert report["unsupported"] == 227, report
          assert report["passed"] + report["failed"] + report["unsupported"] == 7036, report
          PY

      - name: Verify v6 authority and full-corpus no-regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v6_baseline.py \
            --policy no-regression \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("census.json").read_text(encoding="utf-8"))
          assert report["passed"] == 6687, report
          assert report["failed"] == 122, report
          assert report["unsupported"] == 227, report
          reasons = report["reason_counts"]
          assert reasons.get("unsupported:production-fail-closed:HTML Data-tag tokenizer bogus-comment recovery is outside admitted v1 subset", 0) == 0, report
          assert reasons.get("unsupported:production-fail-closed:HTML Data-tag tokenizer bogus-comment end-tag recovery is outside admitted v1 subset", 0) == 0, report
          assert report["baseline_policy"] == "no-regression", report
          assert report["baseline_regression_free"] is True, report
          assert report["full_corpus_pass_claim"] is False, report
          assert report["html_tokenizer_conformance_claim"] is False, report
          assert report["z7_status_change"] is False, report
          print(json.dumps(report, indent=2, ensure_ascii=False, sort_keys=True))
          PY

      - name: Commit tested production diff and self-clean builder
        shell: bash
        run: |
          set -euo pipefail
          rm -f census.json
          rm -f .github/workflows/z7_data_bogus_comment_builder.yml
          rm -f scripts/apply_z7_data_bogus_comment_recovery_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/html_tokenizer_data_tags_v1.cpp \
                  src/html_tokenizer_data_tags_v1.hpp \
                  src/html_tokenizer_data_stream_v1.cpp \
                  tests/html_tokenizer_data_tags_v1_tests.cpp \
                  docs/Z7_HTML_TOKENIZER_DATA_TAGS_V1.md \
                  .github/workflows/z7_data_bogus_comment_builder.yml \
                  scripts/apply_z7_data_bogus_comment_recovery_v1.py
          git diff --cached --quiet && { echo "builder produced no diff" >&2; exit 1; }
          git commit -m "Z7: admit bounded Data bogus-comment recovery"
          git push origin HEAD:candidate/z7-data-bogus-comment-recovery-v1
