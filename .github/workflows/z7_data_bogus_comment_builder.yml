name: Z7 Data bogus-comment recovery builder

on:
  push:
    branches:
      - candidate/z7-data-bogus-comment-recovery-v1

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/z7-data-bogus-comment-recovery-v1

      - name: Apply production patch
        run: python3 scripts/apply_z7_data_bogus_comment_recovery_v1.py

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON

      - name: Build focused production targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-html-tokenizer-data-tags-v1-tests
          zevryon-html-tokenizer-token-stream-v1-probe

      - name: Run focused Data-tag tests
        run: ./build/zevryon-html-tokenizer-data-tags-v1-tests

      - name: Verify v6 authority and full-corpus no-regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v6_baseline.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v6_baseline.py \
            --policy no-regression \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("census.json").read_text(encoding="utf-8"))
          assert report["files"] == 14, report
          assert report["tests"] == 6810, report
          assert report["executions"] == 7036, report
          assert report["passed"] > 6632, report
          assert report["failed"] <= 122, report
          assert report["unsupported"] < 282, report
          assert report["passed"] + report["failed"] + report["unsupported"] == 7036, report
          assert report["baseline_policy"] == "no-regression", report
          assert report["baseline_regression_free"] is True, report
          reasons = report["reason_counts"]
          assert reasons.get("unsupported:production-fail-closed:HTML Data-tag tokenizer bogus-comment recovery is outside admitted v1 subset", 0) == 0, report
          assert reasons.get("unsupported:production-fail-closed:HTML Data-tag tokenizer bogus-comment end-tag recovery is outside admitted v1 subset", 0) == 0, report
          assert report["full_corpus_pass_claim"] is False, report
          assert report["html_tokenizer_conformance_claim"] is False, report
          assert report["z7_status_change"] is False, report
          print(json.dumps(report, indent=2, ensure_ascii=False, sort_keys=True))
          PY

      - name: Commit tested production diff and self-clean builder
        shell: bash
        run: |
          set -euo pipefail
          rm -f census.json
          rm -f .github/workflows/z7_data_bogus_comment_builder.yml
          rm -f scripts/apply_z7_data_bogus_comment_recovery_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/html_tokenizer_data_tags_v1.cpp \
                  src/html_tokenizer_data_tags_v1.hpp \
                  src/html_tokenizer_data_stream_v1.cpp \
                  tests/html_tokenizer_data_tags_v1_tests.cpp \
                  docs/Z7_HTML_TOKENIZER_DATA_TAGS_V1.md \
                  .github/workflows/z7_data_bogus_comment_builder.yml \
                  scripts/apply_z7_data_bogus_comment_recovery_v1.py
          git diff --cached --quiet && { echo "builder produced no diff" >&2; exit 1; }
          git commit -m "Z7: admit bounded Data bogus-comment recovery"
          git push origin HEAD:candidate/z7-data-bogus-comment-recovery-v1
