name: Windows and Linux CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "work/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-backend-removal-guard:
    name: Apple backend removal guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify removed Apple surface stays removed
        run: python3 scripts/check_no_apple_backends.py .

  z2r3eu-linux-authority:
    name: Z2R-3E-U Linux Unicode authority
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate exact-head Unicode authority
        run: >-
          python3 scripts/z2r3e_validate_unicode_authority.py
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform linux
          --compiler gcc-release
          --output evidence/z2r3eu/linux-authority-validation.json
      - name: Measure exact-head Unicode authority
        run: >-
          python3 scripts/z2r3e_measure_unicode_authority.py
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform linux
          --compiler gcc-release
          --output evidence/z2r3eu/linux-performance-validation.json
      - name: Upload Linux authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z2r3eu-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/z2r3eu
          if-no-files-found: warn

  z2r3eu-windows-authority:
    name: Z2R-3E-U Windows Unicode authority
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate exact-head Unicode authority
        shell: pwsh
        run: >-
          python scripts/z2r3e_validate_unicode_authority.py
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform windows
          --compiler msvc-release
          --output evidence/z2r3eu/windows-authority-validation.json
      - name: Measure exact-head Unicode authority
        shell: pwsh
        run: >-
          python scripts/z2r3e_measure_unicode_authority.py
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform windows
          --compiler msvc-release
          --output evidence/z2r3eu/windows-performance-validation.json
      - name: Upload Windows authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z2r3eu-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/z2r3eu
          if-no-files-found: warn

  linux-build-test:
    name: Linux build and headless tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            pkg-config \
            libfontconfig1-dev \
            libharfbuzz-dev \
            fonts-dejavu-core \
            fonts-noto-core
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DZEVRYON_ENABLE_RUST_CORE=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build all targets
        run: cmake --build build --parallel 2
      - name: Run headless test suite
        run: >-
          ctest --test-dir build --output-on-failure
          -E "(native-gpu-sdk-platform-smoke|d3d12|vulkan)"

  windows-build-test:
    name: Windows build and headless tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=ON `
            -DZEVRYON_ENABLE_RUST_CORE=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build all targets
        shell: pwsh
        run: cmake --build build --config Release --parallel 2
      - name: Run headless test suite
        shell: pwsh
        run: >-
          ctest --test-dir build -C Release --output-on-failure
          -E "(native-gpu-sdk-platform-smoke|d3d12|vulkan)"
