name: Windows and Linux CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "work/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-backend-removal-guard:
    name: Apple backend removal guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify removed Apple surface stays removed
        run: python3 scripts/check_no_apple_backends.py .

  z2r3eu-linux-authority:
    name: Z2R-3E-U Linux Unicode authority
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate exact-head Unicode authority
        run: >-
          python3 scripts/z2r3e_validate_unicode_authority.py
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform linux
          --compiler gcc-release
          --output evidence/z2r3eu/linux-authority-validation.json
      - name: Measure exact-head Unicode authority
        run: >-
          python3 scripts/z2r3e_measure_unicode_authority.py
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform linux
          --compiler gcc-release
          --output evidence/z2r3eu/linux-performance-validation.json
      - name: Upload Linux authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z2r3eu-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/z2r3eu
          if-no-files-found: warn

  z2r3eu-windows-authority:
    name: Z2R-3E-U Windows Unicode authority
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate exact-head Unicode authority
        shell: pwsh
        run: >-
          python scripts/z2r3e_validate_unicode_authority.py
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform windows
          --compiler msvc-release
          --output evidence/z2r3eu/windows-authority-validation.json
      - name: Measure exact-head Unicode authority
        shell: pwsh
        run: >-
          python scripts/z2r3e_measure_unicode_authority.py
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform windows
          --compiler msvc-release
          --output evidence/z2r3eu/windows-performance-validation.json
      - name: Upload Windows authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z2r3eu-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/z2r3eu
          if-no-files-found: warn

  linux-build-test:
    name: Linux build and headless tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            pkg-config \
            libfontconfig1-dev \
            libharfbuzz-dev \
            fonts-dejavu-core \
            fonts-noto-core
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DZEVRYON_ENABLE_RUST_CORE=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build all targets
        run: cmake --build build --parallel 2
      - name: Run headless test suite
        run: >-
          ctest --test-dir build --output-on-failure
          -E "(native-gpu-sdk-platform-smoke|d3d12|vulkan)"
      - name: Write M5 exact-head CI evidence
        run: >-
          python3 scripts/write_m5_ci_evidence.py
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform linux
          --compiler gcc-release
          --build-dir build
          --output evidence/m5/ci/linux.json
      - name: Upload M5 Linux exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-ci-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/m5/ci/linux.json
          if-no-files-found: warn
      - name: Run M3 legacy 4 GiB open gate
        run: >-
          python3 scripts/m3_legacy_4gib_open_gate.py
          --probe build/zevryon-massivedoc-legacy-open-probe
          --work-dir build/m3-legacy-4gib-open
          --output evidence/m3/legacy-4gib-open.json
      - name: Run M3 cold-store PSS gate
        run: >-
          python3 scripts/m3_cold_store_pss_gate.py
          --probe build/zevryon-massivedoc-cold-pss-probe
          --work-dir build/m3-cold-store-pss
          --output evidence/m3/cold-store-pss.json
      - name: Upload M3 storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-storage-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/m3
          if-no-files-found: warn

  windows-build-test:
    name: Windows build and headless tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=ON `
            -DZEVRYON_ENABLE_RUST_CORE=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build all targets
        shell: pwsh
        run: cmake --build build --config Release --parallel 2
      - name: Run headless test suite
        shell: pwsh
        run: >-
          ctest --test-dir build -C Release --output-on-failure
          -E "(native-gpu-sdk-platform-smoke|d3d12|vulkan)"
      - name: Write M5 exact-head CI evidence
        shell: pwsh
        run: >-
          python scripts/write_m5_ci_evidence.py
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform windows
          --compiler msvc-release
          --build-dir build
          --config Release
          --output evidence/m5/ci/windows.json
      - name: Upload M5 Windows exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-ci-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/m5/ci/windows.json
          if-no-files-found: warn

  m6-linux-i386-address-space-gate:
    name: M6 Linux i386 address-space gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install i386 compiler support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-multilib
      - name: Compile real i386 file-offset surfaces
        run: |
          mkdir -p build-i386
          COMMON_FLAGS="-m32 -std=c++20 -D_FILE_OFFSET_BITS=64 -Isrc -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror"
          g++ $COMMON_FLAGS -c tests/massivedoc_linux_i386_abi_compile.cpp -o build-i386/abi-probe.o
          g++ $COMMON_FLAGS -fsyntax-only src/massivedoc_positional_io.cpp
          g++ $COMMON_FLAGS -fsyntax-only src/massivedoc_cold_window.cpp
          g++ $COMMON_FLAGS -fsyntax-only src/massivedoc_exact_match.cpp

  m6-win32-address-space-gate:
    name: M6 Win32 address-space gate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure real Win32 build
        shell: pwsh
        run: |
          cmake -S . -B build-win32 -G "Visual Studio 17 2022" -A Win32 `
            -DBUILD_TESTING=ON `
            -DZEVRYON_ENABLE_RUST_CORE=OFF `
            -DZEVRYON_ENABLE_DIRECTWRITE_DISCOVERY=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused Win32 storage targets
        shell: pwsh
        run: >-
          cmake --build build-win32 --config Release --parallel 2 --target
          zevryon-massivedoc-address-space-policy-tests
          zevryon-massivedoc-positional-io-tests
          zevryon-massivedoc-positional-store-tests
          zevryon-massivedoc-cold-window-tests
      - name: Run focused Win32 storage tests
        shell: pwsh
        run: >-
          ctest --test-dir build-win32 -C Release --output-on-failure
          -R "(massivedoc-address-space-policy-tests|massivedoc-positional-io-tests|massivedoc-positional-store-tests|massivedoc-cold-window-tests)"
