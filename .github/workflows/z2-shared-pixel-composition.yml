name: z2-shared-pixel-composition

on:
  pull_request:
    paths:
      - '.github/workflows/z2-shared-pixel-composition.yml'
      - 'cmake/shared_pixel_compositor.cmake'
      - 'cmake/native_window_swapchain.cmake'
      - 'src/native_window_pixel_buffer.hpp'
      - 'src/shared_pixel_compositor*'
      - 'tests/shared_pixel_compositor*'
      - 'src/native_window_swapchain*'
      - 'docs/Z2F8B3A_SHARED_PIXEL_COMPOSITION.md'
  workflow_dispatch:

concurrency:
  group: z2-shared-pixel-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused targets
        run: |
          cmake --build build --parallel 2 --target \
            zevryon-shared-pixel-compositor-tests \
            zevryon-shared-pixel-compositor-equivalence-tests \
            zevryon-shared-pixel-compositor-benchmark
      - name: Repeat functional certification
        run: for run in $(seq 1 20); do ./build/zevryon-shared-pixel-compositor-tests; done
      - name: Run 4096-case independent oracle
        run: ./build/zevryon-shared-pixel-compositor-equivalence-tests
      - name: Run three benchmark distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-shared-pixel-compositor-benchmark 256 > "shared-pixel-benchmark-${run}.txt"
          done
      - name: Enforce exact topology, memory and latency gates
        run: |
          python3 - <<'PY'
          def load(path):
              row = {}
              with open(path, encoding='utf-8') as handle:
                  for line in handle:
                      key, value = line.strip().split('=', 1)
                      row[key] = value
              return row

          rows = [load(f'shared-pixel-benchmark-{run}.txt') for run in range(1, 4)]
          for row in rows:
              assert int(row['iterations']) == 256
              assert int(row['samples']) == 256
              assert int(row['commands']) == 68
              assert int(row['fill_rects']) == 65
              assert int(row['glyph_batches']) == 3
              assert int(row['draw_instances']) == 240
              assert int(row['cold_uploads']) == 3
              assert int(row['payload_bytes']) == 32768
              assert int(row['surface_bytes']) == 921600
              assert int(row['atlas_bytes']) == 49152
              assert int(row['selection_pixels']) == 87040
              assert int(row['caret_pixels']) == 640
              assert int(row['alpha_glyph_pixels']) == 5120
              assert int(row['lcd_glyph_pixels']) == 5120
              assert int(row['color_glyph_pixels']) == 5120
              assert int(row['checksum']) == 17057955876043375715
              p50 = float(row['p50_ms'])
              p95 = float(row['p95_ms'])
              p99 = float(row['p99_ms'])
              maximum = float(row['max_ms'])
              assert 0.0 < p50 <= p95 <= p99 <= maximum
              assert p95 <= 20.0, row
              assert p99 <= 30.0, row
              assert maximum <= 60.0, row
          print({
              'p50_ms': [float(row['p50_ms']) for row in rows],
              'p95_ms': [float(row['p95_ms']) for row in rows],
              'p99_ms': [float(row['p99_ms']) for row in rows],
              'maximum_ms': [float(row['max_ms']) for row in rows],
              'checksum': int(rows[0]['checksum']),
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-shared-pixel-composition-${{ github.sha }}
          path: shared-pixel-benchmark-*.txt
          if-no-files-found: warn

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build and run focused targets
        run: |
          cmake --build build --parallel 2 --target zevryon-shared-pixel-compositor-tests zevryon-shared-pixel-compositor-equivalence-tests zevryon-shared-pixel-compositor-benchmark
          ./build/zevryon-shared-pixel-compositor-tests
          ./build/zevryon-shared-pixel-compositor-equivalence-tests
          ./build/zevryon-shared-pixel-compositor-benchmark 32

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON -DZEVRYON_ENABLE_SANITIZERS=ON
      - name: Build focused targets
        run: cmake --build build --parallel 2 --target zevryon-shared-pixel-compositor-tests zevryon-shared-pixel-compositor-equivalence-tests
      - name: Run under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./build/zevryon-shared-pixel-compositor-tests
          ./build/zevryon-shared-pixel-compositor-equivalence-tests
