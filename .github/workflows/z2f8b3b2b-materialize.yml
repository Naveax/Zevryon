name: z2f8b3b2b-materialize

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.z2f8b3b2b/**'
      - '.github/workflows/z2f8b3b2b-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify and publish production sources
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.z2f8b3b2b/part*)
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "payload already materialized"
            exit 0
          fi
          cat "${parts[@]}" | base64 --decode > /tmp/z2f8b3b2b-source.tar.gz
          echo '878ae66b91755d7cf9d0668675a9aff946f7fc57ec2d9c566326283c695f929e  /tmp/z2f8b3b2b-source.tar.gz' | sha256sum --check --strict
          cat > /tmp/expected-manifest <<'MANIFEST'
          docs/Z2F8B3B2B_REAL_VULKAN_SHADER_EXECUTION.md
          src/native_shader_execution_vulkan.cpp
          src/native_shader_execution_vulkan_benchmark_main.cpp
          tests/native_shader_execution_vulkan_tests.cpp
          MANIFEST
          tar -tzf /tmp/z2f8b3b2b-source.tar.gz | LC_ALL=C sort > /tmp/actual-manifest
          LC_ALL=C sort -o /tmp/expected-manifest /tmp/expected-manifest
          diff -u /tmp/expected-manifest /tmp/actual-manifest
          tar -xzf /tmp/z2f8b3b2b-source.tar.gz
          rm -rf .z2f8b3b2b
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Z2F-8B3B2B: materialize Vulkan shader execution sources'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
