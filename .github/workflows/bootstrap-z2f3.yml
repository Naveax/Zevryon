name: bootstrap-z2f3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-device-raster-execution
          fetch-depth: 0
      - name: Remove bootstrap payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .z2f3 .github/workflows/bootstrap-z2f3.yml
          git commit -m "Remove Z2F-3 bootstrap payload"
          git push origin HEAD:work/z2f-bounded-device-raster-execution
