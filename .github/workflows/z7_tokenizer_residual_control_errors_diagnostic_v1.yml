name: Z7 residual control errors diagnostic v1

on:
  push:
    branches:
      - candidate/z7-tokenizer-residual-control-errors-diagnostic-v1

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply Data Unicode and residual control candidates
        run: |
          set -euo pipefail
          git fetch --no-tags origin d0f224aacd6f932a2eacbef20e35d8a83e931f18
          git show d0f224aacd6f932a2eacbef20e35d8a83e931f18:scripts/apply_z7_data_invalid_unicode_errors_diagnostic_v1.py > scripts/.data_unicode_tmp.py
          python3 scripts/.data_unicode_tmp.py
          rm -f scripts/.data_unicode_tmp.py
          python3 scripts/apply_z7_residual_control_errors_diagnostic_v1.py
          git diff --check
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build focused tokenizer targets
        run: cmake --build build --parallel 2 --target zevryon-html-tokenizer-data-tags-v1-tests zevryon-html-tokenizer-data-utf8-text-v1-tests zevryon-html-tokenizer-markup-declarations-v1-tests zevryon-html-tokenizer-script-data-v1-tests zevryon-html-tokenizer-token-stream-v1-tests zevryon-html-tokenizer-token-stream-v1-probe
      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build/zevryon-html-tokenizer-data-tags-v1-tests
          ./build/zevryon-html-tokenizer-data-utf8-text-v1-tests
          ./build/zevryon-html-tokenizer-markup-declarations-v1-tests
          ./build/zevryon-html-tokenizer-script-data-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests
      - name: Measure exact corpus movement
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --probe build/zevryon-html-tokenizer-token-stream-v1-probe > census.json
          python3 -c "import json; r=json.load(open('census.json')); assert r['executions']==7036; assert r['failed']<=27; assert r['reason_counts'].get('failed:token-stream-mismatch',0)<=9; print('DIAGNOSTIC_TOTALS',r['passed'],r['failed'],r['unsupported']); print('DIAGNOSTIC_PARSE_MISMATCH',r['reason_counts'].get('failed:parse-error-stream-mismatch',0)); print('DIAGNOSTIC_TOKEN_MISMATCH',r['reason_counts'].get('failed:token-stream-mismatch',0))"
      - name: Block diagnostic publication
        run: |
          echo 'Diagnostic evidence collected; branch must not be merged.' >&2
          exit 1
