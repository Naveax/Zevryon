name: Z2R Rust MassiveDoc descriptor codec certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust/**"
      - "src/zevryon_massivedoc_rust_ffi.h"
      - "tests/rust_massivedoc_descriptor_codec_tests.cpp"
      - "tests/rust_massivedoc_descriptor_c_abi_tests.c"
      - "docs/Z2R3A_MASSIVEDOC_DESCRIPTOR_CODEC.md"
      - ".github/workflows/z2r3a-rust-massivedoc-codec.yml"

permissions:
  contents: read

concurrency:
  group: z2r3a-rust-massivedoc-codec-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  descriptor-codec:
    name: ${{ matrix.os }} descriptor codec and C ABI
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Toolchain versions
        run: |
          rustc --version --verbose
          cargo --version
          cmake --version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Test Rust workspace
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked

      - name: Clippy Rust workspace
        run: >-
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Configure strict Rust bridge build
        run: >-
          cmake -S rust/bridge -B build-z2r3a
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build MassiveDoc descriptor certification targets
        run: >-
          cmake --build build-z2r3a --config Release --parallel 2 --target
          zevryon-rust-massivedoc-codec-tests
          zevryon-rust-massivedoc-c-abi-tests
          zevryon-rust-resource-ledger-tests
          zevryon-rust-c-abi-tests

      - name: Run descriptor and existing ABI regression tests
        run: >-
          ctest --test-dir build-z2r3a -C Release --output-on-failure
          -R "^(rust-massivedoc-descriptor-codec|rust-massivedoc-c-abi-runtime|rust-resource-ledger-equivalence|rust-c-abi-runtime)$"
