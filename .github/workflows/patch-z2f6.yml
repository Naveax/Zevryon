name: patch-z2f6

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'work/z2f-bounded-native-damage-presentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-native-damage-presentation
      - name: Apply verified Z2F-6 source repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/native_damage_presentation.cpp')
          text = path.read_text(encoding='utf-8')

          if 'bool collapse_to_full_redraw = false;' not in text:
              threshold_pattern = re.compile(
                  r"        if \(request\.policy\.full_redraw_threshold_permille != 0U &&\n"
                  r"\s+full_area != 0U &&\n"
                  r"\s+total_area \* 1'000U >=\n"
                  r"\s+full_area \* request\.policy\.full_redraw_threshold_permille\) \{\n"
                  r"\s+staged\.damage_rects\.clear\(\);\n"
                  r"\s+staged\.damage_rects\.push_back\(surface_rect\(request\.frame->surface\)\);\n"
                  r"\s+staged\.full_redraw = 1U;\n"
                  r"\s+total_area = full_area;\n"
                  r"\s+\}\n")
              threshold_replacement = '''        bool collapse_to_full_redraw = false;
          if (!redraw_threshold_reached(
                  total_area,
                  full_area,
                  request.policy.full_redraw_threshold_permille,
                  &collapse_to_full_redraw)) {
              set_build_error(
                  error,
                  NativeCommandBuildErrorKind::ArithmeticOverflow,
                  "full-redraw threshold overflow");
              return false;
          }
          if (collapse_to_full_redraw) {
              staged.damage_rects.clear();
              staged.damage_rects.push_back(surface_rect(request.frame->surface));
              staged.full_redraw = 1U;
              total_area = full_area;
          }
          '''
              text, count = threshold_pattern.subn(threshold_replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'threshold replacement count={count}')

          if 'return receipt.ticket_id != 0U;' in text:
              receipt_pattern = re.compile(
                  r"    if \(receipt\.status != NativePresentStatus::Presented\) \{\n"
                  r"\s+return receipt\.ticket_id != 0U;\n"
                  r"\s+\}\n")
              receipt_replacement = '''    if (receipt.status != NativePresentStatus::Presented) {
              return false;
          }
          '''
              text, count = receipt_pattern.subn(receipt_replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'receipt replacement count={count}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit source repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native_damage_presentation.cpp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix native damage threshold and receipt semantics"
          git push origin HEAD:work/z2f-bounded-native-damage-presentation
