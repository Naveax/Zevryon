name: patch-z2f6

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'work/z2f-bounded-native-damage-presentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-native-damage-presentation
      - name: Apply exact Z2F-6 source repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/native_damage_presentation.cpp')
          text = path.read_text(encoding='utf-8')
          old_threshold = '''        if (request.policy.full_redraw_threshold_permille != 0U &&
              full_area != 0U &&
              total_area * 1'000U >=
                  full_area * request.policy.full_redraw_threshold_permille) {
              staged.damage_rects.clear();
              staged.damage_rects.push_back(surface_rect(request.frame->surface));
              staged.full_redraw = 1U;
              total_area = full_area;
          }
          '''
          new_threshold = '''        bool collapse_to_full_redraw = false;
          if (!redraw_threshold_reached(
                  total_area,
                  full_area,
                  request.policy.full_redraw_threshold_permille,
                  &collapse_to_full_redraw)) {
              set_build_error(
                  error,
                  NativeCommandBuildErrorKind::ArithmeticOverflow,
                  "full-redraw threshold overflow");
              return false;
          }
          if (collapse_to_full_redraw) {
              staged.damage_rects.clear();
              staged.damage_rects.push_back(surface_rect(request.frame->surface));
              staged.full_redraw = 1U;
              total_area = full_area;
          }
          '''
          old_receipt = '''    if (receipt.status != NativePresentStatus::Presented) {
              return receipt.ticket_id != 0U;
          }
          '''
          new_receipt = '''    if (receipt.status != NativePresentStatus::Presented) {
              return false;
          }
          '''
          changed = False
          if old_threshold in text:
              text = text.replace(old_threshold, new_threshold, 1)
              changed = True
          if old_receipt in text:
              text = text.replace(old_receipt, new_receipt, 1)
              changed = True
          if not changed:
              print('No source repair required')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit source repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native_damage_presentation.cpp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix native damage threshold and receipt semantics"
          git push origin HEAD:work/z2f-bounded-native-damage-presentation
