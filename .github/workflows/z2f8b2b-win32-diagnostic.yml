name: z2f8b2b-win32-diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-win32-header-order:
    if: github.head_ref == 'work/z2f8b2b-real-vulkan-wsi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f8b2b-real-vulkan-wsi
          fetch-depth: 0
      - name: Move NOMINMAX before all Vulkan includes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/native_gpu_sdk_execution_vulkan_wsi.cpp')
          text = path.read_text(encoding='utf-8')
          prefix = '#include "native_vulkan_wsi.hpp"\n#include "native_vulkan_wsi_context.hpp"\n'
          replacement = '''#if defined(_WIN32)\n#ifndef NOMINMAX\n#define NOMINMAX\n#endif\n#endif\n\n#include "native_vulkan_wsi.hpp"\n#include "native_vulkan_wsi_context.hpp"\n'''
          if text.startswith(replacement):
              raise SystemExit(0)
          if not text.startswith(prefix):
              raise SystemExit('unexpected Vulkan WSI source prefix')
          text = replacement + text[len(prefix):]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit exact source repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- src/native_gpu_sdk_execution_vulkan_wsi.cpp; then
            exit 0
          fi
          git add src/native_gpu_sdk_execution_vulkan_wsi.cpp
          git commit -m 'Fix Win32 Vulkan header ordering'
          git push origin HEAD:work/z2f8b2b-real-vulkan-wsi
