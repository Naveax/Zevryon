name: patch-z2f8b3a-metal-upload

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'work/z2f8b3-shared-render-pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f8b3-shared-render-pipeline
          fetch-depth: 0
      - name: Reuse bounded Metal upload buffers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/native_window_swapchain_metal.mm')
          text = path.read_text(encoding='utf-8')
          include_old = '#include <cstdint>\n#include <limits>\n'
          include_new = '#include <cstdint>\n#include <cstring>\n#include <limits>\n'
          if include_old in text:
              text = text.replace(include_old, include_new, 1)
          elif '#include <cstring>' not in text:
              raise SystemExit('unexpected Metal include block')

          old = '''            if (!request.pixel_buffer.empty()) {
                id<MTLBuffer> upload = [context_->device
                    newBufferWithBytes:request.pixel_buffer.bytes.data()
                    length:request.pixel_buffer.bytes.size()
                    options:MTLResourceStorageModeShared];
                if (upload == nil) {
                    return fail(error, NativeWindowSwapchainErrorKind::PresentFailed,
                                "Metal pixel upload buffer creation failed");
                }
                id<MTLBlitCommandEncoder> blit =
                    [command_buffer blitCommandEncoder];
                if (blit == nil) {
                    return fail(error, NativeWindowSwapchainErrorKind::PresentFailed,
                                "Metal pixel blit encoder creation failed");
                }
                [blit copyFromBuffer:upload
                        sourceOffset:0U
                   sourceBytesPerRow:request.pixel_buffer.row_bytes
                 sourceBytesPerImage:static_cast<NSUInteger>(
                     request.pixel_buffer.row_bytes) *
                     request.pixel_buffer.height
                          sourceSize:MTLSizeMake(
                              request.pixel_buffer.width,
                              request.pixel_buffer.height, 1U)
                           toTexture:slot.texture
                    destinationSlice:0U
                    destinationLevel:0U
                   destinationOrigin:MTLOriginMake(0U, 0U, 0U)];
                [blit endEncoding];
                slot.upload_buffer = upload;
            } else {
'''
          new = '''            if (!request.pixel_buffer.empty()) {
                const NSUInteger upload_size = static_cast<NSUInteger>(
                    request.pixel_buffer.bytes.size());
                if (slot.upload_buffer == nil ||
                    slot.upload_buffer.length < upload_size) {
                    slot.upload_buffer = [context_->device
                        newBufferWithLength:upload_size
                        options:MTLResourceStorageModeShared];
                }
                if (slot.upload_buffer == nil ||
                    slot.upload_buffer.contents == nullptr) {
                    return fail(error, NativeWindowSwapchainErrorKind::PresentFailed,
                                "Metal pixel upload buffer creation failed");
                }
                std::memcpy(
                    slot.upload_buffer.contents,
                    request.pixel_buffer.bytes.data(),
                    request.pixel_buffer.bytes.size());
                id<MTLBlitCommandEncoder> blit =
                    [command_buffer blitCommandEncoder];
                if (blit == nil) {
                    return fail(error, NativeWindowSwapchainErrorKind::PresentFailed,
                                "Metal pixel blit encoder creation failed");
                }
                [blit copyFromBuffer:slot.upload_buffer
                        sourceOffset:0U
                   sourceBytesPerRow:request.pixel_buffer.row_bytes
                 sourceBytesPerImage:static_cast<NSUInteger>(
                     request.pixel_buffer.row_bytes) *
                     request.pixel_buffer.height
                          sourceSize:MTLSizeMake(
                              request.pixel_buffer.width,
                              request.pixel_buffer.height, 1U)
                           toTexture:slot.texture
                    destinationSlice:0U
                    destinationLevel:0U
                   destinationOrigin:MTLOriginMake(0U, 0U, 0U)];
                [blit endEncoding];
            } else {
'''
          if old not in text:
              raise SystemExit('unexpected Metal upload block')
          text = text.replace(old, new, 1)

          acquired_old = '''    void release_acquired_slot_locked(ImageSlot& slot) noexcept {
        slot.drawable = nil;
        slot.texture = nil;
        slot.upload_buffer = nil;
        slot.command_buffer = nil;
'''
          acquired_new = '''    void release_acquired_slot_locked(ImageSlot& slot) noexcept {
        slot.drawable = nil;
        slot.texture = nil;
        slot.command_buffer = nil;
'''
          if acquired_old not in text:
              raise SystemExit('unexpected acquired-slot cleanup block')
          text = text.replace(acquired_old, acquired_new, 1)

          inflight_old = '''    void clear_in_flight_slot_locked(ImageSlot& slot) noexcept {
        slot.drawable = nil;
        slot.texture = nil;
        slot.upload_buffer = nil;
        slot.command_buffer = nil;
'''
          inflight_new = '''    void clear_in_flight_slot_locked(ImageSlot& slot) noexcept {
        slot.drawable = nil;
        slot.texture = nil;
        slot.command_buffer = nil;
'''
          if inflight_old not in text:
              raise SystemExit('unexpected in-flight cleanup block')
          text = text.replace(inflight_old, inflight_new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit Metal upload-ring repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native_window_swapchain_metal.mm
          git commit -m 'Reuse Metal full-frame upload buffers'
          git push origin HEAD:work/z2f8b3-shared-render-pipeline
