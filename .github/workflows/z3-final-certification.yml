name: Z3 final certification

on:
  pull_request:
    paths:
      - 'config/zenith_program.json'
      - 'certification/z3_gate_closure.json'
      - 'certification/z3_*scope.json'
      - 'tests/test_z3_gate_closure.py'
      - 'tests/test_z3_authority_aggregation.py'
      - 'tests/test_z3_*scope.py'
      - 'tests/test_zenith_program_contract.py'
      - 'scripts/z3_final_certification.py'
      - '.github/workflows/z3-final-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z3-final-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  closure-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Validate Z3 closure program and all Z3 scope contracts
        run: python scripts/z3_final_certification.py
      - name: Validate closure JSON syntax
        run: python -m json.tool certification/z3_gate_closure.json > /dev/null

  closure-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Validate Z3 closure program and all Z3 scope contracts
        shell: pwsh
        run: python scripts/z3_final_certification.py
      - name: Validate closure JSON syntax
        shell: pwsh
        run: python -m json.tool certification/z3_gate_closure.json > $null
