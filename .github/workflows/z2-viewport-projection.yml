name: z2-viewport-projection

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch_split_caret:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - name: Patch source and restore permanent certification workflow
        shell: bash
        env:
          OLD_BLOCK_B64: 
          NEW_BLOCK_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          source = Path('src/viewport_projection.cpp')
          text = source.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_BLOCK_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_BLOCK_B64']).decode('utf-8')
          if old not in text:
              raise SystemExit('expected hit-test block was not found')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm -f .github/workflows/z2e3-apply-hit-test-patch.yml
          git rm -f .github/workflows/z2e3-patch-on-pr.yml
          git show HEAD^:.github/workflows/z2-viewport-projection.yml > .github/workflows/z2-viewport-projection.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/viewport_projection.cpp .github/workflows/z2-viewport-projection.yml
          git commit -m "Fix split-caret hit-test affinity"
          git push origin HEAD:${{ github.head_ref }}
