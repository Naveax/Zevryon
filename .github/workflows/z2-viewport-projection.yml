name: z2-viewport-projection

on:
  pull_request:
    paths:
      - '.github/workflows/z2-viewport-projection.yml'
      - 'cmake/viewport_projection.cmake'
      - 'cmake/line_box_layout.cmake'
      - 'src/viewport_projection.*'
      - 'src/line_box_layout.*'
      - 'src/line_fragment_layout.*'
      - 'src/caret_boundary_map.*'
      - 'src/glyph_cluster_map.*'
      - 'src/multi_run_harfbuzz_shaper.*'
      - 'src/ledger_memory_resource.*'
      - 'src/resource_ledger.*'
      - 'tests/viewport_projection_tests.cpp'
      - 'tests/viewport_hit_test_equivalence_tests.cpp'
      - 'docs/Z2E3_BOUNDED_VIEWPORT_PROJECTION.md'
  workflow_dispatch:

concurrency:
  group: z2-viewport-projection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-viewport-projection-tests \
            zevryon-viewport-hit-test-equivalence-tests \
            zevryon-viewport-projection-benchmark \
            zevryon-line-box-layout-tests \
            zevryon-line-fragment-layout-tests \
            2>&1 | tee viewport-projection-build.log
      - name: Repeat focused certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^viewport-projection-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee viewport-projection-repeat.log
      - name: Exhaustively certify hit testing
        run: |
          set -o pipefail
          ctest --test-dir build -R '^viewport-hit-test-equivalence-tests$' \
            --output-on-failure 2>&1 | tee viewport-hit-test-equivalence.log
      - name: Run three independent distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-viewport-projection-benchmark \
              > "viewport-projection-benchmark-${run}.json"
          done
      - name: Enforce exact output, memory and latency gates
        run: |
          python3 - <<'PY'
          import json

          rows = []
          for run in range(1, 4):
              with open(f'viewport-projection-benchmark-{run}.json', encoding='utf-8') as handle:
                  row = json.load(handle)
              assert row['schema'] == 'zevryon.viewport-projection-benchmark.v1'
              assert row['input_document_lines'] == 16_384
              assert row['input_clusters'] == 65_536
              assert row['input_fragments'] == 65_536
              assert row['first_source_line'] == 8_184
              assert row['source_line_limit'] == 8_264
              assert row['output_lines'] == 80
              assert row['output_fragment_rects'] == 320
              assert row['output_carets'] == 640
              assert row['output_selection_rects'] == 64
              assert row['glyph_groups'] == 320
              assert row['unsafe_caret_boundaries_skipped'] == 0
              assert row['lines_before_viewport'] == 8
              assert row['lines_after_viewport'] == 8
              assert row['line_record_bytes'] == 64
              assert row['fragment_record_bytes'] == 48
              assert row['caret_record_bytes'] == 40
              assert row['selection_record_bytes'] == 48
              assert row['retained_bytes'] == 49_152
              assert row['peak_bytes'] == 49_152
              assert row['hard_limit_bytes'] == 49_152
              assert row['document_block_extent'] == 16_384_000
              assert row['hit_queries_per_iteration'] == 256
              assert row['checksum'] == 1_409_705_956_279_003_952
              assert row['expected_checksum'] == row['checksum']
              assert row['within_hard_limits'] is True
              assert row['accounting_clean'] is True
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 6.0, row
              assert row['p99_ms'] <= 10.0, row
              assert row['maximum_ms'] <= 20.0, row
              rows.append(row)
          assert len({row['checksum'] for row in rows}) == 1
          print({
              'p50_ms': [row['p50_ms'] for row in rows],
              'p95_ms': [row['p95_ms'] for row in rows],
              'p99_ms': [row['p99_ms'] for row in rows],
              'maximum_ms': [row['maximum_ms'] for row in rows],
              'checksum': rows[0]['checksum'],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-viewport-projection-${{ github.sha }}
          path: |
            viewport-projection-build.log
            viewport-projection-repeat.log
            viewport-hit-test-equivalence.log
            viewport-projection-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests under sanitizers
        run: >-
          cmake --build build-sanitized --parallel 2 --target
          zevryon-viewport-projection-tests
          zevryon-viewport-hit-test-equivalence-tests
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^viewport-(projection|hit-test-equivalence)-tests$' --output-on-failure

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build benchmark and focused tests
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-viewport-projection-tests \
            zevryon-viewport-hit-test-equivalence-tests \
            zevryon-viewport-projection-benchmark \
            2>&1 | tee apple-viewport-projection-build.log
          ctest --test-dir build -R '^viewport-(projection|hit-test-equivalence)-tests$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-viewport-projection-appleclang-${{ github.sha }}
          path: apple-viewport-projection-build.log
          if-no-files-found: warn
