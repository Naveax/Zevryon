name: z2-real-d3d12-window-presentation

on:
  pull_request:
    paths:
      - '.github/workflows/z2-real-d3d12-window-presentation.yml'
      - 'cmake/native_window_swapchain.cmake'
      - 'src/native_gpu_sdk_execution.hpp'
      - 'src/native_gpu_sdk_execution.cpp'
      - 'src/native_gpu_sdk_execution_d3d12.cpp'
      - 'src/native_window_swapchain.hpp'
      - 'src/native_window_swapchain_d3d12.cpp'
      - 'src/native_window_swapchain_stub.cpp'
      - 'src/native_window_swapchain_d3d12_benchmark_main.cpp'
      - 'tests/native_window_swapchain_d3d12_tests.cpp'
      - 'docs/Z2F8B2A_REAL_WIN32_DXGI_PRESENTATION.md'
  workflow_dispatch:

concurrency:
  group: z2-real-d3d12-window-presentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure non-Windows ABI build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build reference window targets
        run: >-
          cmake --build build --parallel 2 --target
          zevryon-native-window-swapchain-tests
          zevryon-native-window-swapchain-equivalence-tests
      - name: Run reference regression
        run: >-
          ctest --test-dir build
          -R '^native-window-swapchain-(tests|equivalence-tests)$'
          --output-on-failure

  d3d12-window-runtime:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure Direct3D 12 window graph
        shell: pwsh
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build real window targets
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target zevryon-native-window-swapchain-d3d12-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2 --target zevryon-native-window-swapchain-d3d12-benchmark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repeat real HWND lifecycle
        shell: pwsh
        run: |
          ctest --test-dir build -C Release -R '^native-window-swapchain-d3d12-tests$' --repeat until-fail:10 --output-on-failure
      - name: Run three real-present distributions
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            & .\build\Release\zevryon-native-window-swapchain-d3d12-benchmark.exe *> "d3d12-window-benchmark-$_.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Enforce exact presentation, memory and latency gates
        shell: pwsh
        run: |
          $rows = @()
          1..3 | ForEach-Object {
            $values = @{}
            Get-Content "d3d12-window-benchmark-$_.txt" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.+)$') {
                $values[$matches[1]] = $matches[2]
              }
            }
            if ([int64]$values['iterations'] -ne 256) { throw $values }
            if ([int64]$values['samples'] -ne 256) { throw $values }
            if ([int64]$values['presented'] -ne 256) { throw $values }
            if ([int64]$values['occluded'] -ne 0) { throw $values }
            if ([int64]$values['surface_bytes'] -ne 2764800) { throw $values }
            if ([int64]$values['peak_in_flight_bytes'] -ne 921600) { throw $values }
            if ([uint64]$values['checksum'] -ne 16792613520493277315) { throw $values }
            $p50 = [double]::Parse($values['p50_ms'], [Globalization.CultureInfo]::InvariantCulture)
            $p95 = [double]::Parse($values['p95_ms'], [Globalization.CultureInfo]::InvariantCulture)
            $p99 = [double]::Parse($values['p99_ms'], [Globalization.CultureInfo]::InvariantCulture)
            $maximum = [double]::Parse($values['max_ms'], [Globalization.CultureInfo]::InvariantCulture)
            if (-not (0.0 -lt $p50 -and $p50 -le $p95 -and $p95 -le $p99 -and $p99 -le $maximum)) { throw $values }
            # Hosted Windows runners have a stable sub-millisecond common path
            # with a roughly 30 ms DWM/fence scheduling tail. Gate both regions.
            if ($p50 -gt 5.0) { throw $values }
            if ($p95 -gt 35.0) { throw $values }
            if ($p99 -gt 35.0) { throw $values }
            if ($maximum -gt 40.0) { throw $values }
            $rows += [pscustomobject]@{
              samples = [int64]$values['samples']
              presented = [int64]$values['presented']
              occluded = [int64]$values['occluded']
              p50_ms = $p50
              p95_ms = $p95
              p99_ms = $p99
              maximum_ms = $maximum
              checksum = [uint64]$values['checksum']
              software_device = [int]$values['software_device']
            }
          }
          $rows | ConvertTo-Json -Depth 4 | Set-Content d3d12-window-summary.json
          $rows | Format-Table
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-real-d3d12-window-presentation-${{ github.sha }}
          path: |
            d3d12-window-benchmark-*.txt
            d3d12-window-summary.json
          if-no-files-found: warn
