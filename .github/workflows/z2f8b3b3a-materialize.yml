name: z2f8b3b3a-materialize

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Extract and apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/z2f8b3b3a-apply.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('exact patch script markers are missing or ambiguous')
          body = source.split(start, 1)[1].split(end, 1)[0]
          Path('/tmp/z2f8b3b3a_apply.py').write_text(textwrap.dedent(body) + '\n')
          PY
          python3 -m py_compile /tmp/z2f8b3b3a_apply.py
          python3 /tmp/z2f8b3b3a_apply.py
      - name: Publish production sources and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/native_window_swapchain.hpp \
            src/native_shader_execution_d3d12.cpp \
            src/native_window_swapchain_d3d12.cpp
          git rm -r .z2f8b3b3a .github/workflows/z2f8b3b3a-apply.yml
          git commit -m "Z2F-8B3B3A: connect D3D12 shader surfaces to DXGI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
