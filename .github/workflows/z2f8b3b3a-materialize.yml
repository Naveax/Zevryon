name: z2f8b3b3a-materialize

on:
  push:
    branches: [work/z2f8b3b3a-direct-d3d12-shader-present]
    paths: ['.github/workflows/z2f8b3b3a-materialize.yml']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and apply exact production patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .z2f8b3b3a/part00 \
            .z2f8b3b3a/part01 \
            .z2f8b3b3a/part02 \
            .z2f8b3b3a/part03 \
            .z2f8b3b3a/part04 \
            | base64 -d > /tmp/z2f8b3b3a_apply.py
          python3 -m py_compile /tmp/z2f8b3b3a_apply.py
          python3 /tmp/z2f8b3b3a_apply.py
      - name: Publish production sources and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/native_window_swapchain.hpp \
            src/native_shader_execution_d3d12.cpp \
            src/native_window_swapchain_d3d12.cpp
          git rm -r \
            .z2f8b3b3a \
            .github/workflows/z2f8b3b3a-apply.yml \
            .github/workflows/z2f8b3b3a-materialize.yml
          git commit -m "Z2F-8B3B3A: connect D3D12 shader surfaces to DXGI"
          git push origin HEAD:work/z2f8b3b3a-direct-d3d12-shader-present
