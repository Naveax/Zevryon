name: Z2R-3D-U fix fault rounds
on:
  pull_request:
    paths:
      - ".github/workflows/z2r3du-fix-fault-rounds.yml"
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/z2r3d-unicode-promotion-readiness
          fetch-depth: 0
      - run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('scripts/z2r3d_run_unicode_workloads.py')
          text = path.read_text(encoding='utf-8')
          pattern = r'(faults\[fault\]\s*=\s*run_process\(\s*fault_binary,\s*args\.logical_bytes,\s*)1(\s*,\s*fault=fault,\s*\))'
          text, count = re.subn(pattern, r'\g<1>args.rounds\2', text, count=1)
          if count != 1:
              raise RuntimeError(f'fault-round patch count was {count}')
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/z2r3d_run_unicode_workloads.py
          git commit -m "Fix Z2R-3D-U fault corpus round parity"
          git push origin HEAD:agent/z2r3d-unicode-promotion-readiness
