name: z2c2-linear-preflight-repair

on:
  push:
    branches:
      - 'work/z2c-bounded-multi-run-shaping'
    paths:
      - '.github/workflows/z2c2-linear-preflight-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply bounded preflight repair and remove temporary machinery
        run: |
          python3 scripts/repair_z2c2_linear_preflight.py
          git diff --check
          git config user.name 'OpenAI Coding Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Z2C-2: bound distinct-face preflight'
          git push origin HEAD:${{ github.ref_name }}
