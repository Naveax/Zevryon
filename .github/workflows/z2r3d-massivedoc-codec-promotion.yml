name: Z2R-3D MassiveDoc codec promotion readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cmake/z2r3d_massivedoc_codec_probe.cmake"
      - "scripts/z2r3d_*.py"
      - "tests/z2r3d_massivedoc_codec_workload.cpp"
      - "tests/test_z2r3d_codec_certification.py"
      - "docs/Z2R3D_MASSIVEDOC_CODEC_PROMOTION.md"
      - ".github/workflows/z2r3d-massivedoc-codec-promotion.yml"
      - "src/massivedoc_descriptor_shadow.*"
      - "src/massivedoc_store*"
      - "rust/crates/zevryon-massivedoc-*/*"

permissions:
  contents: read

concurrency:
  group: z2r3d-massivedoc-codec-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Fail-closed certification contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile certification scripts
        run: >-
          python -m py_compile
          scripts/z2r3d_run_codec_workloads.py
          scripts/z2r3d_codec_certification.py
          scripts/z2r3d_finalize_promotion.py
      - name: Run fail-closed contract tests
        run: python -m pytest -q tests/test_z2r3d_codec_certification.py

  platform-certification:
    name: ${{ matrix.platform }} paired codec certification
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            compiler: GNU
          - os: windows-latest
            platform: windows
            compiler: MSVC
          - os: macos-latest
            platform: macos
            compiler: AppleClang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python measurement dependencies
        run: python -m pip install --upgrade pip pytest psutil

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Report toolchains
        run: |
          python --version
          cmake --version
          rustc --version --verbose
          cargo --version

      - name: Resolve injected target path
        run: >-
          python -c "import os; from pathlib import Path;
          path=Path('cmake/z2r3d_massivedoc_codec_probe.cmake').resolve().as_posix();
          open(os.environ['GITHUB_ENV'],'a',encoding='utf-8').write('Z2R3D_PROBE='+path+'\n')"

      - name: Configure authoritative C++ baseline
        run: >-
          cmake -S . -B build-z2r3d-baseline
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_PROJECT_INCLUDE=${{ env.Z2R3D_PROBE }}
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DZEVRYON_RUST_LEDGER_SHADOW=OFF
          -DZEVRYON_RUST_LEDGER_AUTHORITATIVE=OFF
          -DZEVRYON_RUST_MASSIVEDOC_CODEC_SHADOW=OFF
          -DZEVRYON_RUST_MASSIVEDOC_CODEC_SHADOW_STRICT=OFF
          -DZEVRYON_ENABLE_FONTCONFIG_DISCOVERY=OFF
          -DZEVRYON_ENABLE_DIRECTWRITE_DISCOVERY=OFF

      - name: Build authoritative workload target
        run: >-
          cmake --build build-z2r3d-baseline --config Release --parallel 2
          --target zevryon-z2r3d-massivedoc-codec-workload

      - name: Configure production Rust descriptor shadow
        run: >-
          cmake -S . -B build-z2r3d-shadow
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_PROJECT_INCLUDE=${{ env.Z2R3D_PROBE }}
          -DZEVRYON_ENABLE_RUST_CORE=ON
          -DZEVRYON_RUST_LEDGER_SHADOW=OFF
          -DZEVRYON_RUST_LEDGER_AUTHORITATIVE=OFF
          -DZEVRYON_RUST_MASSIVEDOC_CODEC_SHADOW=ON
          -DZEVRYON_RUST_MASSIVEDOC_CODEC_SHADOW_STRICT=OFF
          -DZEVRYON_ENABLE_FONTCONFIG_DISCOVERY=OFF
          -DZEVRYON_ENABLE_DIRECTWRITE_DISCOVERY=OFF

      - name: Build Rust-shadow workload target
        run: >-
          cmake --build build-z2r3d-shadow --config Release --parallel 2
          --target zevryon-z2r3d-massivedoc-codec-workload

      - name: Resolve platform executables
        run: >-
          python -c "import os; from pathlib import Path;
          name=Path('Release/zevryon-z2r3d-massivedoc-codec-workload.exe') if os.name=='nt'
          else Path('zevryon-z2r3d-massivedoc-codec-workload');
          env=Path(os.environ['GITHUB_ENV']);
          env.open('a',encoding='utf-8').write(
          'Z2R3D_BASELINE='+str((Path('build-z2r3d-baseline')/name).resolve())+'\n'+
          'Z2R3D_SHADOW='+str((Path('build-z2r3d-shadow')/name).resolve())+'\n')"

      - name: Run paired 128 MiB real-corpus workload
        run: >-
          python scripts/z2r3d_run_codec_workloads.py
          --baseline-binary "${{ env.Z2R3D_BASELINE }}"
          --shadow-binary "${{ env.Z2R3D_SHADOW }}"
          --platform ${{ matrix.platform }}
          --work-dir "${{ runner.temp }}/z2r3d-${{ matrix.platform }}"
          --logical-bytes 134217728
          --records 131072
          --segment-bytes 16777216
          --giant-record-bytes 67108864
          --samples 3
          --output evidence/z2r3d/${{ matrix.platform }}-paired.json

      - name: Build fail-closed platform manifest
        run: >-
          python scripts/z2r3d_codec_certification.py
          --report evidence/z2r3d/${{ matrix.platform }}-paired.json
          --platform ${{ matrix.platform }}
          --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --compiler ${{ matrix.compiler }}
          --build-type Release
          --max-p50-ratio 2.00
          --max-p95-ratio 2.25
          --max-p99-ratio 2.50
          --max-maximum-ratio 3.00
          --max-wall-delta-seconds 5.0
          --max-memory-ratio 1.50
          --max-memory-delta-bytes 16777216
          --max-total-ratio 2.00
          --max-total-delta-seconds 10.0
          --output evidence/z2r3d/${{ matrix.platform }}-certification.json

      - name: Upload paired platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: z2r3d-platform-${{ matrix.platform }}-${{ github.sha }}
          path: |
            evidence/z2r3d/${{ matrix.platform }}-paired.json
            evidence/z2r3d/${{ matrix.platform }}-certification.json
          if-no-files-found: error

  final-promotion-readiness:
    name: Final three-platform promotion-readiness manifest
    needs: platform-certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all platform evidence
        uses: actions/download-artifact@v4
        with:
          pattern: z2r3d-platform-*-${{ github.sha }}
          path: evidence/z2r3d/downloaded
          merge-multiple: true
      - name: Recheck finalization contracts
        run: python -m pytest -q tests/test_z2r3d_codec_certification.py
      - name: Build final promotion-readiness manifest
        run: >-
          python scripts/z2r3d_finalize_promotion.py
          --linux evidence/z2r3d/downloaded/linux-certification.json
          --windows evidence/z2r3d/downloaded/windows-certification.json
          --macos evidence/z2r3d/downloaded/macos-certification.json
          --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --z2r3c-head 0fb78d6f598f96eff1e9df6fde6897442e0ac443
          --output evidence/z2r3d/z2r3d-promotion-readiness.json
      - name: Upload final promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: z2r3d-promotion-readiness-${{ github.sha }}
          path: evidence/z2r3d/z2r3d-promotion-readiness.json
          if-no-files-found: error
