name: Z3 CSS parser selector cascade invalidation style DAG materialization and window foundation

on:
  pull_request:
    paths:
      - 'src/css_parser_v1.*'
      - 'src/css_selector_v1.*'
      - 'src/css_selector_invalidation_v1.*'
      - 'src/css_cascade_v1.*'
      - 'src/css_style_dag_v1.*'
      - 'src/css_style_materialization_v1.*'
      - 'src/css_style_materialization_window_v1.*'
      - 'tests/css_parser_v1_tests.cpp'
      - 'tests/css_selector_v1_tests.cpp'
      - 'tests/css_selector_invalidation_v1_tests.cpp'
      - 'tests/css_cascade_v1_tests.cpp'
      - 'tests/css_style_dag_v1_tests.cpp'
      - 'tests/css_style_materialization_v1_tests.cpp'
      - 'tests/css_style_materialization_window_v1_tests.cpp'
      - 'tests/test_z3_css_parser_foundation_scope.py'
      - 'tests/test_z3_css_input_preprocessing_scope.py'
      - 'tests/test_z3_css_declaration_list_scope.py'
      - 'tests/test_z3_css_selector_foundation_scope.py'
      - 'tests/test_z3_css_selector_invalidation_foundation_scope.py'
      - 'tests/test_z3_css_cascade_foundation_scope.py'
      - 'tests/test_z3_css_style_dag_foundation_scope.py'
      - 'tests/test_z3_css_offscreen_materialization_foundation_scope.py'
      - 'tests/test_z3_css_materialization_window_foundation_scope.py'
      - 'certification/z3_css_parser_foundation_scope.json'
      - 'certification/z3_css_input_preprocessing_scope.json'
      - 'certification/z3_css_declaration_list_scope.json'
      - 'certification/z3_css_selector_foundation_scope.json'
      - 'certification/z3_css_selector_invalidation_foundation_scope.json'
      - 'certification/z3_css_cascade_foundation_scope.json'
      - 'certification/z3_css_style_dag_foundation_scope.json'
      - 'certification/z3_css_offscreen_materialization_foundation_scope.json'
      - 'certification/z3_css_materialization_window_foundation_scope.json'
      - 'cmake/css_parser_v1.cmake'
      - 'cmake/css_selector_v1.cmake'
      - 'cmake/css_cascade_v1.cmake'
      - 'cmake/css_style_dag_v1.cmake'
      - 'cmake/css_style_materialization_v1.cmake'
      - 'cmake/css_style_materialization_window_v1.cmake'
      - 'cmake/coretext_discovery.cmake'
      - '.github/workflows/z3-css-parser-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z3-css-parser-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install focused build dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DZEVRYON_ENABLE_FONTCONFIG_DISCOVERY=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build production CSS oracles
        run: >-
          cmake --build build --parallel 2
          --target zevryon-css-parser-v1-tests zevryon-css-selector-v1-tests zevryon-css-selector-invalidation-v1-tests zevryon-css-cascade-v1-tests zevryon-css-style-dag-v1-tests zevryon-css-style-materialization-v1-tests zevryon-css-style-materialization-window-v1-tests
      - name: Execute CSS oracles
        run: |
          build/zevryon-css-parser-v1-tests
          build/zevryon-css-selector-v1-tests
          build/zevryon-css-selector-invalidation-v1-tests
          build/zevryon-css-cascade-v1-tests
          build/zevryon-css-style-dag-v1-tests
          build/zevryon-css-style-materialization-v1-tests
          build/zevryon-css-style-materialization-window-v1-tests
      - name: Validate frozen scopes
        run: |
          python3 tests/test_z3_css_parser_foundation_scope.py
          python3 tests/test_z3_css_input_preprocessing_scope.py
          python3 tests/test_z3_css_declaration_list_scope.py
          python3 tests/test_z3_css_selector_foundation_scope.py
          python3 tests/test_z3_css_selector_invalidation_foundation_scope.py
          python3 tests/test_z3_css_cascade_foundation_scope.py
          python3 tests/test_z3_css_style_dag_foundation_scope.py
          python3 tests/test_z3_css_offscreen_materialization_foundation_scope.py
          python3 tests/test_z3_css_materialization_window_foundation_scope.py
      - name: Validate scope JSON syntax
        run: |
          python3 -m json.tool certification/z3_css_parser_foundation_scope.json > /dev/null
          python3 -m json.tool certification/z3_css_input_preprocessing_scope.json > /dev/null
          python3 -m json.tool certification/z3_css_declaration_list_scope.json > /dev/null
          python3 -m json.tool certification/z3_css_selector_foundation_scope.json > /dev/null
          python3 -m json.tool certification/z3_css_selector_invalidation_foundation_scope.json > /dev/null
          python3 -m json.tool certification/z3_css_cascade_foundation_scope.json > /dev/null
          python3 -m json.tool certification/z3_css_style_dag_foundation_scope.json > /dev/null
          python3 -m json.tool certification/z3_css_offscreen_materialization_foundation_scope.json > /dev/null
          python3 -m json.tool certification/z3_css_materialization_window_foundation_scope.json > /dev/null

  windows-parser:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DZEVRYON_ENABLE_DIRECTWRITE_DISCOVERY=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build production CSS oracles
        shell: pwsh
        run: cmake --build build --config Release --parallel 2 --target zevryon-css-parser-v1-tests zevryon-css-selector-v1-tests zevryon-css-selector-invalidation-v1-tests zevryon-css-cascade-v1-tests zevryon-css-style-dag-v1-tests zevryon-css-style-materialization-v1-tests zevryon-css-style-materialization-window-v1-tests
      - name: Execute CSS oracles
        shell: pwsh
        run: |
          build/Release/zevryon-css-parser-v1-tests.exe
          build/Release/zevryon-css-selector-v1-tests.exe
          build/Release/zevryon-css-selector-invalidation-v1-tests.exe
          build/Release/zevryon-css-cascade-v1-tests.exe
          build/Release/zevryon-css-style-dag-v1-tests.exe
          build/Release/zevryon-css-style-materialization-v1-tests.exe
          build/Release/zevryon-css-style-materialization-window-v1-tests.exe
      - name: Validate frozen scopes
        shell: pwsh
        run: |
          python tests/test_z3_css_parser_foundation_scope.py
          python tests/test_z3_css_input_preprocessing_scope.py
          python tests/test_z3_css_declaration_list_scope.py
          python tests/test_z3_css_selector_foundation_scope.py
          python tests/test_z3_css_selector_invalidation_foundation_scope.py
          python tests/test_z3_css_cascade_foundation_scope.py
          python tests/test_z3_css_style_dag_foundation_scope.py
          python tests/test_z3_css_offscreen_materialization_foundation_scope.py
          python tests/test_z3_css_materialization_window_foundation_scope.py
      - name: Validate scope JSON syntax
        shell: pwsh
        run: |
          python -m json.tool certification/z3_css_parser_foundation_scope.json > $null
          python -m json.tool certification/z3_css_input_preprocessing_scope.json > $null
          python -m json.tool certification/z3_css_declaration_list_scope.json > $null
          python -m json.tool certification/z3_css_selector_foundation_scope.json > $null
          python -m json.tool certification/z3_css_selector_invalidation_foundation_scope.json > $null
          python -m json.tool certification/z3_css_cascade_foundation_scope.json > $null
          python -m json.tool certification/z3_css_style_dag_foundation_scope.json > $null
          python -m json.tool certification/z3_css_offscreen_materialization_foundation_scope.json > $null
          python -m json.tool certification/z3_css_materialization_window_foundation_scope.json > $null
