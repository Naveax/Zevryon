name: z2-real-d3d12-shader-execution

on:
  pull_request:
    paths:
      - '.github/workflows/z2-real-d3d12-shader-execution.yml'
      - 'src/native_shader_execution*'
      - 'src/native_shader_surface*'
      - 'src/native_window_swapchain*'
  workflow_dispatch:

concurrency:
  group: z2-real-d3d12-shader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-b3b3a:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Extract and apply canonical production patch
        shell: bash
        run: |
          set -euo pipefail
          git show \
            01271ebb6fada967ff9a47c005964f34cd537f15:.github/workflows/z2f8b3b3a-apply.yml \
            > /tmp/z2f8b3b3a-original.yml
          sed -n "/python3 - <<'PY'/,/^          PY$/p" \
            /tmp/z2f8b3b3a-original.yml \
            | sed '1d;$d;s/^          //' \
            > /tmp/z2f8b3b3a_apply.py
          test -s /tmp/z2f8b3b3a_apply.py
          python3 -m py_compile /tmp/z2f8b3b3a_apply.py
          python3 /tmp/z2f8b3b3a_apply.py
      - name: Publish production sources and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout origin/main -- .github/workflows/z2-real-d3d12-shader-execution.yml
          git add \
            .github/workflows/z2-real-d3d12-shader-execution.yml \
            src/native_window_swapchain.hpp \
            src/native_shader_execution_d3d12.cpp \
            src/native_window_swapchain_d3d12.cpp
          git rm -r \
            .z2f8b3b3a \
            .github/workflows/z2f8b3b3a-apply.yml \
            .github/workflows/z2f8b3b3a-materialize.yml
          git commit -m "Z2F-8B3B3A: connect D3D12 shader surfaces to DXGI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
