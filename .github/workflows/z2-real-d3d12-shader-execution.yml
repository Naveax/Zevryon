name: z2-real-d3d12-shader-execution

on:
  pull_request:
    paths:
      - '.github/workflows/z2-real-d3d12-shader-execution.yml'
      - '.z2f8b3b3a/**'
      - 'src/native_shader_execution*'
      - 'src/native_shader_surface*'
      - 'src/native_window_swapchain*'
  workflow_dispatch:

concurrency:
  group: z2-real-d3d12-shader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-b3b3a:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Decode and apply exact production patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            '.z2f8b3b3a/part00',
            '.z2f8b3b3a/part01',
            '.z2f8b3b3a/part02',
            '.z2f8b3b3a/part03',
            '.z2f8b3b3a/part04'
          )
          foreach ($part in $parts) {
            if (-not (Test-Path -LiteralPath $part)) { throw "Missing $part" }
          }
          $encoded = ($parts | ForEach-Object {
            Get-Content -LiteralPath $_ -Raw
          }) -join ''
          $encoded = $encoded -replace '[^A-Za-z0-9+/=]', ''
          $remainder = $encoded.Length % 4
          if ($remainder -ne 0) {
            $encoded += '=' * (4 - $remainder)
          }
          $scriptPath = Join-Path $env:RUNNER_TEMP 'z2f8b3b3a_apply.py'
          [IO.File]::WriteAllBytes(
            $scriptPath,
            [Convert]::FromBase64String($encoded))
          python -m py_compile $scriptPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $scriptPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish production sources and remove staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout origin/main -- .github/workflows/z2-real-d3d12-shader-execution.yml
          git add `
            .github/workflows/z2-real-d3d12-shader-execution.yml `
            src/native_window_swapchain.hpp `
            src/native_shader_execution_d3d12.cpp `
            src/native_window_swapchain_d3d12.cpp
          git rm -r `
            .z2f8b3b3a `
            .github/workflows/z2f8b3b3a-apply.yml `
            .github/workflows/z2f8b3b3a-materialize.yml
          git commit -m "Z2F-8B3B3A: connect D3D12 shader surfaces to DXGI"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
