name: z2-real-d3d12-shader-execution

on:
  pull_request:
    paths:
      - '.github/workflows/z2-real-d3d12-shader-execution.yml'
      - 'src/native_shader_execution*'
      - 'src/native_shader_surface*'
      - 'src/native_window_swapchain*'
  workflow_dispatch:

concurrency:
  group: z2-real-d3d12-shader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-b3b3a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Extract and apply canonical production patch
        shell: bash
        run: |
          set -euo pipefail
          git show \
            01271ebb6fada967ff9a47c005964f34cd537f15:.github/workflows/z2f8b3b3a-apply.yml \
            > .z2f8b3b3a-original.yml
          sed -n "/python3 - <<'PY'/,/^          PY$/p" \
            .z2f8b3b3a-original.yml \
            | sed '1d;$d;s/^          //' \
            > .z2f8b3b3a_apply.py
          test -s .z2f8b3b3a_apply.py
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/native_shader_execution_d3d12.cpp')
          source_text = source_path.read_text()
          old_start = '            D3D12_RESOURCE_BARRIER to_copy{};\n'
          old_end = (
              '            command_list_->CopyTextureRegion('
              '&destination, 0U, 0U, 0U, &source, nullptr);\n')
          if source_text.count(old_start) != 1 or source_text.count(old_end) != 1:
              raise SystemExit('D3D12 copy block markers are missing or ambiguous')
          first = source_text.index(old_start)
          last = source_text.index(old_end, first) + len(old_end)
          replacement = '''            if (readback != nullptr) {
                D3D12_RESOURCE_BARRIER to_copy{};
                to_copy.Type = D3D12_RESOURCE_BARRIER_TYPE_TRANSITION;
                to_copy.Transition.pResource = output_texture_.Get();
                to_copy.Transition.Subresource = D3D12_RESOURCE_BARRIER_ALL_SUBRESOURCES;
                to_copy.Transition.StateBefore = D3D12_RESOURCE_STATE_UNORDERED_ACCESS;
                to_copy.Transition.StateAfter = D3D12_RESOURCE_STATE_COPY_SOURCE;
                command_list_->ResourceBarrier(1U, &to_copy);

                D3D12_TEXTURE_COPY_LOCATION source{};
                source.pResource = output_texture_.Get();
                source.Type = D3D12_TEXTURE_COPY_TYPE_SUBRESOURCE_INDEX;
                source.SubresourceIndex = 0U;
                D3D12_TEXTURE_COPY_LOCATION destination{};
                destination.pResource = readback_buffer_.Get();
                destination.Type = D3D12_TEXTURE_COPY_TYPE_PLACED_FOOTPRINT;
                destination.PlacedFootprint = readback_footprint_;
                command_list_->CopyTextureRegion(
                    &destination, 0U, 0U, 0U, &source, nullptr);

                D3D12_RESOURCE_BARRIER to_shader = to_copy;
                to_shader.Transition.StateBefore = D3D12_RESOURCE_STATE_COPY_SOURCE;
                to_shader.Transition.StateAfter =
                    D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE;
                command_list_->ResourceBarrier(1U, &to_shader);
            } else {
                D3D12_RESOURCE_BARRIER to_shader{};
                to_shader.Type = D3D12_RESOURCE_BARRIER_TYPE_TRANSITION;
                to_shader.Transition.pResource = output_texture_.Get();
                to_shader.Transition.Subresource =
                    D3D12_RESOURCE_BARRIER_ALL_SUBRESOURCES;
                to_shader.Transition.StateBefore =
                    D3D12_RESOURCE_STATE_UNORDERED_ACCESS;
                to_shader.Transition.StateAfter =
                    D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE;
                command_list_->ResourceBarrier(1U, &to_shader);
            }
            output_state_ = D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE;
          '''
          source_path.write_text(source_text[:first] + replacement + source_text[last:])

          script_path = Path('.z2f8b3b3a_apply.py')
          script = script_path.read_text()
          call_start_marker = (
              "replace_once(\n"
              "    'src/native_shader_execution_d3d12.cpp',\n"
              "    '''            D3D12_RESOURCE_BARRIER to_copy{};")
          call_end_marker = (
              "regex_once(\n"
              "    'src/native_shader_execution_d3d12.cpp',")
          if script.count(call_start_marker) != 1 or script.count(call_end_marker) < 1:
              raise SystemExit('copy-block patch call markers are missing or ambiguous')
          call_start = script.index(call_start_marker)
          call_end = script.index(call_end_marker, call_start)
          script = script[:call_start] + script[call_end:]

          helper_start = script.index('def replace_once(')
          helper_end = script.index('\ndef regex_once(', helper_start)
          flexible_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 1:
                  p.write_text(text.replace(old, new))
                  return
              if count > 1:
                  raise SystemExit(
                      f'{path}: exact literal is ambiguous ({count} matches): '
                      f'{old.splitlines()[0][:120]}')
              tokens = re.split(r'(\\s+)', old)
              pattern = ''.join(
                  r'\\s+' if token.isspace() else re.escape(token)
                  for token in tokens if token)
              matches = list(re.finditer(pattern, text, flags=re.S))
              if len(matches) != 1:
                  raise SystemExit(
                      f'{path}: expected one flexible literal match, got '
                      f'{len(matches)}: {old.splitlines()[0][:120]}')
              match = matches[0]
              p.write_text(text[:match.start()] + new + text[match.end():])

          '''
          script = script[:helper_start] + flexible_helper + script[helper_end + 1:]
          script_path.write_text(script)
          PY
          python3 -m py_compile .z2f8b3b3a_apply.py
          python3 .z2f8b3b3a_apply.py
          rm -f .z2f8b3b3a-original.yml .z2f8b3b3a_apply.py
      - name: Verify materialized source contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'NativeShaderSurfaceView shader_surface;' src/native_window_swapchain.hpp
          grep -Fq 'kNativeShaderExecutionDirectSurfaceExport' src/native_shader_execution_d3d12.cpp
          grep -Fq 'bool export_surface(' src/native_shader_execution_d3d12.cpp
          grep -Fq 'D3D12ShaderSurfaceResolver' src/native_window_swapchain_d3d12.cpp
          grep -Fq 'shader_surface' src/native_window_swapchain_d3d12.cpp
      - name: Publish production sources and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout origin/main -- .github/workflows/z2-real-d3d12-shader-execution.yml
          git add \
            .github/workflows/z2-real-d3d12-shader-execution.yml \
            src/native_window_swapchain.hpp \
            src/native_shader_execution_d3d12.cpp \
            src/native_window_swapchain_d3d12.cpp
          git rm -r \
            .z2f8b3b3a \
            .github/workflows/z2f8b3b3a-apply.yml \
            .github/workflows/z2f8b3b3a-materialize.yml
          git commit -m "Z2F-8B3B3A: connect D3D12 shader surfaces to DXGI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
