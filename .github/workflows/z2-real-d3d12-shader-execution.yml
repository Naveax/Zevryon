name: z2-real-d3d12-shader-execution

on:
  pull_request:
    paths:
      - '.github/workflows/z2-real-d3d12-shader-execution.yml'
      - 'src/native_shader_surface_d3d12.*'
      - 'src/native_window_swapchain_d3d12.cpp'
  workflow_dispatch:

concurrency:
  group: z2-real-d3d12-shader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-descriptor-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply per-image SRV descriptor ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one match, got {count}: '
                      f'{old.splitlines()[0][:120]}')
              file_path.write_text(text.replace(old, new))

          replace_once(
              'src/native_shader_surface_d3d12.hpp',
              '''        ID3D12Device* device,
                  DXGI_FORMAT render_target_format,
                  HRESULT* native_error) noexcept;''',
              '''        ID3D12Device* device,
                  DXGI_FORMAT render_target_format,
                  std::uint32_t descriptor_count,
                  HRESULT* native_error) noexcept;''')
          replace_once(
              'src/native_shader_surface_d3d12.hpp',
              '''        D3D12_CPU_DESCRIPTOR_HANDLE target_rtv,
                  std::uint32_t width,
                  std::uint32_t height,''',
              '''        D3D12_CPU_DESCRIPTOR_HANDLE target_rtv,
                  std::uint32_t descriptor_index,
                  std::uint32_t width,
                  std::uint32_t height,''')
          replace_once(
              'src/native_shader_surface_d3d12.hpp',
              '''    Microsoft::WRL::ComPtr<ID3D12DescriptorHeap> descriptor_heap_;
              DXGI_FORMAT render_target_format_{DXGI_FORMAT_UNKNOWN};''',
              '''    Microsoft::WRL::ComPtr<ID3D12DescriptorHeap> descriptor_heap_;
              DXGI_FORMAT render_target_format_{DXGI_FORMAT_UNKNOWN};
              UINT descriptor_increment_{0U};
              std::uint32_t descriptor_count_{0U};''')

          replace_once(
              'src/native_shader_surface_d3d12.cpp',
              '''    ID3D12Device* device,
              DXGI_FORMAT render_target_format,
              HRESULT* native_error) noexcept {''',
              '''    ID3D12Device* device,
              DXGI_FORMAT render_target_format,
              std::uint32_t descriptor_count,
              HRESULT* native_error) noexcept {''')
          replace_once(
              'src/native_shader_surface_d3d12.cpp',
              '''    if (device == nullptr || render_target_format == DXGI_FORMAT_UNKNOWN) {''',
              '''    if (device == nullptr || render_target_format == DXGI_FORMAT_UNKNOWN ||
                  descriptor_count == 0U) {''')
          replace_once(
              'src/native_shader_surface_d3d12.cpp',
              '''    if (device_ != nullptr && render_target_format_ == render_target_format) {
                  return true;
              }''',
              '''    if (device_ != nullptr &&
                  render_target_format_ == render_target_format &&
                  descriptor_count_ == descriptor_count) {
                  return true;
              }''')
          replace_once(
              'src/native_shader_surface_d3d12.cpp',
              '''    heap.NumDescriptors = 1U;''',
              '''    heap.NumDescriptors = descriptor_count;''')
          replace_once(
              'src/native_shader_surface_d3d12.cpp',
              '''    if (FAILED(result)) {
                  set_error(native_error, result);
                  return false;
              }
          
              device_ = device;
              root_signature_ = std::move(root_signature);''',
              '''    if (FAILED(result)) {
                  set_error(native_error, result);
                  return false;
              }
              const UINT descriptor_increment =
                  device->GetDescriptorHandleIncrementSize(
                      D3D12_DESCRIPTOR_HEAP_TYPE_CBV_SRV_UAV);
              if (descriptor_increment == 0U) {
                  set_error(native_error, E_FAIL);
                  return false;
              }
          
              device_ = device;
              root_signature_ = std::move(root_signature);''')
          replace_once(
              'src/native_shader_surface_d3d12.cpp',
              '''    descriptor_heap_ = std::move(descriptor_heap);
              render_target_format_ = render_target_format;
              return true;''',
              '''    descriptor_heap_ = std::move(descriptor_heap);
              render_target_format_ = render_target_format;
              descriptor_increment_ = descriptor_increment;
              descriptor_count_ = descriptor_count;
              return true;''')
          replace_once(
              'src/native_shader_surface_d3d12.cpp',
              '''    D3D12_CPU_DESCRIPTOR_HANDLE target_rtv,
              std::uint32_t width,
              std::uint32_t height,''',
              '''    D3D12_CPU_DESCRIPTOR_HANDLE target_rtv,
              std::uint32_t descriptor_index,
              std::uint32_t width,
              std::uint32_t height,''')
          replace_once(
              'src/native_shader_surface_d3d12.cpp',
              '''        width == 0U || height == 0U || pipeline_state_ == nullptr ||
                  root_signature_ == nullptr || descriptor_heap_ == nullptr || device_ == nullptr) {''',
              '''        descriptor_index >= descriptor_count_ ||
                  width == 0U || height == 0U || pipeline_state_ == nullptr ||
                  root_signature_ == nullptr || descriptor_heap_ == nullptr ||
                  device_ == nullptr || descriptor_increment_ == 0U) {''')
          replace_once(
              'src/native_shader_surface_d3d12.cpp',
              '''    device_->CreateShaderResourceView(
                  source,
                  &srv,
                  descriptor_heap_->GetCPUDescriptorHandleForHeapStart());''',
              '''    D3D12_CPU_DESCRIPTOR_HANDLE descriptor_cpu =
                  descriptor_heap_->GetCPUDescriptorHandleForHeapStart();
              descriptor_cpu.ptr += static_cast<SIZE_T>(descriptor_index) *
                  descriptor_increment_;
              D3D12_GPU_DESCRIPTOR_HANDLE descriptor_gpu =
                  descriptor_heap_->GetGPUDescriptorHandleForHeapStart();
              descriptor_gpu.ptr += static_cast<UINT64>(descriptor_index) *
                  descriptor_increment_;
              device_->CreateShaderResourceView(source, &srv, descriptor_cpu);''')
          replace_once(
              'src/native_shader_surface_d3d12.cpp',
              '''    command_list->SetGraphicsRootDescriptorTable(
                  0U,
                  descriptor_heap_->GetGPUDescriptorHandleForHeapStart());''',
              '''    command_list->SetGraphicsRootDescriptorTable(0U, descriptor_gpu);''')
          replace_once(
              'src/native_shader_surface_d3d12.cpp',
              '''    render_target_format_ = DXGI_FORMAT_UNKNOWN;
              }''',
              '''    render_target_format_ = DXGI_FORMAT_UNKNOWN;
              descriptor_increment_ = 0U;
              descriptor_count_ = 0U;
              }''')

          replace_once(
              'src/native_window_swapchain_d3d12.cpp',
              '''      new_device.Get(),
                    map_format(config.surface.format),
                    &resolver_result))''',
              '''      new_device.Get(),
                    map_format(config.surface.format),
                    config.image_count,
                    &resolver_result))''')
          replace_once(
              'src/native_window_swapchain_d3d12.cpp',
              '''          slot.resource.Get(),
                    slot.rtv,
                    snapshot_.config.surface.width,''',
              '''          slot.resource.Get(),
                    slot.rtv,
                    index,
                    snapshot_.config.surface.width,''')
          PY
          git diff --check
      - name: Verify descriptor-slot contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'std::uint32_t descriptor_count' src/native_shader_surface_d3d12.hpp
          grep -Fq 'std::uint32_t descriptor_index' src/native_shader_surface_d3d12.hpp
          grep -Fq 'descriptor_index >= descriptor_count_' src/native_shader_surface_d3d12.cpp
          grep -Fq 'heap.NumDescriptors = descriptor_count;' src/native_shader_surface_d3d12.cpp
          grep -Fq 'config.image_count,' src/native_window_swapchain_d3d12.cpp
          grep -Fq 'slot.rtv,' src/native_window_swapchain_d3d12.cpp
      - name: Publish production changes and restore CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout origin/main -- .github/workflows/z2-real-d3d12-shader-execution.yml
          git add \
            .github/workflows/z2-real-d3d12-shader-execution.yml \
            src/native_shader_surface_d3d12.hpp \
            src/native_shader_surface_d3d12.cpp \
            src/native_window_swapchain_d3d12.cpp
          git commit -m "Z2F-8B3B3A: isolate D3D12 SRVs per swapchain image"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
