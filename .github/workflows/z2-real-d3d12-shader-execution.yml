name: z2f8b3b3a-stale-accounting

on:
  pull_request:
    paths:
      - '.github/workflows/z2-real-d3d12-shader-execution.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-stale-accounting:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch production accounting
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          path = Path('src/native_window_swapchain_d3d12.cpp')
          text = path.read_text()
          pattern = re.compile(
              r'(?P<indent>[ \t]*)return fail\('
              r'error, NativeWindowSwapchainErrorKind::StaleGeneration,\s*'
              r'"Direct3D 12 shader surface is stale or incompatible"\);')
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(
                  f'expected one shader-surface stale return, got {len(matches)}')
          match = matches[0]
          indent = match.group('indent')
          replacement = (
              f'{indent}snapshot_.stale_rejections += 1U;\n'
              f'{match.group(0)}')
          path.write_text(text[:match.start()] + replacement + text[match.end():])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish production fix and restore focused CI
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout ba059a5fbc8db7796443ff25b148e2d859892554 -- .github/workflows/z2-real-d3d12-shader-execution.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add .github/workflows/z2-real-d3d12-shader-execution.yml src/native_window_swapchain_d3d12.cpp
          git commit -m "Account rejected D3D12 shader-surface generations"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
