name: z2-real-d3d12-shader-execution

on:
  pull_request:
    paths:
      - '.github/workflows/z2-real-d3d12-shader-execution.yml'
      - 'cmake/native_shader_execution.cmake'
      - 'cmake/shader_draw_packet.cmake'
      - 'src/native_shader_execution*'
      - 'src/native_shader_surface*'
      - 'src/native_window_swapchain*'
      - 'tests/native_shader_execution*'
      - 'docs/Z2F8B3B2A_REAL_D3D12_SHADER_EXECUTION.md'
  workflow_dispatch:

concurrency:
  group: z2-real-d3d12-shader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-b3b3a:
    if: github.event_name == 'pull_request' && hashFiles('.z2f8b3b3a/part00') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Decode and apply exact production patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .z2f8b3b3a/part00 \
            .z2f8b3b3a/part01 \
            .z2f8b3b3a/part02 \
            .z2f8b3b3a/part03 \
            .z2f8b3b3a/part04 \
            | base64 -d > /tmp/z2f8b3b3a_apply.py
          python3 -m py_compile /tmp/z2f8b3b3a_apply.py
          python3 /tmp/z2f8b3b3a_apply.py
      - name: Publish production sources and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout origin/main -- .github/workflows/z2-real-d3d12-shader-execution.yml
          git add \
            .github/workflows/z2-real-d3d12-shader-execution.yml \
            src/native_window_swapchain.hpp \
            src/native_shader_execution_d3d12.cpp \
            src/native_window_swapchain_d3d12.cpp
          git rm -r \
            .z2f8b3b3a \
            .github/workflows/z2f8b3b3a-apply.yml \
            .github/workflows/z2f8b3b3a-materialize.yml
          git commit -m "Z2F-8B3B3A: connect D3D12 shader surfaces to DXGI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  portable-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict portable build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build and run portable contract
        run: |
          cmake --build build --parallel 2 --target \
            zevryon-native-shader-execution-stub-tests \
            zevryon-shader-draw-packet-tests \
            zevryon-shader-draw-packet-equivalence-tests
          ./build/zevryon-native-shader-execution-stub-tests
          ./build/zevryon-shader-draw-packet-tests
          ./build/zevryon-shader-draw-packet-equivalence-tests

  portable-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable sanitizers
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_SANITIZERS=ON
      - name: Build and run under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --build build --parallel 2 --target \
            zevryon-native-shader-execution-stub-tests \
            zevryon-shader-draw-packet-tests
          ./build/zevryon-native-shader-execution-stub-tests
          ./build/zevryon-shader-draw-packet-tests

  real-d3d12:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC and Direct3D 12 build
        shell: pwsh
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build focused targets
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target zevryon-native-shader-execution-d3d12-tests
          cmake --build build --config Release --parallel 2 --target zevryon-native-shader-execution-d3d12-benchmark
      - name: Repeat real GPU readback certification
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            ./build/Release/zevryon-native-shader-execution-d3d12-tests.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run three benchmark distributions
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            ./build/Release/zevryon-native-shader-execution-d3d12-benchmark.exe 64 `
              | Out-File -Encoding utf8 "d3d12-shader-benchmark-$_.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Enforce exact topology, equivalence and latency gates
        shell: pwsh
        run: |
          @'
          def load(path):
              values = {}
              with open(path, encoding='utf-8-sig') as handle:
                  for line in handle:
                      key, value = line.strip().split('=', 1)
                      values[key] = value
              return values

          rows = [load(f'd3d12-shader-benchmark-{run}.txt') for run in range(1, 4)]
          reference = int(rows[0]['reference_checksum'])
          for row in rows:
              assert row['schema'] == 'zevryon.d3d12-integer-shader-execution.v1'
              assert int(row['iterations']) == 64
              assert int(row['samples']) == 64
              assert int(row['commands']) == 68
              assert int(row['fill_instances']) == 65
              assert int(row['glyph_instances']) == 240
              assert int(row['resident_pages']) == 3
              assert int(row['resident_atlas_bytes']) == 49152
              assert int(row['output_surface_bytes']) == 921600
              assert int(row['atlas_upload_batches']) == 1
              assert int(row['atlas_reuses']) >= 64
              assert int(row['reference_checksum']) == reference
              assert int(row['gpu_checksum']) == reference
              p50 = float(row['p50_ms'])
              p95 = float(row['p95_ms'])
              p99 = float(row['p99_ms'])
              maximum = float(row['max_ms'])
              assert 0.0 < p50 <= p95 <= p99 <= maximum
              assert p95 <= 20.0, row
              assert p99 <= 25.0, row
              assert maximum <= 40.0, row
          print({
              'checksum': reference,
              'p50_ms': [float(row['p50_ms']) for row in rows],
              'p95_ms': [float(row['p95_ms']) for row in rows],
              'p99_ms': [float(row['p99_ms']) for row in rows],
              'maximum_ms': [float(row['max_ms']) for row in rows],
          })
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-real-d3d12-shader-${{ github.sha }}
          path: |
            d3d12-shader-benchmark-*.txt
          if-no-files-found: warn
