name: z2-prepared-harfbuzz-face-cache

on:
  pull_request:
    paths:
      - '.github/workflows/z2-prepared-harfbuzz-face-cache.yml'
      - 'cmake/harfbuzz_shaping.cmake'
      - 'src/catalog_harfbuzz_shaper.*'
      - 'src/prepared_harfbuzz_face_cache.*'
      - 'src/prepared_harfbuzz_face.*'
      - 'tests/prepared_harfbuzz_face_cache_tests.cpp'
      - 'docs/Z2B12A_PREPARED_HARFBUZZ_FACE_CACHE.md'
  workflow_dispatch:

concurrency:
  group: z2-prepared-harfbuzz-face-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz and real-font fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libharfbuzz-dev \
            fonts-dejavu-core
      - name: Configure strict Release build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON \
            -DZEVRYON_TEST_FONT_LATIN=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Build prepared-face cache dependency chain
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-prepared-harfbuzz-face-cache-tests \
            zevryon-prepared-harfbuzz-face-tests \
            zevryon-prepared-harfbuzz-shaping-tests \
            2>&1 | tee prepared-harfbuzz-face-cache-build.log
      - name: Repeat cache concurrency and LRU certification
        run: |
          set -o pipefail
          ctest --test-dir build \
            -R '^prepared-harfbuzz-face-cache-tests$' \
            --repeat until-fail:20 \
            --output-on-failure \
            2>&1 | tee prepared-harfbuzz-face-cache-repeat.log
      - name: Run ownership and prepared shaping dependencies
        run: |
          set -o pipefail
          ctest --test-dir build \
            -R '^(prepared-harfbuzz-face-tests|prepared-harfbuzz-shaping-tests)$' \
            --output-on-failure \
            2>&1 | tee prepared-harfbuzz-face-cache-dependencies.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-prepared-harfbuzz-face-cache-${{ github.sha }}
          path: |
            prepared-harfbuzz-face-cache-build.log
            prepared-harfbuzz-face-cache-repeat.log
            prepared-harfbuzz-face-cache-dependencies.log
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz and real-font fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libharfbuzz-dev \
            fonts-dejavu-core
      - name: Configure ASan and UBSan build
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DZEVRYON_ENABLE_SANITIZERS=ON \
            -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON \
            -DZEVRYON_TEST_FONT_LATIN=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Build prepared-face cache dependency chain under sanitizers
        run: |
          set -o pipefail
          cmake --build build-sanitized --parallel 2 --target \
            zevryon-prepared-harfbuzz-face-cache-tests \
            zevryon-prepared-harfbuzz-face-tests \
            zevryon-prepared-harfbuzz-shaping-tests \
            2>&1 | tee prepared-harfbuzz-face-cache-sanitizer-build.log
      - name: Run prepared-face cache chain under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -o pipefail
          ctest --test-dir build-sanitized \
            -R '^(prepared-harfbuzz-face-cache-tests|prepared-harfbuzz-face-tests|prepared-harfbuzz-shaping-tests)$' \
            --output-on-failure \
            2>&1 | tee prepared-harfbuzz-face-cache-sanitizer-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-prepared-harfbuzz-face-cache-sanitized-${{ github.sha }}
          path: |
            prepared-harfbuzz-face-cache-sanitizer-build.log
            prepared-harfbuzz-face-cache-sanitizer-test.log
          if-no-files-found: warn
