name: Z7 DOCTYPE NUL production builder v1

on:
  push:
    branches:
      - candidate/z7-tokenizer-doctype-nul-production-v1

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/z7-tokenizer-doctype-nul-production-v1

      - name: Apply exact tested DOCTYPE NUL candidate
        run: |
          set -euo pipefail
          git fetch --no-tags origin 8fd9a3914f07da49b4b6326868f5c75cf765500f
          git show 8fd9a3914f07da49b4b6326868f5c75cf765500f:scripts/apply_z7_tokenizer_doctype_nul_semantics_v1.py > /tmp/apply.py
          python3 /tmp/apply.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py')
          s = p.read_text(encoding='utf-8').replace(
              '# Diagnostic admission: ordinary Data NUL plus the complete pinned\n    # DOCTYPE-NUL family. Comment/tag NUL remains fail closed.',
              '# Ordinary Data NUL and the complete pinned DOCTYPE-NUL family are\n    # admitted. Comment/tag NUL remains fail closed.')
          p.write_text(s, encoding='utf-8')
          p = Path('docs/Z7_HTML_TOKENIZER_MARKUP_DECLARATIONS_V1.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '- raw NUL replacement/input-stream preprocessing;\n',
              '- raw NUL handling outside the admitted DOCTYPE state machine, including comment/bogus-comment input preprocessing;\n')
          s = s.replace(
              '- EOF-in-DOCTYPE handling with force-quirks;\n',
              '- EOF-in-DOCTYPE handling with force-quirks;\n- DOCTYPE U+0000 handling with `unexpected-null-character`, U+FFFD replacement in name/identifier payload states, and recovery-error-before-NUL ordering when reconsumed through bogus DOCTYPE;\n')
          s = s.replace(
              'this bounded recovery-state admission is accepted only at the measured **6819 pass / 122 fail / 95 unsupported / 7036 total** distribution.',
              'this bounded recovery-state admission measured **6819 pass / 122 fail / 95 unsupported / 7036 total**; after ordinary Data-state NUL, the complete DOCTYPE-NUL admission is accepted only at **6855 pass / 122 fail / 59 unsupported / 7036 total**.')
          s = s.replace(
              '- retained unproven before-identifier transition, comment, bogus-comment, and NUL fail-closed boundaries.\n',
              '- DOCTYPE NUL replacement and recovery ordering across name, quoted public/system identifiers, post-name/keyword/identifier transitions, and bogus DOCTYPE;\n- retained unproven non-ASCII before-identifier transitions plus comment/bogus-comment fail-closed boundaries.\n')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON

      - name: Build focused tokenizer targets
        run: cmake --build build --parallel 2 --target zevryon-html-tokenizer-markup-declarations-v1-tests zevryon-html-tokenizer-token-stream-v1-tests zevryon-html-tokenizer-token-stream-v1-probe

      - name: Run focused tests
        run: |
          ./build/zevryon-html-tokenizer-markup-declarations-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests

      - name: Verify exact corpus movement
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --policy no-regression --probe build/zevryon-html-tokenizer-token-stream-v1-probe > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('census.json').read_text())
          assert (r['executions'],r['passed'],r['failed'],r['unsupported'])==(7036,6855,122,59),r
          assert r['reason_counts'].get('unsupported:input-preprocessing-nul',0)==25,r
          assert r['reason_counts'].get('failed:parse-error-stream-mismatch',0)==113,r
          assert r['reason_counts'].get('failed:token-stream-mismatch',0)==9,r
          assert r['reason_counts'].get('failed:common-stats-mismatch',0)==0,r
          assert r['baseline_policy']=='no-regression' and r['baseline_regression_free'] is True,r
          assert r['full_corpus_pass_claim'] is False and r['html_tokenizer_conformance_claim'] is False and r['z7_status_change'] is False,r
          PY

      - name: Commit production diff and self-clean builder
        run: |
          set -euo pipefail
          rm -f census.json .github/workflows/z7_tokenizer_doctype_nul_production_builder_v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/html_tokenizer_markup_declarations_v1.cpp tests/html_tokenizer_markup_declarations_v1_tests.cpp scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py docs/Z7_HTML_TOKENIZER_MARKUP_DECLARATIONS_V1.md .github/workflows/z7_tokenizer_doctype_nul_production_builder_v1.yml
          git diff --cached --check
          git commit -m "Z7: admit DOCTYPE NUL semantics"
          git push origin HEAD:candidate/z7-tokenizer-doctype-nul-production-v1
