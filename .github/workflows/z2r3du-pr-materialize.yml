name: Z2R-3D-U PR materializer

on:
  pull_request:
    paths:
      - ".github/workflows/z2r3du-pr-materialize.yml"
      - ".z2r3du/**"

permissions:
  contents: write

concurrency:
  group: z2r3du-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/z2r3d-unicode-promotion-readiness
          fetch-depth: 0
      - name: Verify and apply non-workflow implementation
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import shutil
          import subprocess
          from pathlib import Path

          root = Path('.z2r3du')
          expected_parts = [
              '16480e7bbeb7190e9b8df0556bc7ee92ba986c2f8221596e8ee19741cc604ce5',
              'd9574a15b611c08ea6e99206b6b73eedb6ffcb312f99f77506f7acb08f314265',
              'bdb6ebf38b7fb44430c8be4ee7e706b88514e9dcf6c662f58b39abc23921f42b',
              'e41424d57688dabcf1d8bfb48e32d993a0f3fc4d068e93c0b701d855c7a55328',
              '5a17de62ff3b0c52912533ffea848e6bab397bc70b6d9adfc272b454ff6866a9',
              'f703afdcb3d9c976af1cdef439509ca09a6ebf08bd8decdde2d34038fdb60b80',
              '34f4a31bd52e70f22a96285d65a1068c195498af0859be8098ee2d6ba1acdc3c',
              '2e3a4be71af0181fffbb7d6d5eac41c802cfd3a7fdf97770f62b6c2f520e1ce1',
              '7e21a6780805e6f85056bd10fdd358778c203b3e0d6c2555938310ce8a5472cc',
          ]
          parts = sorted(root.glob('payload-*.txt'))
          if len(parts) != len(expected_parts):
              raise RuntimeError(f'expected 9 payload parts, found {len(parts)}')

          payload_parts = []
          for path, expected_sha in zip(parts, expected_parts, strict=True):
              data = path.read_bytes()
              actual_sha = hashlib.sha256(data).hexdigest()
              if actual_sha != expected_sha:
                  raise RuntimeError(f'{path} SHA-256 mismatch: {actual_sha}')
              payload_parts.append(data.decode('ascii'))

          payload = ''.join(payload_parts)
          expected_payload_sha = 'e4f3ff950f1b1f469080fa1175788a39ea7b05c737ef28297d233d8bfa082475'
          actual_payload_sha = hashlib.sha256(payload.encode('ascii')).hexdigest()
          if actual_payload_sha != expected_payload_sha:
              raise RuntimeError(f'combined payload SHA-256 mismatch: {actual_payload_sha}')

          compressed = base64.b64decode(payload, validate=True)
          code = gzip.decompress(compressed).decode('utf-8')
          exec(compile(code, 'z2r3du-materializer', 'exec'))

          permanent_workflow = Path('.github/workflows/z2r3d-unicode-promotion-readiness.yml')
          if not permanent_workflow.is_file():
              raise RuntimeError('permanent workflow was not materialized')
          permanent_workflow.unlink()
          subprocess.run(
              ['git', 'checkout', '--', '.github/workflows/z2r3du-materialize.yml'],
              check=True,
          )
          shutil.rmtree(root)
          PY
      - name: Commit non-workflow implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Z2R-3D-U: add Unicode promotion readiness implementation"
          git push origin HEAD:agent/z2r3d-unicode-promotion-readiness
