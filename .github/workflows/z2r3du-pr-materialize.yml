name: Z2R-3D-U PR materializer

on:
  pull_request:
    paths:
      - ".github/workflows/z2r3du-materialize.yml"
      - ".github/workflows/z2r3du-pr-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/z2r3d-unicode-promotion-readiness
          fetch-depth: 0
      - name: Extract stored payload for exact comparison
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          text = Path('.github/workflows/z2r3du-materialize.yml').read_text(encoding='utf-8')
          match = re.search(r'^\s*MATERIALIZER_B64:\s*(\S+)\s*$', text, re.MULTILINE)
          if match is None:
              raise RuntimeError('materializer payload not found')
          payload = match.group(1)
          out = Path('evidence/z2r3du-bootstrap')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'stored-payload.txt').write_text(payload, encoding='ascii')
          (out / 'metadata.json').write_text(json.dumps({
              'length': len(payload),
              'sha256': hashlib.sha256(payload.encode('ascii')).hexdigest(),
          }, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload stored payload
        uses: actions/upload-artifact@v4
        with:
          name: z2r3du-stored-payload-${{ github.sha }}
          path: evidence/z2r3du-bootstrap
          if-no-files-found: error
