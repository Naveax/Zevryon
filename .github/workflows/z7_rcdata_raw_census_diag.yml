name: Z7 RCDATA raw census diagnostic

on:
  push:
    branches:
      - candidate/z7-rcdata-rawtext-empty-last-start-tag-v1
    paths:
      - '.github/workflows/z7_rcdata_raw_census_diag.yml'

permissions:
  contents: read

jobs:
  raw-census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install focused build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build canonical tokenizer probe
        run: cmake --build build --parallel 2 --target zevryon-html-tokenizer-token-stream-v1-probe
      - name: Print raw census
        run: python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --probe build/zevryon-html-tokenizer-token-stream-v1-probe
