name: bootstrap-z2f6

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'work/z2f-bounded-native-damage-presentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-native-damage-presentation
      - name: Materialize verified payload when missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f src/native_damage_presentation.cpp ]]; then
            cat .z2f6/part* | base64 --decode > /tmp/z2f6-payload.tar.gz
            echo "85e75e3966e9b735a6b7ed22cc4aa66201f9b7a7434ec1d5fcf4a1665788bb82  /tmp/z2f6-payload.tar.gz" | sha256sum -c -
            gzip -t /tmp/z2f6-payload.tar.gz
            tar -xzf /tmp/z2f6-payload.tar.gz
            python3 - <<'PY'
          from pathlib import Path
          path = Path('cmake/gpu_device_presentation.cmake')
          text = path.read_text(encoding='utf-8')
          include = 'include("${CMAKE_CURRENT_LIST_DIR}/native_damage_presentation.cmake")'
          if include not in text:
              path.write_text(text.rstrip() + '\n\n' + include + '\n', encoding='utf-8')
          PY
          fi
      - name: Apply fail-closed hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/native_damage_presentation.cpp')
          text = path.read_text(encoding='utf-8')
          helper_anchor = '''bool checked_mul_u64(
              std::uint64_t left,
              std::uint64_t right,
              std::uint64_t* output) noexcept {
              if (left != 0U && right > std::numeric_limits<std::uint64_t>::max() / left) {
                  return false;
              }
              *output = left * right;
              return true;
          }
          '''
          helper = helper_anchor + '''
          bool redraw_threshold_reached(
              std::uint64_t total_area,
              std::uint64_t full_area,
              std::uint32_t threshold_permille,
              bool* reached) noexcept {
              if (reached == nullptr || threshold_permille > 1'000U) {
                  return false;
              }
              if (threshold_permille == 0U || full_area == 0U) {
                  *reached = false;
                  return true;
              }
              const std::uint64_t quotient = full_area / 1'000U;
              const std::uint64_t remainder = full_area % 1'000U;
              std::uint64_t quotient_part = 0U;
              std::uint64_t remainder_part = 0U;
              if (!checked_mul_u64(
                      quotient,
                      threshold_permille,
                      &quotient_part) ||
                  !checked_mul_u64(
                      remainder,
                      threshold_permille,
                      &remainder_part)) {
                  return false;
              }
              const std::uint64_t rounded_remainder =
                  (remainder_part + 999U) / 1'000U;
              std::uint64_t threshold_area = 0U;
              if (!checked_add_u64(
                      quotient_part,
                      rounded_remainder,
                      &threshold_area)) {
                  return false;
              }
              *reached = total_area >= threshold_area;
              return true;
          }
          '''
          if 'bool redraw_threshold_reached(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('checked_mul_u64 anchor missing')
              text = text.replace(helper_anchor, helper, 1)
          old_threshold = '''        if (request.policy.full_redraw_threshold_permille != 0U &&
              full_area != 0U &&
              total_area * 1'000U >=
                  full_area * request.policy.full_redraw_threshold_permille) {
              staged.damage_rects.clear();
              staged.damage_rects.push_back(surface_rect(request.frame->surface));
              staged.full_redraw = 1U;
              total_area = full_area;
          }
          '''
          new_threshold = '''        bool collapse_to_full_redraw = false;
          if (!redraw_threshold_reached(
                  total_area,
                  full_area,
                  request.policy.full_redraw_threshold_permille,
                  &collapse_to_full_redraw)) {
              set_build_error(
                  error,
                  NativeCommandBuildErrorKind::ArithmeticOverflow,
                  "full-redraw threshold overflow");
              return false;
          }
          if (collapse_to_full_redraw) {
              staged.damage_rects.clear();
              staged.damage_rects.push_back(surface_rect(request.frame->surface));
              staged.full_redraw = 1U;
              total_area = full_area;
          }
          '''
          if old_threshold in text:
              text = text.replace(old_threshold, new_threshold, 1)
          old_receipt = '''    if (receipt.status != NativePresentStatus::Presented) {
              return receipt.ticket_id != 0U;
          }
          '''
          new_receipt = '''    if (receipt.status != NativePresentStatus::Presented) {
              return false;
          }
          '''
          if old_receipt in text:
              text = text.replace(old_receipt, new_receipt, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit implementation and hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native_damage_presentation.* tests/native_damage_presentation_* cmake/native_damage_presentation.cmake cmake/gpu_device_presentation.cmake docs/Z2F6_BOUNDED_NATIVE_DAMAGE_PRESENTATION.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Harden bounded native damage presentation"
          git push origin HEAD:work/z2f-bounded-native-damage-presentation
