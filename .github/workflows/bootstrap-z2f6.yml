name: bootstrap-z2f6

on:
  push:
    branches:
      - work/z2f-bounded-native-damage-presentation

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Bootstrap Z2F-6 payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-native-damage-presentation
      - name: Materialize verified payload
        run: |
          cat .z2f6/part* | base64 -d > /tmp/z2f6-payload.tar.gz
          echo "85e75e3966e9b735a6b7ed22cc4aa66201f9b7a7434ec1d5fcf4a1665788bb82  /tmp/z2f6-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/z2f6-payload.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cmake/gpu_device_presentation.cmake')
          text = path.read_text(encoding='utf-8')
          include = 'include("${CMAKE_CURRENT_LIST_DIR}/native_damage_presentation.cmake")'
          if include not in text:
              path.write_text(text.rstrip() + '\n\n' + include + '\n', encoding='utf-8')
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native_damage_presentation.* tests/native_damage_presentation_* cmake/native_damage_presentation.cmake cmake/gpu_device_presentation.cmake docs/Z2F6_BOUNDED_NATIVE_DAMAGE_PRESENTATION.md
          git commit -m "Implement bounded native damage presentation"
          git push origin HEAD:work/z2f-bounded-native-damage-presentation
