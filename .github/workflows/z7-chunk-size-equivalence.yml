name: Z7 chunk-size equivalence

on:
  pull_request:
    paths:
      - 'tests/streaming_html_chunk_size_equivalence_tests.cpp'
      - 'src/streaming_html_node_source_v2.cpp'
      - 'src/streaming_html_node_source_v2.hpp'
      - 'src/logical_node_source_v2.cpp'
      - 'src/logical_node_source_v2.hpp'
      - '.github/workflows/z7-chunk-size-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Attach dedicated authority target
        shell: bash
        run: |
          cat >> cmake/logical_node_arena.cmake <<'EOF'
          if(BUILD_TESTING)
            add_executable(
              zevryon-streaming-html-chunk-size-equivalence-tests
              tests/streaming_html_chunk_size_equivalence_tests.cpp)
            target_link_libraries(
              zevryon-streaming-html-chunk-size-equivalence-tests
              PRIVATE zevryon-massivedoc-core)
            zevryon_options(zevryon-streaming-html-chunk-size-equivalence-tests)
          endif()
          EOF
      - name: Configure
        run: cmake -S . -B build-z7-chunk -G Ninja -DBUILD_TESTING=ON
      - name: Build authority target
        run: cmake --build build-z7-chunk --target zevryon-streaming-html-chunk-size-equivalence-tests
      - name: Execute authority
        run: ./build-z7-chunk/zevryon-streaming-html-chunk-size-equivalence-tests
