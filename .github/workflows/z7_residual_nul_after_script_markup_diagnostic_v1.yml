name: Z7 residual NUL after Script/markup diagnostic v1

on:
  push:
    branches:
      - diagnostic/z7-residual-nul-after-script-markup-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure and build tokenizer probe
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DZEVRYON_ENABLE_RUST_CORE=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
          cmake --build build --parallel 2 --target zevryon-html-tokenizer-token-stream-v1-probe
      - name: Open only residual NUL pre-execution gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py')
          s=p.read_text(encoding='utf-8')
          old='    if "\\x00" in input_text:\n'
          new='    if False and "\\x00" in input_text:\n'
          if s.count(old) != 1:
              raise SystemExit(f'NUL gate anchor drift: {s.count(old)}')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
      - name: Run diagnostic full corpus
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py \
            --probe build/zevryon-html-tokenizer-token-stream-v1-probe \
            > nul-diagnostic.json
          python3 - <<'PY'
          import json
          r=json.load(open('nul-diagnostic.json'))
          print('RESIDUAL_NUL_DIAGNOSTIC_TOTALS',r['passed'],r['failed'],r['unsupported'])
          print('REASONS')
          for k,v in sorted(r['reason_counts'].items()):
              if v and ('nul' in k.lower() or k.startswith('failed:') or k.startswith('unsupported:production-fail-closed')):
                  print(v,k)
          print('FAILURE_SAMPLES')
          for x in r['failure_samples']:
              print(x)
          print('UNSUPPORTED_SAMPLES')
          for x in r['unsupported_samples']:
              if 'NUL' in x['label'] or 'nul' in x['reason'].lower():
                  print(x)
          if r['failed'] != 0:
              raise SystemExit('Residual NUL gate opening exposed failures; diagnostic evidence retained in logs')
          PY
