name: Z7 residual markup NUL canonical production builder v2

on:
  push:
    branches:
      - candidate/z7-residual-markup-nul-canonical-production-v2

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/z7-residual-markup-nul-canonical-production-v2

      - name: Apply bounded residual markup NUL candidate
        run: |
          set -euo pipefail
          python3 scripts/apply_z7_residual_markup_nul_canonical_production_v2.py
          git diff --check

      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_RUST_CORE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON

      - name: Build focused tokenizer targets
        run: cmake --build build --parallel 2 --target zevryon-html-tokenizer-markup-declarations-v1-tests zevryon-html-tokenizer-token-stream-v1-tests zevryon-html-tokenizer-token-stream-v1-probe

      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build/zevryon-html-tokenizer-markup-declarations-v1-tests
          ./build/zevryon-html-tokenizer-token-stream-v1-tests

      - name: Verify exact corpus movement
        run: |
          set -euo pipefail
          python3 scripts/z7_html5lib_tokenizer_corpus_verify.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --self-test
          python3 scripts/z7_html5lib_tokenizer_full_corpus_census_v9_baseline.py --policy no-regression --probe build/zevryon-html-tokenizer-token-stream-v1-probe > census.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('census.json').read_text())
          assert (r['files'],r['tests'],r['executions'])==(14,6810,7036),r
          assert (r['passed'],r['failed'],r['unsupported'])==(7016,0,20),r
          assert r['reason_counts'].get('unsupported:input-preprocessing-nul',0)==0,r
          assert r['reason_counts'].get('unsupported:non-utf8-scalar-test-data',0)==4,r
          assert r['reason_counts'].get('unsupported:xml-violation-infoset-coercion',0)==4,r
          assert r['baseline_policy']=='no-regression' and r['baseline_regression_free'] is True,r
          assert r['full_corpus_pass_claim'] is False and r['html_tokenizer_conformance_claim'] is False and r['z7_status_change'] is False,r
          PY

      - name: Commit production diff and self-clean builder
        run: |
          set -euo pipefail
          rm -f census.json scripts/apply_z7_residual_markup_nul_canonical_production_v2.py .github/workflows/z7_residual_markup_nul_canonical_production_builder_v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/html_tokenizer_markup_declarations_v1.cpp tests/html_tokenizer_markup_declarations_v1_tests.cpp scripts/z7_html5lib_tokenizer_full_corpus_census_v1.py scripts/apply_z7_residual_markup_nul_canonical_production_v2.py .github/workflows/z7_residual_markup_nul_canonical_production_builder_v2.yml
          git diff --cached --check
          git commit -m "Z7: admit residual markup bogus-comment NUL semantics"
          git push origin HEAD:candidate/z7-residual-markup-nul-canonical-production-v2
