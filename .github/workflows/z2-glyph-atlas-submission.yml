name: z2-glyph-atlas-submission

on:
  pull_request:
    paths:
      - '.github/workflows/z2-glyph-atlas-submission.yml'
      - 'cmake/glyph_atlas_submission.cmake'
      - 'cmake/text_paint_command_stream.cmake'
      - 'src/glyph_atlas_submission.*'
      - 'src/text_paint_command_stream.*'
      - 'src/multi_run_harfbuzz_shaper.*'
      - 'src/ledger_memory_resource.*'
      - 'src/resource_ledger.*'
      - 'tests/glyph_atlas_submission_tests.cpp'
      - 'tests/glyph_atlas_equivalence_tests.cpp'
      - 'docs/Z2F2_BOUNDED_GLYPH_RASTER_ATLAS_SUBMISSION.md'
  workflow_dispatch:

concurrency:
  group: z2-glyph-atlas-submission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-glyph-atlas-submission-tests \
            zevryon-glyph-atlas-equivalence-tests \
            zevryon-glyph-atlas-submission-benchmark \
            zevryon-text-paint-command-stream-tests \
            2>&1 | tee glyph-atlas-build.log
      - name: Repeat focused certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^glyph-atlas-submission-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee glyph-atlas-repeat.log
      - name: Exhaustively certify keys and batching
        run: |
          set -o pipefail
          ctest --test-dir build -R '^glyph-atlas-equivalence-tests$' \
            --output-on-failure 2>&1 | tee glyph-atlas-equivalence.log
      - name: Run three independent distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-glyph-atlas-submission-benchmark \
              > "glyph-atlas-benchmark-${run}.json"
          done
      - name: Enforce exact output, cache and latency gates
        run: |
          python3 - <<'PY'
          import json

          rows = []
          for run in range(1, 4):
              with open(f'glyph-atlas-benchmark-{run}.json', encoding='utf-8') as handle:
                  row = json.load(handle)
              assert row['schema'] == 'zevryon.glyph-atlas-submission-benchmark.v1'
              assert row['input_document_lines'] == 16_384
              assert row['input_projected_lines'] == 80
              assert row['input_glyph_uses'] == 320
              assert row['working_set_unique_keys'] == 96
              assert row['working_set_uses'] == 320
              assert row['grayscale_keys'] == 64
              assert row['lcd_keys'] == 16
              assert row['color_keys'] == 16
              assert row['cold_cache_misses'] == 96
              assert row['cold_uploads'] == 96
              assert row['cold_upload_bytes'] == 16_896
              assert row['hot_cache_hits'] == 96
              assert row['hot_uploads'] == 0
              assert row['draw_instances'] == 320
              assert row['draw_batches'] == 80
              assert row['coalesced_instances'] == 240
              assert row['raster_key_bytes'] == 32
              assert row['working_set_entry_bytes'] == 48
              assert row['working_set_use_bytes'] == 48
              assert row['source_record_bytes'] == 88
              assert row['page_record_bytes'] == 48
              assert row['cache_entry_bytes'] == 96
              assert row['upload_record_bytes'] == 64
              assert row['draw_instance_bytes'] == 64
              assert row['draw_batch_bytes'] == 32
              assert row['output_current_bytes'] == 43_008
              assert row['output_peak_bytes'] == 58_368
              assert row['output_hard_limit_bytes'] == 58_368
              assert row['cache_current_bytes'] == 9_360
              assert row['cache_peak_bytes'] == 18_723
              assert row['cache_hard_limit_bytes'] == 18_723
              assert row['cache_pages'] == 3
              assert row['cache_entries'] == 96
              assert row['cache_resets'] == 0
              assert row['cache_evictions'] == 0
              assert row['checksum'] == 5_598_703_025_695_070_182
              assert row['expected_checksum'] == row['checksum']
              assert row['output_accounting_clean'] is True
              assert row['cache_accounting_clean'] is True
              assert 0.0 < row['p50_ms'] <= row['p95_ms'] <= row['p99_ms'] <= row['maximum_ms']
              assert row['p95_ms'] <= 4.0, row
              assert row['p99_ms'] <= 7.0, row
              assert row['maximum_ms'] <= 15.0, row
              rows.append(row)
          assert len({row['checksum'] for row in rows}) == 1
          print({
              'p50_ms': [row['p50_ms'] for row in rows],
              'p95_ms': [row['p95_ms'] for row in rows],
              'p99_ms': [row['p99_ms'] for row in rows],
              'maximum_ms': [row['maximum_ms'] for row in rows],
              'checksum': rows[0]['checksum'],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-glyph-atlas-submission-${{ github.sha }}
          path: |
            glyph-atlas-build.log
            glyph-atlas-repeat.log
            glyph-atlas-equivalence.log
            glyph-atlas-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build focused tests under sanitizers
        run: >-
          cmake --build build-sanitized --parallel 2 --target
          zevryon-glyph-atlas-submission-tests
          zevryon-glyph-atlas-equivalence-tests
      - name: Run focused tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^glyph-atlas-(submission|equivalence)-tests$' --output-on-failure

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: brew install harfbuzz
      - name: Configure AppleClang Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build benchmark and focused tests
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-glyph-atlas-submission-tests \
            zevryon-glyph-atlas-equivalence-tests \
            zevryon-glyph-atlas-submission-benchmark \
            2>&1 | tee apple-glyph-atlas-build.log
          ctest --test-dir build -R '^glyph-atlas-(submission|equivalence)-tests$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-glyph-atlas-submission-appleclang-${{ github.sha }}
          path: apple-glyph-atlas-build.log
          if-no-files-found: warn
