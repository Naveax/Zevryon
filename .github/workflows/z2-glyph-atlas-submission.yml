name: z2-glyph-atlas-submission

on:
  pull_request:
    paths:
      - '.github/workflows/z2-glyph-atlas-submission.yml'

permissions:
  contents: write

jobs:
  patch-empty-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/z2f-bounded-device-raster-execution
          fetch-depth: 0
      - name: Canonicalize empty raster sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/device_raster_backend.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''            GlyphRasterSourceRecord source;
            source.key = job.key;
            source.payload_offset = offset;
            source.payload_size = current.payload_size;
            source.width = current.width;
            source.height = current.height;
            source.row_bytes = current.row_bytes;
            source.bearing_x = current.bearing_x;
            source.bearing_y = current.bearing_y;
            source.format = current.format;
            source.flags = (current.flags & kDeviceGlyphRasterMetricsEmpty) != 0U ? 1U : 0U;
            source.content_checksum = fnv1a64(destination);
'''
          new = '''            const bool empty =
                (current.flags & kDeviceGlyphRasterMetricsEmpty) != 0U;
            GlyphRasterSourceRecord source;
            source.key = job.key;
            source.payload_offset = empty ? 0U : offset;
            source.payload_size = current.payload_size;
            source.width = current.width;
            source.height = current.height;
            source.row_bytes = current.row_bytes;
            source.bearing_x = current.bearing_x;
            source.bearing_y = current.bearing_y;
            source.format = current.format;
            source.flags = empty ?
                static_cast<std::uint8_t>(kGlyphRasterSourceEmpty) : 0U;
            source.content_checksum = empty ? 0U : fnv1a64(destination);
'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('expected empty-raster publication block not found')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/device_raster_backend.cpp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Canonicalize empty raster source metadata"
          git push origin HEAD:work/z2f-bounded-device-raster-execution
