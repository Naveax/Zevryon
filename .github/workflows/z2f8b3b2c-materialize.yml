name: z2f8b3b2c-materialize

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Verify and extract production payload
        shell: bash
        run: |
          set -euo pipefail
          cat .z2f8b3b2c/part00 .z2f8b3b2c/part01 .z2f8b3b2c/part02 \
            | base64 --decode > "$RUNNER_TEMP/z2f8b3b2c.tar.gz"
          echo "6a48f63cc0ec650588217d810afc58dd1e8416d6dc2e4fbed7af328b0232b287  $RUNNER_TEMP/z2f8b3b2c.tar.gz" \
            | sha256sum --check --strict
          tar -tzf "$RUNNER_TEMP/z2f8b3b2c.tar.gz" | sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          cmake/native_metal_shader_execution.cmake
          docs/Z2F8B3B2C_REAL_METAL_INTEGER_SHADER_EXECUTION.md
          shaders/native_shader_execution_metal.metal
          src/native_shader_execution_metal.mm
          src/native_shader_execution_metal_benchmark_main.cpp
          tests/native_shader_execution_metal_tests.cpp
          tools/embed_binary.py
          EOF
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          tar -xzf "$RUNNER_TEMP/z2f8b3b2c.tar.gz"
      - name: Publish source and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            cmake/native_metal_shader_execution.cmake \
            docs/Z2F8B3B2C_REAL_METAL_INTEGER_SHADER_EXECUTION.md \
            shaders/native_shader_execution_metal.metal \
            src/native_shader_execution_metal.mm \
            src/native_shader_execution_metal_benchmark_main.cpp \
            tests/native_shader_execution_metal_tests.cpp \
            tools/embed_binary.py
          git rm -r .z2f8b3b2c
          git commit -m "Z2F-8B3B2C: materialize real Metal shader execution"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
