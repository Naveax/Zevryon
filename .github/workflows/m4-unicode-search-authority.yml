name: M4 Unicode Search Authority

on:
  push:
    branches:
      - "agent/m4-bounded-search"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m4-unicode-search-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unicode-17-authority:
    name: Unicode 17 normalization authority generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Generate pinned Unicode 17 authority
        run: >-
          python3 scripts/m4_unicode_search_authority.py
          --output-dir evidence/m4/unicode-search
          --head-sha "${{ github.sha }}"
      - name: Stage generated production table
        run: >-
          cp evidence/m4/unicode-search/unicode_search_normalization_data.generated.hpp
          src/unicode_search_normalization_data.generated.hpp
      - name: Compile strict normalization conformance harness
        run: >-
          g++ -std=c++20 -O2 -DNDEBUG
          -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror
          -Isrc
          src/unicode_search_normalizer.cpp
          tests/unicode_search_normalization_conformance.cpp
          -o evidence/m4/unicode-search/unicode-search-normalization-conformance
      - name: Run official Unicode 17 normalization conformance
        run: >-
          evidence/m4/unicode-search/unicode-search-normalization-conformance
          evidence/m4/unicode-search/NormalizationTest.txt
          | tee evidence/m4/unicode-search/conformance.txt
      - name: Publish generated production table when changed
        shell: bash
        run: |
          set -euo pipefail
          git add src/unicode_search_normalization_data.generated.hpp
          if git diff --cached --quiet; then
            git rev-parse HEAD > evidence/m4/unicode-search/published-commit.txt
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M4: publish Unicode 17 normalization data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD > evidence/m4/unicode-search/published-commit.txt
      - name: Upload Unicode search authority
        uses: actions/upload-artifact@v4
        with:
          name: m4-unicode-search-${{ github.sha }}
          path: evidence/m4/unicode-search
          if-no-files-found: error
