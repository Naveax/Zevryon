name: z2-shader-draw-packet

on:
  pull_request:
    paths:
      - '.github/workflows/z2-shader-draw-packet.yml'
      - 'cmake/shader_draw_packet.cmake'
      - 'src/shader_draw_packet*'
      - 'tests/shader_draw_packet*'
      - 'docs/Z2F8B3B1_SHADER_DRAW_PACKET.md'
      - 'CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: z2-shader-draw-packet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build focused targets
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-shader-draw-packet-tests \
            zevryon-shader-draw-packet-equivalence-tests \
            zevryon-shader-draw-packet-benchmark \
            2>&1 | tee shader-draw-packet-build.log
      - name: Repeat functional certification
        run: for run in $(seq 1 20); do ./build/zevryon-shader-draw-packet-tests; done
      - name: Run independent packet and readback oracle
        run: ./build/zevryon-shader-draw-packet-equivalence-tests
      - name: Run three benchmark distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-shader-draw-packet-benchmark 512 > "shader-draw-packet-benchmark-${run}.txt"
          done
      - name: Enforce exact topology and latency gates
        run: |
          python3 - <<'PY'
          def load(path):
              values = {}
              with open(path, encoding='utf-8') as handle:
                  for line in handle:
                      key, value = line.strip().split('=', 1)
                      values[key] = value
              return values

          rows = [load(f'shader-draw-packet-benchmark-{run}.txt') for run in range(1, 4)]
          for row in rows:
              assert int(row['iterations']) == 512
              assert int(row['samples']) == 512
              assert int(row['commands']) == 68
              assert int(row['scissors']) == 1
              assert int(row['fill_instances']) == 65
              assert int(row['glyph_instances']) == 240
              assert int(row['cold_uploads']) == 3
              assert int(row['cold_payload_bytes']) == 32768
              assert int(row['cold_packet_bytes']) == 52640
              assert int(row['hot_packet_bytes']) == 19704
              assert int(row['resident_pages']) == 3
              assert int(row['resident_atlas_bytes']) == 49152
              assert int(row['cold_packet_checksum']) == 7689218843981859463
              assert int(row['hot_packet_checksum']) == 7497151657818821303
              p50 = float(row['p50_ms'])
              p95 = float(row['p95_ms'])
              p99 = float(row['p99_ms'])
              maximum = float(row['max_ms'])
              assert 0.0 < p50 <= p95 <= p99 <= maximum
              assert p95 <= 2.0, row
              assert p99 <= 4.0, row
              assert maximum <= 20.0, row
          print({
              'p50_ms': [float(row['p50_ms']) for row in rows],
              'p95_ms': [float(row['p95_ms']) for row in rows],
              'p99_ms': [float(row['p99_ms']) for row in rows],
              'maximum_ms': [float(row['max_ms']) for row in rows],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-shader-draw-packet-${{ github.sha }}
          path: |
            shader-draw-packet-build.log
            shader-draw-packet-benchmark-*.txt
          if-no-files-found: warn

  appleclang:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure AppleClang build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build and run focused targets
        run: |
          cmake --build build --parallel 2 --target zevryon-shader-draw-packet-tests zevryon-shader-draw-packet-equivalence-tests zevryon-shader-draw-packet-benchmark
          ./build/zevryon-shader-draw-packet-tests
          ./build/zevryon-shader-draw-packet-equivalence-tests
          ./build/zevryon-shader-draw-packet-benchmark 32

  msvc:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC build
        shell: pwsh
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build focused targets
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target zevryon-shader-draw-packet-tests
          cmake --build build --config Release --parallel 2 --target zevryon-shader-draw-packet-equivalence-tests
          cmake --build build --config Release --parallel 2 --target zevryon-shader-draw-packet-benchmark
      - name: Run focused targets
        shell: pwsh
        run: |
          ./build/Release/zevryon-shader-draw-packet-tests.exe
          ./build/Release/zevryon-shader-draw-packet-equivalence-tests.exe
          ./build/Release/zevryon-shader-draw-packet-benchmark.exe 32

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DZEVRYON_ENABLE_SANITIZERS=ON
      - name: Build focused targets
        run: cmake --build build --parallel 2 --target zevryon-shader-draw-packet-tests zevryon-shader-draw-packet-equivalence-tests
      - name: Run under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./build/zevryon-shader-draw-packet-tests
          ./build/zevryon-shader-draw-packet-equivalence-tests
