name: Z1 bidi character authority

on:
  pull_request:
    paths:
      - 'src/bidi_*'
      - 'src/unicode_bidi*'
      - 'docs/Z1D_STATUS.md'
      - '.github/workflows/z1-bidi-character-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-character-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install focused build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libfontconfig1-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-core
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build character authority
        run: cmake --build build --parallel 2 --target zevryon-bidi-visual-conformance
      - name: Fetch pinned Unicode 17 character corpus
        run: |
          curl --fail --location --retry 3 --output BidiCharacterTest.txt https://www.unicode.org/Public/17.0.0/ucd/BidiCharacterTest.txt
          head -n 1 BidiCharacterTest.txt | grep -F '# BidiCharacterTest-17.0.0.txt'
          echo 'a3e6e905ab5afbe318a96df5401d0372a04cd73ef139ab5e3cf0ae241c255488  BidiCharacterTest.txt' | sha256sum --check --strict
          test "$(wc -c < BidiCharacterTest.txt)" -gt 6000000
          sed -n '87p' BidiCharacterTest.txt
      - name: Execute full character authority
        run: build/zevryon-bidi-visual-conformance --character-test BidiCharacterTest.txt

  windows-character-authority:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DBUILD_TESTING=ON
          -DZEVRYON_ENABLE_RUST_CORE=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build character authority
        shell: pwsh
        run: cmake --build build --config Release --target zevryon-bidi-visual-conformance --parallel 2
      - name: Fetch pinned Unicode 17 character corpus
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 --output BidiCharacterTest.txt https://www.unicode.org/Public/17.0.0/ucd/BidiCharacterTest.txt
          $first = Get-Content BidiCharacterTest.txt -TotalCount 1
          if ($first -ne '# BidiCharacterTest-17.0.0.txt') { throw "Unicode corpus header drifted: $first" }
          if ((Get-Item BidiCharacterTest.txt).Length -le 6000000) { throw 'Unicode character corpus truncated' }
          $hash = (Get-FileHash BidiCharacterTest.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'a3e6e905ab5afbe318a96df5401d0372a04cd73ef139ab5e3cf0ae241c255488') { throw "BidiCharacterTest SHA-256 drifted: $hash" }
          (Get-Content BidiCharacterTest.txt)[86]
      - name: Execute full character authority
        shell: pwsh
        run: .\build\Release\zevryon-bidi-visual-conformance.exe --character-test BidiCharacterTest.txt
