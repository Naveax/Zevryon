name: z2-glyph-cluster-map

on:
  pull_request:
    paths:
      - '.github/workflows/z2-glyph-cluster-map.yml'
      - 'cmake/harfbuzz_shaping.cmake'
      - 'src/glyph_cluster_map.*'
      - 'src/multi_run_harfbuzz_shaper.*'
      - 'src/resource_ledger.*'
      - 'tests/glyph_cluster_map_tests.cpp'
      - 'docs/Z2C3A_BOUNDED_GLYPH_CLUSTER_MAP.md'
  workflow_dispatch:

concurrency:
  group: z2-glyph-cluster-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build glyph-cluster map and dependencies
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-glyph-cluster-map-tests \
            zevryon-multi-run-harfbuzz-shaper-tests \
            2>&1 | tee glyph-cluster-map-build.log
      - name: Repeat glyph-cluster topology certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^glyph-cluster-map-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee glyph-cluster-map-repeat.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-glyph-cluster-map-${{ github.sha }}
          path: |
            glyph-cluster-map-build.log
            glyph-cluster-map-repeat.log
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON -DZEVRYON_ENABLE_SANITIZERS=ON
      - name: Build glyph-cluster map under sanitizers
        run: cmake --build build-sanitized --parallel 2 --target zevryon-glyph-cluster-map-tests
      - name: Run glyph-cluster map under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^glyph-cluster-map-tests$' --output-on-failure
