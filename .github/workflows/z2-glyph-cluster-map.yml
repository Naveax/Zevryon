name: z2-glyph-cluster-map

on:
  pull_request:
    paths:
      - '.github/workflows/z2-glyph-cluster-map.yml'
      - 'cmake/harfbuzz_shaping.cmake'
      - 'src/glyph_cluster_map.*'
      - 'src/glyph_cluster_map_benchmark_main.cpp'
      - 'src/multi_run_harfbuzz_shaper.*'
      - 'src/resource_ledger.*'
      - 'tests/glyph_cluster_map_tests.cpp'
      - 'docs/Z2C3A_BOUNDED_GLYPH_CLUSTER_MAP.md'
  workflow_dispatch:

concurrency:
  group: z2-glyph-cluster-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure strict Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON
      - name: Build glyph-cluster map, benchmark and dependencies
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target \
            zevryon-glyph-cluster-map-tests \
            zevryon-glyph-cluster-map-benchmark \
            zevryon-multi-run-harfbuzz-shaper-tests \
            2>&1 | tee glyph-cluster-map-build.log
      - name: Repeat glyph-cluster topology certification
        run: |
          set -o pipefail
          ctest --test-dir build -R '^glyph-cluster-map-tests$' \
            --repeat until-fail:20 --output-on-failure \
            2>&1 | tee glyph-cluster-map-repeat.log
      - name: Run three independent 64 KiB distributions
        run: |
          for run in 1 2 3; do
            ./build/zevryon-glyph-cluster-map-benchmark \
              > "glyph-cluster-map-benchmark-${run}.json"
          done
      - name: Enforce exact output, memory and latency gates
        run: |
          python3 - <<'PY'
          import json
          rows = []
          for run in range(1, 4):
              with open(f"glyph-cluster-map-benchmark-{run}.json", encoding="utf-8") as handle:
                  row = json.load(handle)
              assert row["schema"] == "zevryon.glyph-cluster-map-benchmark.v1"
              assert row["input_clusters"] == 65_536
              assert row["input_segments"] == 2_048
              assert row["input_glyphs"] == 40_960
              assert row["owner_clusters"] == 32_768
              assert row["continuation_clusters"] == 32_768
              assert row["output_records"] == 65_536
              assert row["record_bytes"] == 16
              assert row["current_bytes"] == 1_048_576
              assert row["peak_bytes"] == 1_048_576
              assert row["accounting_clean"] is True
              assert row["within_hard_limits"] is True
              assert 0.0 < row["p50_ms"] <= row["p95_ms"] <= row["p99_ms"] <= row["maximum_ms"]
              assert row["p95_ms"] <= 4.0, row
              assert row["p99_ms"] <= 6.0, row
              assert row["maximum_ms"] <= 10.0, row
              rows.append(row)
          assert len({row["checksum"] for row in rows}) == 1
          print({
              "p50_ms": [row["p50_ms"] for row in rows],
              "p95_ms": [row["p95_ms"] for row in rows],
              "p99_ms": [row["p99_ms"] for row in rows],
              "maximum_ms": [row["maximum_ms"] for row in rows],
              "checksum": rows[0]["checksum"],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2-glyph-cluster-map-${{ github.sha }}
          path: |
            glyph-cluster-map-build.log
            glyph-cluster-map-repeat.log
            glyph-cluster-map-benchmark-*.json
          if-no-files-found: warn

  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HarfBuzz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libharfbuzz-dev
      - name: Configure ASan and UBSan build
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DZEVRYON_ENABLE_HARFBUZZ_SHAPING=ON -DZEVRYON_ENABLE_SANITIZERS=ON
      - name: Build glyph-cluster map under sanitizers
        run: cmake --build build-sanitized --parallel 2 --target zevryon-glyph-cluster-map-tests
      - name: Run glyph-cluster map under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R '^glyph-cluster-map-tests$' --output-on-failure
