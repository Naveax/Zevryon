[workspace]
resolver = "2"
members = [
    "crates/zevryon-abi",
    "crates/zevryon-ledger",
    "crates/zevryon-ffi",
    "crates/zevryon-unicode-abi",
    "crates/zevryon-unicode-stream",
    "crates/zevryon-unicode-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
